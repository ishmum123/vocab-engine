<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0ED;--ink:#1B2321;--mute:#5C6B67;--line:#D6DAD7;--card:#FFFFFF;
    --ok:#2F7A5B;--ok-bg:#E4F1EB;--bad:#B4483F;--bad-bg:#FBEAE8;
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Target-language text: the UI font first, then system fonts that cover non-Latin
       scripts (IBM Plex lacks many glyphs; missing ones fall through to system fonts). */
    --wfont: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
      --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
    --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
  body{padding-bottom:calc(64px + var(--safe-b))}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 24px;min-height:calc(100dvh - 64px - var(--safe-b));display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex:0 0 auto}
  h1{font-size:18px;font-weight:600;margin:0}
  .score{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hdrbar{height:3px;border-radius:2px;background:transparent;margin-bottom:12px;flex:0 0 auto;overflow:hidden}
  .hdrbar i{display:block;height:100%;width:0;background:var(--ink);transition:width 0.2s ease}
  @media (prefers-reduced-motion: reduce){ .hdrbar i{transition:none} }
  .themebtn{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--ink);flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;flex:1 1 auto;display:flex;flex-direction:column}
  #panel > .done{display:flex;flex-direction:column;flex:1 1 auto}
  .next:last-child, .primary:last-child, .done .next{margin-top:auto}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .drill-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .q{color:var(--mute);font-size:15px;margin:0 0 10px}
  .big{font-size:52px;line-height:1.3;text-align:center;margin:6px 0 16px;font-weight:500;overflow-wrap:anywhere}
  .med{font-size:22px;line-height:1.5;margin:2px 0 14px}
  .wd{font-family:var(--wfont)}
  .pron{color:var(--mute);font-size:18px;text-align:center;margin:-10px 0 14px}
  .en{color:var(--mute);font-size:15px;text-align:center;margin-top:-8px;margin-bottom:14px}
  .blank{color:var(--mute);letter-spacing:1px}
  .opts{display:grid;gap:8px}
  .opts button{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:17px;color:var(--ink);line-height:1.35;min-height:48px;font-family:var(--font)}
  .opts button b.num{color:var(--mute);font-weight:500;margin-right:8px;font-size:14px}
  .opts button .op{color:var(--mute);font-size:14px;font-weight:400;margin-left:8px}
  .opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .opts-hero button{font-size:18px;padding:18px 18px;min-height:58px;font-weight:500}
  .opts-w button{font-family:var(--wfont)}
  .opts-w button b.num{font-family:var(--font)}
  .hear-stage{display:flex;justify-content:center;margin:14px 0 22px}
  .speaker{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:36px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @keyframes speakerPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .speaker.speaking{animation:speakerPulse 0.9s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .speaker.speaking{animation:none} }
  .reveal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:none;font-size:15px}
  .reveal .rw{font-size:22px;margin-bottom:2px;font-family:var(--wfont)}
  .reveal .rp{color:var(--mute);margin-bottom:2px}
  .next,.primary{margin-top:14px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;min-height:48px;font-family:var(--font)}
  .ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;min-height:44px;font-family:var(--font)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .row button, .chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;color:var(--ink);min-height:44px;font-family:var(--font)}
  .row button.on, .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .replay{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:17px;color:var(--ink);flex:0 0 auto}
  .listen-stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0}
  input[type=text]{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;font-size:19px;background:var(--card);color:var(--ink);font-family:var(--wfont)}
  input[type=text]:focus{outline:3px solid #7AA7D9;outline-offset:1px}
  .diff{font-size:15px;margin-top:6px}
  .wl{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;gap:12px}
  .wl .wd{font-size:22px;flex:0 1 auto;min-width:64px;max-width:48%;overflow-wrap:anywhere}
  .wl .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .wl .pr{font-size:15px;display:block}
  .wl .en{color:var(--mute);font-size:14px;text-align:left;display:block;margin:0}
  table.stats{width:100%;border-collapse:collapse;font-size:15px}
  table.stats td{padding:8px 0;border-bottom:1px solid var(--line)}
  table.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--ink)}
  .path{display:flex;gap:6px;align-items:center;margin-bottom:14px}
  .path .seg{flex:1;text-align:center;font-size:11px;color:var(--mute)}
  .stmt{font-size:15px;line-height:1.5;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .warn{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .done h2{font-size:22px;margin:0 0 10px;font-weight:600}
  .done ul{padding-left:20px;font-size:15px;margin:8px 0}
  .card-teach{margin-bottom:14px}
  .card-teach h3{font-size:17px;margin:0 0 8px;font-weight:600}
  .card-teach p{font-size:15px;color:var(--mute);margin:0 0 10px}
  .rowset{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
  .rowset .wd{font-size:18px;flex:0 1 auto;min-width:52px;max-width:45%;overflow-wrap:anywhere}
  .rowset .pr{flex:1;min-width:0;color:var(--mute);font-size:15px}
  .rowset .en{color:var(--mute);font-size:14px;text-align:right;flex:0 1 auto;min-width:0;margin:0}
  .sent{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .sent .st{font-family:var(--wfont);font-size:17px}
  .sent .sp{color:var(--mute);font-size:14px}
  .sent .se{color:var(--mute);font-size:14px}
  .taplist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .taplist button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:15px;min-height:48px;font-family:var(--wfont)}
  .plist button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:16px;color:var(--ink);min-height:48px;align-items:center}
  .plist .tick{color:var(--ok);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--card);color:var(--ink);font-family:var(--font)}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
  .tabs button{flex:1;background:transparent;border:none;padding:10px 4px 8px;font-size:12px;color:var(--mute);min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font)}
  .tabs button .ic{font-size:20px;line-height:1}
  .tabs button.on{color:var(--ink);font-weight:600}
  .tabs button[hidden]{display:none}
  button{cursor:pointer}
  button:focus-visible, .opts button:focus-visible, [tabindex]:focus-visible{outline:3px solid #7AA7D9;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .reveal{transition:opacity 0.15s ease}
  @media (prefers-reduced-motion: reduce){ .reveal{transition:none} }
  @media (min-width: 900px){
    .wrap{max-width:640px;min-height:0}
    body{padding-bottom:24px}
    .tabs{position:static;left:auto;right:auto;bottom:auto;transform:none;width:640px;max-width:100vw;margin:12px auto 0;padding-bottom:0;border:1px solid var(--line);border-radius:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="htitle">Today</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="score" id="score"></span>
      <button class="themebtn" id="themebtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <div class="hdrbar" id="hdrbar"><i id="hdrbarfill"></i></div>
  <div id="storeWarn" class="warn" hidden></div>
  <div id="panel" class="card"></div>
  <div id="live" aria-live="polite" class="sr-only"></div>
</div>
<nav class="tabs" id="tabs">
  <button data-t="today" class="on"><span class="ic">◷</span>Today</button>
  <button data-t="words"><span class="ic">Aa</span>Words</button>
  <button data-t="sounds"><span class="ic">〜</span>Sounds</button>
  <button data-t="test"><span class="ic">✓</span>Test</button>
  <button data-t="progress"><span class="ic">◔</span>Progress</button>
</nav>

const LESSONS=[{"id":"tones","title":"The four tones","blurb":"Pitch changes the word — mā, má, mǎ, mà are four different words.","cards":[{"h":"Pitch is part of the word","body":"In Mandarin the melody of a syllable is as important as its consonants and vowels. Say the same syllable with four different pitches and you get four unrelated words — nothing else changes.","rows":[["mā","妈","mother"],["má","麻","hemp / numb"],["mǎ","马","horse"],["mà","骂","to scold"]],"say":["妈","麻","马","骂"]},{"h":"The four shapes","body":"Tone 1 is high and flat — hold one pitch like humming. Tone 2 rises like asking \"huh?\". Tone 3 dips low then rises. Tone 4 falls fast and hard, like a short command.","rows":[["mā","妈","tone 1 — high, flat"],["má","麻","tone 2 — rising"],["mǎ","马","tone 3 — low, dipping"],["mà","骂","tone 4 — falling sharply"]],"say":["妈","麻","马","骂"]},{"h":"The neutral tone","body":"Some syllables carry no tone of their own. They're short, light, and borrow their pitch from the syllable before them. Numbered pinyin marks this with a 5.","rows":[["māma","妈妈","mom — second syllable neutral"],["xièxie","谢谢","thanks — second syllable neutral"],["wǒmen","我们","we / us — men is neutral"]],"say":["妈妈","谢谢","我们"]},{"h":"Where the tone mark goes","body":"When a syllable has more than one vowel letter, the mark goes on a or e first; in ou it goes on o; otherwise it goes on the last vowel written.","rows":[["hǎo","好","a beats o"],["méi","没","e comes first"],["dōu","都","ou → mark on o"],["duì","对","no a/e/o → last vowel"]],"say":["好","没","都","对"]}],"items":[{"t":"mc","q":"Which tone do you hear?","say":"妈","opts":["1","2","3","4"],"a":"1","rv":"mā — 妈 mother — tone 1, high and flat"},{"t":"mc","q":"Which tone do you hear?","say":"麻","opts":["1","2","3","4"],"a":"2","rv":"má — 麻 hemp — tone 2, rising"},{"t":"mc","q":"Which tone do you hear?","say":"马","opts":["1","2","3","4"],"a":"3","rv":"mǎ — 马 horse — tone 3, low and dipping"},{"t":"mc","q":"Which tone do you hear?","say":"骂","opts":["1","2","3","4"],"a":"4","rv":"mà — 骂 scold — tone 4, falling sharply"},{"t":"mc","q":"In 你好吗 (nǐ hǎo ma), what tone is 吗?","say":"你好吗","opts":["1","2","3","neutral"],"a":"neutral","rv":"吗 (ma) is always a light, toneless question particle"},{"t":"mc","q":"好 is written hǎo, not hoǎ. Why does the mark sit on a?","opts":["a and e always take priority over other vowels","the mark always goes on the last vowel","the mark always goes on the first vowel"],"a":"a and e always take priority over other vowels","rv":"Rule: a/e first, then ou → o, otherwise the last vowel"},{"t":"mc","q":"都 is written dōu. Where does the tone mark go in the combination 'ou'?","opts":["on o","on u","no mark is needed"],"a":"on o","rv":"ou is a special case: the mark always lands on o"},{"t":"mc","q":"Which tone falls sharply from high to low, like a sharp command?","opts":["1","2","3","4"],"a":"4","rv":"Tone 4 is the fast falling tone"}]},{"id":"finals-simple","title":"Simple finals: a o e i u ü","blurb":"Six pure vowel sounds — including the tricky ü.","cards":[{"h":"Six basic vowels","body":"These are the building blocks every other final is made from. Say each one on its own before you try it in a word.","rows":[["bā","八","eight — a"],["wǒ","我","I / me — o"],["hē","喝","to drink — e"],["nǐ","你","you — i"],["bù","不","no / not — u"],["qù","去","to go — ü, written u after q"]],"say":["八","我","喝","你","不","去"]},{"h":"The ü sound","body":"Round your lips like you're about to say u, but keep your tongue where it is for i. That combination is ü. English has no equivalent — most learners' first mistake is swapping it for u.","rows":[["lù","路","road — u"],["lǜ","绿","green — ü"]],"say":["路","绿"]}],"items":[{"t":"mc","q":"What is the final in 我 (wǒ)?","say":"我","opts":["o","e","u"],"a":"o","rv":"我 = w + o"},{"t":"mc","q":"What is the final in 喝 (hē)?","say":"喝","opts":["e","o","a"],"a":"e","rv":"喝 = h + e"},{"t":"mc","q":"What is the final in 你 (nǐ)?","say":"你","opts":["i","u","ü"],"a":"i","rv":"你 = n + i"},{"t":"mc","q":"What is the final in 不 (bù)?","say":"不","opts":["u","o","ü"],"a":"u","rv":"不 = b + u"},{"t":"mc","q":"What is the final in 去 (qù)?","say":"去","opts":["ü","u","i"],"a":"ü","rv":"去 is spelled qu but pronounced with ü — after q the dots are dropped"},{"t":"mc","q":"Which word do you hear?","say":"绿","opts":["lù","lǜ","nǚ"],"a":"lǜ","rv":"绿 (lǜ) — rounded lips, tongue at the i position"},{"t":"mc","q":"After j, q, or x, how is ü written?","opts":["ü","u","yu"],"a":"u","rv":"The dots are dropped: ju, qu, xu are all really ü sounds"},{"t":"mc","q":"Which is the correctly spelled pinyin for 女 (woman)?","opts":["nǚ","nu","nv3"],"a":"nǚ","rv":"女 keeps its umlaut because it has no j/q/x before it"}]},{"id":"initials-bpmfdtnl","title":"Initials: b p m f · d t n l","blurb":"Aspiration — the puff-of-air test that splits b/p and d/t.","cards":[{"h":"Aspirated vs. unaspirated","body":"b and p use the same lip position — the only difference is a puff of air. b has none, p has a strong burst. Hold a hand or tissue in front of your mouth: it barely moves for b, but jumps for p. The same pairing applies to d/t.","rows":[["bà","爸","dad — b, no puff of air"],["pà","怕","to fear — p, puff of air"],["dà","大","big — d, no puff of air"],["tā","他","he / she — t, puff of air"]],"say":["爸","怕","大","他"]},{"h":"m, f, n, l","body":"m and n are nasal — air goes through the nose, lips closed for m, tongue tip on the ridge behind the teeth for n. f is like English f. l is a clear tongue-tip l, always light, never the 'dark l' at the end of English 'ball'.","rows":[["mā","妈","mother — lips together, nasal"],["fàn","饭","meal — like English f"],["nǐ","你","you — tongue tip on the ridge"],["lái","来","to come — clear, light l"]],"say":["妈","饭","你","来"]}],"items":[{"t":"mc","q":"Which initial do you hear?","say":"爸","opts":["b","p","m"],"a":"b","rv":"b — no puff of air"},{"t":"mc","q":"Which initial do you hear?","say":"怕","opts":["b","p","f"],"a":"p","rv":"p — strong puff of air"},{"t":"mc","q":"Which initial do you hear?","say":"大","opts":["d","t","n"],"a":"d","rv":"d — no puff of air"},{"t":"mc","q":"Which initial do you hear?","say":"他","opts":["d","t","l"],"a":"t","rv":"t — strong puff of air"},{"t":"mc","q":"Which word do you hear?","say":"你","opts":["nǐ","lǐ","dǐ"],"a":"nǐ","rv":"你 (nǐ) — tongue tip on the ridge, nasal"},{"t":"mc","q":"Which is the correctly spelled pinyin for 'meal'?","opts":["fàn","hàn","fann"],"a":"fàn","rv":"饭 is fàn — f like English f"},{"t":"mc","q":"Which initial does 来 (lái) start with?","say":"来","opts":["n","l","r"],"a":"l","rv":"来 (lái) — clear, light l"},{"t":"mc","q":"Hold a tissue in front of your mouth. Which sound makes it flutter?","opts":["b","p","d"],"a":"p","rv":"p is aspirated: a burst of air follows the lip release"}]},{"id":"initials-sibilants","title":"g k h · the three sibilant rows","blurb":"z c s vs. zh ch sh r vs. j q x — the classic trap for English speakers.","cards":[{"h":"g, k, h","body":"These come from the back of the throat, like English g, k, h, but crisper.","rows":[["gè","个","measure word — g"],["kě","可","can, as in 可以 — k"],["hē","喝","to drink — h"]],"say":["个","可","喝"]},{"h":"Three rows, three tongue shapes","body":"z c s sit with the tongue tip flat behind the lower teeth, like a soft English 'ds/ts/s'. zh ch sh r curl the tongue tip back without touching anything — the single hardest sound for English speakers to place. j q x are flat and forward, always followed by i or ü, close to English 'j/ch/sh' but lighter.","rows":[["zài","在","at / in — z, flat tongue"],["cái","才","only then — c, flat tongue"],["sān","三","three — s, flat tongue"],["zhè","这","this — zh, tongue curled back"],["chī","吃","to eat — ch, tongue curled back"],["shì","是","to be — sh, tongue curled back"],["rì","日","sun / day — r, tongue curled back"],["jiā","家","home — j, flat and forward"],["qī","七","seven — q, flat and forward"],["xiè","谢","thank, as in 谢谢 — x, flat and forward"]],"say":["在","才","三","这","吃","是","日","家","七","谢"]}],"items":[{"t":"mc","q":"Which word do you hear?","say":"吃","opts":["zhī","chī","cī","xī"],"a":"chī","rv":"吃 (chī) — retroflex, tongue curled back with a puff of air"},{"t":"mc","q":"Which word do you hear?","say":"是","opts":["sì","shì","xì"],"a":"shì","rv":"是 (shì) — retroflex sh, tongue curled back"},{"t":"mc","q":"Which word do you hear?","say":"七","opts":["qī","chī","cī","xī"],"a":"qī","rv":"七 (qī) — flat, forward tongue, always before i/ü"},{"t":"mc","q":"j, q, and x can only be followed by which vowels?","opts":["i or ü","a or o","any vowel"],"a":"i or ü","rv":"This row exists only before i and ü — no jia-without-i, no qa, no xo"},{"t":"mc","q":"Which initial does 这 (zhè) start with?","say":"这","opts":["z","zh","j"],"a":"zh","rv":"这 (zhè) — retroflex zh"},{"t":"mc","q":"Which initial does 在 (zài) start with?","say":"在","opts":["z","zh","j"],"a":"z","rv":"在 (zài) — flat-tongue z"},{"t":"mc","q":"Which initial does 家 (jiā) start with?","say":"家","opts":["z","zh","j"],"a":"j","rv":"家 (jiā) — flat, forward j"},{"t":"mc","q":"For zh, ch, sh, r, where does the tongue tip go?","opts":["curled back, not touching anything","flat against the back of the teeth","pressed to the roof at the front"],"a":"curled back, not touching anything","rv":"Retroflex sounds: tongue curls back into the mouth, floating"}]},{"id":"finals-compound","title":"Compound finals: ai ei ao ou · ia ie ua uo üe","blurb":"Two vowel sounds glide smoothly into one syllable.","cards":[{"h":"Gliding vowels","body":"Each of these is a smooth slide from the first vowel sound toward the second — don't pause in the middle. Say them slowly at first, then speed up until it's one motion.","rows":[["bái","白","white — ai"],["méi","没","not have — ei"],["hǎo","好","good — ao"],["dōu","都","all — ou"],["jiā","家","home — ia"],["xiě","写","to write — ie"],["huà","话","speech — ua"],["duō","多","many — uo"],["xué","学","to study — üe, written ue after x"]],"say":["白","没","好","都","家","写","话","多","学"]}],"items":[{"t":"mc","q":"Which final does 白 (bái) have?","say":"白","opts":["ai","ei","ao"],"a":"ai","rv":"白 (bái) — ai glide"},{"t":"mc","q":"Which final does 好 (hǎo) have?","say":"好","opts":["ai","ao","ou"],"a":"ao","rv":"好 (hǎo) — ao glide"},{"t":"mc","q":"Which final does 都 (dōu) have?","say":"都","opts":["ao","ou","uo"],"a":"ou","rv":"都 (dōu) — ou glide"},{"t":"mc","q":"Which final does 写 (xiě) have?","say":"写","opts":["ie","ia","üe"],"a":"ie","rv":"写 (xiě) — ie glide"},{"t":"mc","q":"学 is spelled xue. What is its final actually pronounced as?","say":"学","opts":["üe","ue, like English 'cue'","oo"],"a":"üe","rv":"After x the ü loses its dots but keeps its sound"},{"t":"mc","q":"Which is the correctly spelled pinyin for 'many' (duō)?","opts":["duo","dwo","duou"],"a":"duo","rv":"多 is duō — u glides into o"},{"t":"mc","q":"Which final does 话 (huà) have?","say":"话","opts":["ua","uo","ia"],"a":"ua","rv":"话 (huà) — ua glide"},{"t":"mc","q":"In 好 (hǎo), which letter carries the tone mark?","opts":["h","a","o"],"a":"a","rv":"a always outranks o for the tone mark"}]},{"id":"finals-nasal","title":"Nasal finals: an en ang eng ong","blurb":"-n touches the tongue tip; -ng doesn't touch anything.","cards":[{"h":"-n vs -ng","body":"For -n, the tongue tip presses against the ridge behind your upper teeth, same as English 'n'. For -ng, the tongue tip touches nothing — the back of the tongue rises and the sound is nasal, like English 'sing'. Mixing these up is one of the most common mistakes for English speakers.","rows":[["màn","慢","slow — an"],["mén","门","door — en"],["máng","忙","busy — ang"],["péng","朋","friend, as in 朋友 — eng"],["hóng","红","red — ong"]],"say":["慢","门","忙","朋","红"]}],"items":[{"t":"mc","q":"Which word do you hear?","say":"慢","opts":["màn","máng","wàn"],"a":"màn","rv":"慢 (màn) — tongue tip touches the ridge"},{"t":"mc","q":"Which word do you hear?","say":"忙","opts":["màn","máng","fáng"],"a":"máng","rv":"忙 (máng) — tongue tip touches nothing"},{"t":"mc","q":"Which final does 红 (hóng) have?","say":"红","opts":["an","ang","ong"],"a":"ong","rv":"红 (hóng) — ong, lips rounded"},{"t":"mc","q":"For -ng, does the tongue tip touch the roof of the mouth?","opts":["yes","no","only sometimes"],"a":"no","rv":"-ng is made entirely with the back of the tongue"},{"t":"mc","q":"Which final does 门 (mén) have?","say":"门","opts":["en","eng","an"],"a":"en","rv":"门 (mén) — en, tongue tip touches the ridge"},{"t":"mc","q":"Which final does 朋 (péng) have?","say":"朋","opts":["en","eng","ang"],"a":"eng","rv":"朋 (péng) — eng, tongue tip touches nothing"},{"t":"mc","q":"Which is the correctly spelled pinyin for 'busy' (máng)?","opts":["mang","manng","mng"],"a":"mang","rv":"忙 is máng"},{"t":"mc","q":"Which word do you hear?","say":"门","opts":["mén","méng","měn"],"a":"mén","rv":"门 (mén) ends in -n, not -ng"}]},{"id":"finals-i-row","title":"i-row finals: ian in iang ing iong iao iu","blurb":"Adding nasal and glide endings onto i.","cards":[{"h":"Building on i","body":"These finals all start from the i sound and add a nasal or glide ending. Watch the -n/-ng pairs again: ian vs iang, in vs ing.","rows":[["tiān","天","sky / day — ian"],["xīn","心","heart — in"],["liǎng","两","two, a couple — iang"],["míng","名","name, as in 名字 — ing"],["xiǎo","小","small — iao"],["jiǔ","九","nine — iu, shortened from iou"]],"say":["天","心","两","名","小","九"]}],"items":[{"t":"mc","q":"Which final does 天 (tiān) have?","say":"天","opts":["ian","in","iang"],"a":"ian","rv":"天 (tiān) — ian"},{"t":"mc","q":"Which final does 心 (xīn) have?","say":"心","opts":["in","ing","ian"],"a":"in","rv":"心 (xīn) — in, tongue tip touches the ridge"},{"t":"mc","q":"Which final does 两 (liǎng) have?","say":"两","opts":["iang","ing","iong"],"a":"iang","rv":"两 (liǎng) — iang"},{"t":"mc","q":"Which final does 名 (míng) have?","say":"名","opts":["in","ing","ian"],"a":"ing","rv":"名 (míng) — ing, back of the tongue only"},{"t":"mc","q":"九 (jiǔ) is really 'jiou' shortened to what spelling?","opts":["jiu","jio","jou"],"a":"jiu","rv":"iou shortens to iu when written; the tone mark lands on u"},{"t":"mc","q":"Which final does 小 (xiǎo) have?","say":"小","opts":["iao","iu","ia"],"a":"iao","rv":"小 (xiǎo) — iao"},{"t":"mc","q":"Which word do you hear?","say":"心","opts":["xīn","xīng","xín"],"a":"xīn","rv":"心 (xīn) ends in -n"},{"t":"mc","q":"Which word do you hear?","say":"名","opts":["mín","míng","mǐn"],"a":"míng","rv":"名 (míng) ends in -ng"}]},{"id":"finals-u-row","title":"u/ü-row finals and spelling shortcuts","blurb":"uai ui uan un uang üan ün, plus the y/w and jqx spelling rules.","cards":[{"h":"u/ü-row finals","body":"Two of these are shortened in writing: uei becomes ui, and uen becomes un. Say the full form once, then the short written form — the sound doesn't change.","rows":[["kuài","快","fast — uai"],["duì","对","correct — uei written ui"],["duǎn","短","short — uan"],["chūn","春","spring — uen written un"],["huáng","黄","yellow — uang"],["quán","全","whole, entire — üan written uan after q"],["qún","裙","skirt — ün written un after q"]],"say":["快","对","短","春","黄","全","裙"]},{"h":"No bare vowels: the y/w rule","body":"A syllable can't start with a naked i, u, or ü — pinyin adds y or w in front instead. i alone becomes yi, u alone becomes wu, ü alone becomes yu.","rows":[["yī","一","one — i alone → yi"],["wǔ","五","five — u alone → wu"],["yǔ","雨","rain — ü alone → yu"],["wèn","问","to ask — en alone → wen"]],"say":["一","五","雨","问"]}],"items":[{"t":"mc","q":"对 (duì) is really 'duei' shortened to what spelling?","opts":["dui","due","dei"],"a":"dui","rv":"uei shortens to ui; the tone mark lands on i"},{"t":"mc","q":"春 (chūn) is really 'chuen' shortened to what spelling?","opts":["chun","chuen","chon"],"a":"chun","rv":"uen shortens to un after an initial consonant"},{"t":"mc","q":"全 (quán) — why are there no dots over the u?","opts":["ü is written u after j, q, x","q can't be followed by ü","it's a typo"],"a":"ü is written u after j, q, x","rv":"quán is really qüán — the umlaut is dropped but the ü sound stays"},{"t":"mc","q":"一 (yī) — why does it start with y instead of a bare i?","opts":["pinyin syllables can't start with a bare i","y changes the vowel sound","it's random"],"a":"pinyin syllables can't start with a bare i","rv":"i, u, and ü always get a y/w when they start a syllable alone"},{"t":"mc","q":"Which is the correctly spelled pinyin for 五 (five)?","say":"五","opts":["wu","u","wo"],"a":"wu","rv":"五 is wǔ — bare u becomes wu"},{"t":"mc","q":"Which is the correctly spelled pinyin for 雨 (rain)?","say":"雨","opts":["yu","ü","yv"],"a":"yu","rv":"雨 is yǔ — bare ü becomes yu"},{"t":"mc","q":"Which final does 快 (kuài) have?","say":"快","opts":["uai","uan","uang"],"a":"uai","rv":"快 (kuài) — uai"},{"t":"mc","q":"Which word do you hear?","say":"短","opts":["duǎn","duǎng","duàn"],"a":"duǎn","rv":"短 (duǎn) ends in -n, not -ng"}]},{"id":"special-syllables","title":"Special syllables: zhi chi shi ri zi ci si · er","blurb":"The 'i' here is a buzz, not a real vowel — plus 儿 and erhua.","cards":[{"h":"A silent placeholder i","body":"After zh ch sh r z c s, the written i is not the vowel you hear elsewhere. It's just a buzzing continuation of the consonant — the tongue never moves to make a separate vowel sound.","rows":[["zhī","知","to know, as in 知道"],["chī","吃","to eat"],["shì","是","to be"],["rì","日","sun / day"],["zì","字","character / word"],["cí","词","word / term"],["sì","四","four"]],"say":["知","吃","是","日","字","词","四"]},{"h":"er and erhua","body":"儿 (ér) is a syllable on its own, made with the tongue curled back. Attached to the end of another syllable it becomes 'erhua' — the two blend into one sound with a retroflex color, common in Beijing speech.","rows":[["èr","二","two"],["ér","儿","son / child suffix"],["yìdiǎnr","一点儿","a little — diǎn + r blend into one syllable"]],"say":["二","儿","一点儿"]}],"items":[{"t":"mc","q":"In zhī, chī, shī, what is the 'i' sound really doing?","opts":["it's a real 'ee' vowel","it's just a buzz — the tongue stays where it is for the consonant","it's silent"],"a":"it's just a buzz — the tongue stays where it is for the consonant","rv":"This i is a placeholder vowel, unlike i in nǐ or jiā"},{"t":"mc","q":"Which word do you hear?","say":"字","opts":["zì","zhì","cì"],"a":"zì","rv":"字 (zì) — flat tongue, not retroflex"},{"t":"mc","q":"Which is the correctly spelled pinyin for 二 (two)?","say":"二","opts":["èr","er4","ar"],"a":"èr","rv":"二 is èr — tongue curled back for the whole syllable"},{"t":"mc","q":"一点儿 sounds like one syllable ending in what?","opts":["a retroflex -r color","two separate, clearly split syllables","a silent, unheard r"],"a":"a retroflex -r color","rv":"Erhua fuses the r into the syllable before it"},{"t":"mc","q":"Which word do you hear?","say":"知","opts":["zhī","zī","chī"],"a":"zhī","rv":"知 (zhī) — retroflex zh"},{"t":"mc","q":"Which word do you hear?","say":"词","opts":["cí","chí","sí"],"a":"cí","rv":"词 (cí) — flat tongue c, not retroflex"},{"t":"mc","q":"Which word do you hear?","say":"是","opts":["shì","sì","xì"],"a":"shì","rv":"是 (shì) — retroflex sh"},{"t":"mc","q":"Which word do you hear?","say":"日","opts":["rì","lì","zì"],"a":"rì","rv":"日 (rì) — retroflex r, no English equivalent"}]},{"id":"tone-sandhi","title":"Tone sandhi: 3rd+3rd, 不, 一","blurb":"Some tones change in speech but stay the same on the page.","cards":[{"h":"Two 3rd tones in a row","body":"When a 3rd tone is immediately followed by another 3rd tone, the first one is actually spoken as a 2nd tone. The pinyin is still written with both as 3rd tone marks — only the pronunciation shifts.","rows":[["nǐhǎo → níhǎo","你好","hello — written nǐ hǎo, spoken ní hǎo"],["hěnhǎo → hénhǎo","很好","very good — written hěn hǎo, spoken hén hǎo"]],"say":["你好","很好"]},{"h":"不 (bù) changes before a 4th tone","body":"不 is normally 4th tone. But when the next syllable is also 4th tone, 不 shifts to 2nd tone (bú) to avoid two hard falls in a row. Before any other tone it stays bù.","rows":[["bù chī","不吃","don't eat — chī is 1st tone, so bù stays"],["bú duì","不对","not correct — duì is 4th tone, so bù → bú"]],"say":["不吃","不对"]},{"h":"一 (yī) changes with its neighbor","body":"一 is 1st tone when counting, at the end of a word, or as an ordinal. Before a 4th-tone syllable it becomes yí (2nd tone). Before a 1st-, 2nd-, or 3rd-tone syllable it becomes yì (4th tone).","rows":[["yī","一","one — counting, unchanged"],["yí ge","一个","one (measure word) — gè is 4th tone, so yī → yí"],["yì tiān","一天","one day — tiān is 1st tone, so yī → yì"]],"say":["一","一个","一天"]}],"items":[{"t":"mc","q":"How is 你好 actually pronounced?","opts":["ní hǎo","nǐ hǎo","nì hǎo"],"a":"ní hǎo","rv":"Two 3rd tones in a row: the first becomes 2nd tone in speech"},{"t":"mc","q":"很好 (hěn hǎo) is actually spoken as?","opts":["hén hǎo","hěn hǎo","hèn hǎo"],"a":"hén hǎo","rv":"Same rule: 3rd+3rd → 2nd+3rd when spoken"},{"t":"mc","q":"不对 (bù duì) — how is 不 actually pronounced here?","opts":["bú","bù","bǔ"],"a":"bú","rv":"不 shifts to 2nd tone before another 4th-tone syllable"},{"t":"mc","q":"不吃 (bù chī) — how is 不 actually pronounced here?","opts":["bù","bú","bǔ"],"a":"bù","rv":"不 stays 4th tone before a non-4th-tone syllable"},{"t":"mc","q":"一个 (yí ge) — what tone does 一 change to before this 4th-tone word?","opts":["2nd (yí)","4th (yì)","stays 1st (yī)"],"a":"2nd (yí)","rv":"一 becomes 2nd tone before a 4th-tone syllable"},{"t":"mc","q":"一天 (yì tiān) — what tone does 一 change to before this 1st-tone word?","opts":["4th (yì)","2nd (yí)","stays 1st (yī)"],"a":"4th (yì)","rv":"一 becomes 4th tone before a 1st-, 2nd-, or 3rd-tone syllable"},{"t":"mc","q":"When is 一 pronounced yī, unchanged?","opts":["when counting, at the end of a word, or as an ordinal","always, in every position","only before a 4th tone"],"a":"when counting, at the end of a word, or as an ordinal","rv":"Sandhi only applies when 一 is directly followed by another syllable"},{"t":"mc","q":"Does tone sandhi change how 你好 is written with tone marks?","opts":["no — still written nǐ hǎo, only the spoken pitch shifts","yes — it's written ní hǎo","yes — it's written nì hǎo"],"a":"no — still written nǐ hǎo, only the spoken pitch shifts","rv":"Sandhi is a rule of speech, not of spelling"}]},{"id":"neutral-tone","title":"Neutral tone in words","blurb":"妈妈, 学生, 我们 — light, toneless syllables that lean on the one before.","cards":[{"h":"Short and unstressed","body":"A neutral-tone syllable has no pitch contour of its own — it's short, light, and its exact pitch depends on the tone before it. In numbered pinyin it's written with a 5 and carries no tone mark in written pinyin.","rows":[["māma","妈妈","mom — second syllable neutral"],["xuésheng","学生","student — sheng is neutral"],["wǒmen","我们","we / us — men is neutral"],["xièxie","谢谢","thanks — second syllable neutral"],["péngyou","朋友","friend — you is neutral"]],"say":["妈妈","学生","我们","谢谢","朋友"]}],"items":[{"t":"mc","q":"Which syllable in 妈妈 is neutral tone?","say":"妈妈","opts":["1st","2nd","neither"],"a":"2nd","rv":"妈妈 — the second mā loses its tone and becomes light"},{"t":"mc","q":"What tone is 生 in 学生 (xuésheng)?","say":"学生","opts":["1","2","3","4","neutral"],"a":"neutral","rv":"生 carries no pitch of its own here — it's light and short"},{"t":"mc","q":"In numbered pinyin, neutral tone is written as which digit?","opts":["5","0","no digit at all"],"a":"5","rv":"xue2sheng5 — 5 marks the neutral tone"},{"t":"mc","q":"What tone is 们 in 我们 (wǒmen)?","say":"我们","opts":["1","2","3","neutral"],"a":"neutral","rv":"们 is always neutral tone in this word"},{"t":"mc","q":"Which syllable in 谢谢 is neutral tone?","say":"谢谢","opts":["1st","2nd","neither"],"a":"2nd","rv":"The second xiè loses its falling tone and becomes light"},{"t":"mc","q":"What does a neutral-tone syllable sound like?","opts":["short and light, its pitch shaped by the syllable before it","long and high-pitched","always falling sharply"],"a":"short and light, its pitch shaped by the syllable before it","rv":"Neutral tone has no fixed contour of its own"},{"t":"mc","q":"W <script>
// core.js — language-agnostic vocab trainer logic shared by engine/app.html and the
// node checks. No DOM dependency (runs under Node for tests); exports VocabCore via
// window or module.exports. Everything language-specific comes from the pack
// (see docs/PACK_SCHEMA.md): levels, set size, placement buckets, function words,
// typing rules, TTS locale.
(function(root){
"use strict";

// ------------------------------------------------------------------ utils
function shuffle(a, rng){
  const r = rng || Math.random;
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
const normKey = s => String(s == null ? "" : s).trim().toLowerCase();

// Every render site that shows a word's meaning goes through gloss(), so a future
// pack-level display rule has exactly one place to live.
function gloss(entry){ return String((entry && entry.en) || "").replace(/\s+/g, " ").trim(); }

// first two whitespace-separated words of a gloss, lowercased and stripped of
// punctuation — used to reject near-synonym distractors (two "to eat"-ish glosses).
// Returns "" for a gloss with no latin letters; callers treat "" as "no signal".
function firstTwoWords(en){
  return String(en).toLowerCase().replace(/[^a-z\s]/g,"").trim().split(/\s+/).slice(0,2).join(" ");
}

// ------------------------------------------------------------------ levels
function levelIds(pack){ return (pack.levels||[]).map(l=>String(l.id)); }
function levelIndexMap(pack){ const m = {}; levelIds(pack).forEach((id,i)=>{ m[id] = i; }); return m; }
function levelLabel(pack, id){ const l = (pack.levels||[]).find(x=>String(x.id)===String(id)); return l ? l.label : String(id); }
function setSizeOf(pack){ return pack.setSize || 10; }
function wordsByLevel(words, pack){
  const out = {}; levelIds(pack).forEach(id=>{ out[id] = []; });
  (words||[]).forEach(w=>{ if(out[w.lv]) out[w.lv].push(w); });
  return out;
}
function nSets(list, setSize){ return Math.ceil(list.length / (setSize||10)); }

// ------------------------------------------------------------------ distractors
// Shared "would this distractor also be a right answer?" guards. A word's surfaces are
// its `w` plus every `alt`; two words sharing any surface are homographs to the learner.
function surfaces(e){ return [e.w, ...((e && e.alt) || [])].map(normKey).filter(Boolean); }
function sharesSurface(a, b){ const s = new Set(surfaces(a)); return surfaces(b).some(x=>s.has(x)); }
// Same pronunciation (when both carry pron): indistinguishable in a hear item.
function samePron(a, b){ return !!(a && b && a.pron && b.pron) && normKey(a.pron) === normKey(b.pron); }
// entry: a word; pool: WORDS. Up to 3 other words whose gloss is a plausible wrong
// answer: never the same gloss, never sharing the first two gloss words with the
// answer or with each other, same level preferred over other levels. Never a
// homograph of the answer (shared w/alt surface: the read stimulus would fit both)
// or a homophone (same pron: the hear stimulus would fit both).
function meaningOpts(entry, pool){
  const ansKey = normKey(entry.en);
  const ansFirst2 = firstTwoWords(entry.en);
  const candidates = (pool||[]).filter(v=>v.id!==entry.id && normKey(v.en)!==ansKey && !sharesSurface(v, entry) && !samePron(v, entry));
  const ordered = [...shuffle(candidates.filter(v=>v.lv===entry.lv)), ...shuffle(candidates.filter(v=>v.lv!==entry.lv))];
  function pass(strict){
    const chosen = []; const usedFirst2 = new Set(ansFirst2 ? [ansFirst2] : []); const usedGloss = new Set([ansKey]);
    ordered.forEach(v=>{
      if(chosen.length>=3) return;
      const f2 = firstTwoWords(v.en), g = normKey(v.en);
      if(usedGloss.has(g)) return; // two identical option labels would make the answer ambiguous
      if(strict && f2 && usedFirst2.has(f2)) return;
      chosen.push(v); usedGloss.add(g); if(f2) usedFirst2.add(f2);
    });
    return chosen;
  }
  let chosen = pass(true);
  if(chosen.length<3) chosen = pass(false); // small-pool fallback: keep "not the answer" only
  return chosen.slice(0,3);
}

// entry: a word; pool: WORDS. Up to 3 other words to show as wrong answers when the
// learner sees a meaning and must pick the word (recall, gap). Never the answer's own
// surface form, never a word whose gloss (or first two gloss words) matches the
// answer's — that distractor would also be a correct answer. Preference order:
// same pos AND same level, then same level, then same pos elsewhere, then anything.
// Distractors have distinct displayed `w`; a strict pass also keeps their glosses'
// first two words distinct from each other, relaxed only for tiny pools.
function wordOpts(entry, pool){
  const ansGloss = normKey(entry.en), ansF2 = firstTwoWords(entry.en);
  const hasPos = !!entry.pos;
  const cands = (pool||[]).filter(v =>
    v.id!==entry.id && !sharesSurface(v, entry) && normKey(v.en)!==ansGloss && !(ansF2 && firstTwoWords(v.en)===ansF2));
  const samePos = v => hasPos && v.pos===entry.pos;
  const t1 = cands.filter(v=>v.lv===entry.lv && samePos(v));
  const t2 = cands.filter(v=>v.lv===entry.lv && !samePos(v));
  const t3 = cands.filter(v=>v.lv!==entry.lv && samePos(v));
  const t4 = cands.filter(v=>v.lv!==entry.lv && !samePos(v));
  const ordered = [...shuffle(t1), ...shuffle(t2), ...shuffle(t3), ...shuffle(t4)];
  function pass(strict){
    // Every answer surface is already excluded from `cands`; among distractors only
    // the displayed `w` must differ (their alts are never shown, so sharing one is fine).
    const chosen = []; const usedW = new Set(surfaces(entry)); const usedF2 = new Set();
    for(const v of ordered){
      if(chosen.length>=3) break;
      const k = normKey(v.w), f2 = firstTwoWords(v.en);
      if(usedW.has(k)) continue;
      if(strict && f2 && usedF2.has(f2)) continue;
      chosen.push(v); usedW.add(k); if(f2) usedF2.add(f2);
    }
    return chosen;
  }
  let chosen = pass(true);
  if(chosen.length<3) chosen = pass(false);
  return chosen;
}
// Cloze distractors use the same rules as recall: plausible words, never a second right answer.
const gapOpts = wordOpts;

// sentence: a SENTENCES entry; pool: SENTENCES. Up to 3 other sentences of the same
// level with a different English gloss, preferring ones that share a word id with
// the answer (a plausible near-miss); widens past the level only for tiny pools.
function sentenceOpts(sentence, pool){
  const ansKey = normKey(sentence.en);
  const wordSet = new Set(sentence.words || []);
  const shares = s => (s.words||[]).some(w=>wordSet.has(w));
  const candidates = (pool || []).filter(s => s.id !== sentence.id && s.lv === sentence.lv && normKey(s.en) !== ansKey);
  const chosen = []; const seenEn = new Set([ansKey]);
  function addFrom(list){
    list.forEach(s=>{
      if(chosen.length>=3) return;
      const key = normKey(s.en);
      if(seenEn.has(key)) return;
      seenEn.add(key); chosen.push(s);
    });
  }
  addFrom(shuffle(candidates.filter(shares))); addFrom(shuffle(candidates.filter(s=>!shares(s))));
  if(chosen.length<3) addFrom(shuffle((pool||[]).filter(s=>s.id!==sentence.id)));
  return chosen.slice(0,3);
}

// ------------------------------------------------------------------ typing
// Accent folding: NFD-decompose and drop combining marks (é -> e, ñ -> n, ü -> u).
function foldAccents(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f\u1ab0-\u1aff\u1dc0-\u1dff\u20d0-\u20ff\ufe20-\ufe2f]/g, "").normalize("NFC"); }
// opts: {caseSensitive, foldAccents}. Trims, collapses inner whitespace, unifies
// typographic apostrophes, casefolds unless caseSensitive, accent-folds if asked.
function normalizeTyped(s, opts){
  const o = opts || {};
  let out = String(s == null ? "" : s).normalize("NFC").replace(/[\u2018\u2019\u02bc`]/g, "'").replace(/\s+/g, " ").trim();
  if(!o.caseSensitive) out = out.toLowerCase();
  if(o.foldAccents) out = foldAccents(out);
  return out;
}
function typingEnabled(pack){ return !!(pack && pack.typing); }
// Accents are forgiven when the pack says "lenient" and the word's level is before
// typing.strictFromLevel (or there is no strict level). "strict" never forgives.
function typingLenientFor(entry, pack){
  const t = (pack && pack.typing) || {};
  if((t.accents || "lenient") !== "lenient") return false;
  if(t.strictFromLevel == null) return true;
  const idx = levelIndexMap(pack);
  const strictAt = idx[String(t.strictFromLevel)];
  if(strictAt === undefined) return true;
  const at = idx[String(entry.lv)];
  return at === undefined ? true : at < strictAt;
}
// Accepts entry.w or any entry.alt (plus any `extra` surfaces, e.g. the literal form a
// cloze blank had in its sentence), compared after normalising both sides.
function acceptTyped(input, entry, pack, extra){
  const t = (pack && pack.typing) || {};
  const opts = { caseSensitive: !!t.caseSensitive, foldAccents: typingLenientFor(entry, pack) };
  const got = normalizeTyped(input, opts);
  if(!got) return false;
  const targets = [entry.w, ...(entry.alt||[]), ...(extra||[])];
  return targets.some(x => normalizeTyped(x, opts) === got);
}

// ------------------------------------------------------------------ sentences
const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Apostrophe variants treated as the same symbol when matching sentence text:
// ASCII ', right single quote, modifier letter apostrophe.
const APOS = String.fromCodePoint(39, 0x2019, 0x02bc);
const isApos = c => APOS.indexOf(c) >= 0;
// All occurrences of `surface` in `text`. spaced=true (default): whole-word,
// case-insensitive, apostrophe-variant-insensitive matches; a letter/mark/digit on
// either side disqualifies, except that an apostrophe-final surface ("l'") may run
// straight into the next word and an apostrophe-initial one may follow a letter.
// spaced=false (scripts written without spaces, e.g. Chinese): plain substring.
function findSurface(text, surface, spaced){
  const out = []; const t = String(text), s = String(surface||"");
  if(!s) return out;
  if(spaced === false){
    let i = t.indexOf(s);
    while(i >= 0){ out.push({ start:i, end:i+s.length, text:s }); i = t.indexOf(s, i + s.length); }
    return out;
  }
  const cps = [...s];
  const body = cps.map(c => isApos(c) ? `[${APOS}]` : escapeRe(c)).join("");
  const lb = isApos(cps[0]) ? "" : "(?<![\\p{L}\\p{M}\\p{N}])";
  const la = isApos(cps[cps.length-1]) ? "" : "(?![\\p{L}\\p{M}\\p{N}])";
  const re = new RegExp(lb + body + la, "giu");
  let m; while((m = re.exec(t))){ out.push({ start:m.index, end:m.index+m[0].length, text:m[0] }); }
  return out;
}
// Where word `entry` sits in sentence text. Every form (w and each alt) is searched;
// overlapping hits are one occurrence (e.g. alt "acqua" inside w "l'acqua"). Returns
// the widest hit when there is exactly one occurrence, else null: absent, or visible
// more than once (blanking one occurrence would leave the answer — or an alt form of
// it — in plain sight elsewhere).
function locateWord(sentence, entry, pack){
  const spaced = !pack || pack.spaced !== false;
  const forms = [...new Set([entry.w, ...(entry.alt||[])].filter(Boolean))];
  const hits = [];
  forms.forEach(f => findSurface(sentence.t, f, spaced).forEach(m => hits.push(m)));
  if(!hits.length) return null;
  hits.sort((a,b)=>a.start-b.start || b.end-a.end);
  const clusterEnd = hits[0].end;
  let best = hits[0], end = clusterEnd;
  for(const h of hits.slice(1)){
    if(h.start >= end) return null; // a second, separate occurrence
    end = Math.max(end, h.end);
    if(h.end - h.start > best.end - best.start) best = h;
  }
  return best;
}
// Every surface string a cloze blank must not cut into: all pack words' w/alt plus
// pack.compounds (multi-word or multi-glyph units that aren't drillable words, e.g.
// zh 这个). Cached per wordsById object.
const SURFACE_CACHE = new WeakMap();
function packSurfaces(wordsById, pack){
  let c = SURFACE_CACHE.get(wordsById);
  if(!c || c.pack !== pack){
    const set = new Set();
    Object.values(wordsById).forEach(w => [w.w, ...(w.alt||[])].forEach(x => { if(x) set.add(String(x)); }));
    ((pack && pack.compounds) || []).forEach(x => { if(x) set.add(String(x)); });
    c = { pack, list: [...set] };
    SURFACE_CACHE.set(wordsById, c);
  }
  return c.list;
}
// True if some longer pack surface containing match.text occurs in the sentence
// covering the match's position (为 inside 为什么, 这 inside 这个, per inside "per favore").
function spannedByLonger(sentence, match, wordsById, pack){
  const spaced = !pack || pack.spaced !== false;
  const inner = normKey(match.text);
  for(const s of packSurfaces(wordsById, pack)){
    if(s.length <= match.text.length || normKey(s).indexOf(inner) < 0) continue;
    for(const m of findSurface(sentence.t, s, spaced)){
      if(m.start <= match.start && m.end >= match.end) return true;
    }
  }
  return false;
}
// The blankable match for `entry` in `sentence`, or null (see locateWord and
// spannedByLonger). The one place both gap-candidate selection and the app's gap
// item use, so they can never disagree.
function gapMatch(sentence, entry, wordsById, pack){
  const m = locateWord(sentence, entry, pack);
  if(!m || spannedByLonger(sentence, m, wordsById, pack)) return null;
  return m;
}
// Indices into sentence.words that are legal cloze blanks: a known word at the
// sentence's own level, not a pack function word, not repeated in the sentence (by id),
// and with a gapMatch (visible exactly once, not inside a longer pack word/compound).
function gapCandidateIndices(sentence, wordsById, pack){
  const fw = new Set((pack && pack.functionWords) || []);
  const words = sentence.words || [];
  const counts = {}; words.forEach(w=>{ counts[w] = (counts[w]||0) + 1; });
  const out = [];
  words.forEach((id,i)=>{
    if(fw.has(id) || counts[id] > 1) return;

  return `<div class="warn">This browser has no text-to-speech voice for this language, so listening items show the word instead of playing audio.</div>`;
}

// ===================== speaker icon =====================
function speakerSVG(size){

  </svg>`;
}
const SPEAKER_SVG = speakerSVG(38);
const REPLAY_SVG = speakerSVG(18);
const TEACH_PLAY_SVG = speakerSVG(14);

// ===================== display helpers =====================
// pron is display-only: shown beside a word/sentence when the learner has it on.
const showPron = () => PACK.showPron !== false && prog.showPron !== false;
const pronOf = x => (showPron() && x && x.pron) ? x.pron : "";
function bigWordHTML(entry){

function wordOptHtml(byW){

// ===================== generic drill runner =====================
// item: {kind:'mc'|'type', label, html, opts?, a?, optHtml?, reveal, onAnswer?, mount?, check?, onReveal?}
let D = null;
function drill(items, onDone, summary){ D = { q: shuffle(items.slice()), right:0, seen:0, miss:[], onDone, summary }; dnext(); }
function setScore(answered, total){
  const left = total ? Math.max(0, total - answered) : 0;
  $("score").textContent = (total && left > 0) ? `${left} left` : "";
  const fill = $("hdrbarfill");
  if(!fill) return;
  if(!total){ fill.style.display = "none"; fill.style.width = "0%"; return; }
  fill.style.display = "block";
  fill.style.width = `${Math.min(100, Math.max(0, Math.round((answered/total)*100)))}%`;
}
function announce(html){
  const el = $("live"); if(!el) return;
  const tmp = document.createElement("div"); tmp.innerHTML = html || "";
  el.textContent = tmp.textContent || "";
}
function showReveal(html){
  const rv = $("rv"); if(!rv) return;
  rv.innerHTML = html;
  rv.style.display = html ? "block" : "none";
  if(html){ rv.style.opacity = "0"; requestAnimationFrame(()=>{ rv.style.opacity = "1"; }); }
  announce(html);
}
function dnext(){
  if(!D) return;
  const P = $("panel");
  if(!D.q.length){
    const { right, seen, miss, onDone, summary } = D;
    setScore(0, 0);
    P.innerHTML = `<div class="done"><h2>${right} / ${seen}</h2>${summary ? summary(miss) : ""}<button class="next" id="ok">Continue</button></div>`;
    wireSayTaps(P);
    D = null; drillKeyHandler = null;
    $("ok").onclick = onDone;
    return;
  }
  setScore(D.seen, D.seen + D.q.length);
  const it = D.q.shift();
  if(it.kind === "type") renderTypeItem(it); else renderMcItem(it);
}
function renderMcItem(it){
  const P = $("panel");
  P.innerHTML = `<div class="drill-body"><p class="q">${escapeHtml(it.label)}</p>${it.html||""}<div class="opts ${it.optsClass||""}" id="o"></div><div class="reveal" id="rv"></div></div><div class="actions"><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const opts = shuffle(it.opts.slice());
  const container = $("o");
  let answered = false;
  opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.innerHTML = `<b class="num">${i+1}</b>${it.optHtml ? it.optHtml(o) : escapeHtml(o)}`;
    b.onclick = () => {
      if(answered) return; answered = true;
      [...container.children].forEach(x=>{ x.disabled = true; if(x.dataset.v === it.a) x.classList.add("ok"); });
      const ok = o === it.a;
      if(!ok) b.classList.add("bad");
      D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(it); }
      if(it.onAnswer) it.onAnswer(ok);
      showReveal(it.reveal || "");
      if(it.onReveal) it.onReveal();
      $("nx").style.display = "block"; setScore(D.seen, D.seen + D.q.length);
    };
    b.dataset.v = o;
    container.appendChild(b);
  });
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    const nx = $("nx");
    if(e.key >= "1" && e.key <= String(opts.length) && !answered){ container.children[+e.key-1].click(); }
    else if(e.key === "Enter" && nx && nx.style.display !== "none"){ dnext(); }
    else if(e.key === "Escape"){ quitDrill(); }
  };
}
function renderTypeItem(it){
  const P = $("panel");
  P.innerHTML = `<div class="drill-body"><p class="q">${escapeHtml(it.label)}</p>${it.html||""}
    <input type="text" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="${escapeHtml(TTS_LANG)}" placeholder="type the word…">
    <div class="reveal" id="rv"></div></div><div class="actions"><button class="next" id="submit">Check</button><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const input = $("tin"); input.focus();
  let answered = false;
  function submit(){
    if(answered) return; if(!input.value.trim()) return;
    answered = true; input.disabled = true; $("submit").style.display = "none";
    const ok = it.check(input.value);
    D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(it); }
    if(it.onAnswer) it.onAnswer(ok);
    showReveal((ok ? "" : `<div class="diff">you typed: ${escapeHtml(input.value)}</div>`) + (it.reveal||""));
    if(it.onReveal) it.onReveal();
    $("nx").style.display = "block"; setScore(D.seen, D.seen + D.q.length);
  }
  $("submit").onclick = submit;
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    if(e.key === "Enter"){ answered ? dnext() : submit(); }
    else if(e.key === "Escape"){
      if(document.activeElement === input){ input.blur(); return; }
      quitDrill();
    }
  };
}
let drillKeyHandler = null;
document.addEventListener("keydown", e => { if(drillKeyHandler) drillKeyHandler(e); });
function quitDrill(){ D = null; drillKeyHandler = null; render(); }

// Delegated tap-to-hear on `root` (default #rv): data-sent (a SENTENCES index) speaks
// that sentence, data-wid (a word id) speaks that word.
function wireSayTaps(root){
  const el = (root && root.nodeType) ? root : $("rv"); if(!el) return;
  el.addEventListener("click", e => {
    const t = e.target.closest("[data-sent],[data-wid]");
    if(!t || !el.contains(t)) return;
    if(t.dataset.wid !== undefined){ const w = WORDS_BY_ID[t.dataset.wid]; if(w) say(w.w); return; }
    const s = SENTENCES[+t.dataset.sent]; if(s) saySentence(s);
  });
}

// ===================== word drill items =====================
function sentenceRowHTML(s){
  const p = pronOf(s);
  return `<div class="sent" data-sent="${SENT_INDEX.get(s)}"><div class="st">${escapeHtml(s.t)}</div>${p ? `<div class="sp">${escapeHtml(p)}</div>` : ""}<div class="se">${escapeHtml(s.en)}</div></div>`;
}
function exampleSentencesHTML(entry){
  const ex = wordExampleSentences(entry.id, 2);
  if(!ex.length) return "";
  return `<p class="q" style="margin-top:12px">Example${ex.length>1?"s":""}:</p>${ex.map(sentenceRowHTML).join("")}`;
}
function revealBlock(entry){
  const p = pronOf(entry);
  return `<div data-wid="${escapeHtml(entry.id)}" style="cursor:pointer"><div class="rw">${escapeHtml(entry.w)} <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span></div>${p ? `<div class="rp">${escapeHtml(p)}</div>` : ""}<div style="color:var(--mute)">${escapeHtml(VC.gloss(entry))}</div></div>${exampleSentencesHTML(entry)}`;
}
const meaningChoices = entry => [VC.gloss(entry), ...VC.meaningOpts(entry, WORDS).map(d=>VC.gloss(d))];
// hear — TTS plays the word; pick the meaning. Without speech it degrades to read.
function hearItem(entry){
  if(!hasSpeech) return Object.assign(readItem(entry), { html: speechNotice() + bigWordHTML(entry) });
  return { kind:"mc", key:"w:"+entry.id, label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`,
    opts: meaningChoices(entry), a: VC.gloss(entry), reveal: `<div class="q">You heard:</div>${revealBlock(entry)}`,
    onAnswer: ok=>markWord(entry.id, ok),
    mount: () => { const btn = $("sp"); speak(entry.w, btn); btn.onclick = ()=>speak(entry.w, btn); },
    onReveal: wireSayTaps };
}
// read — word shown; pick the meaning. Audio auto-plays.
function readItem(entry){
  return { kind:"mc", key:"w:"+entry.id, label:"What does it mean?", optsClass:"opts-hero",
    html: bigWordHTML(entry), opts: meaningChoices(entry), a: VC.gloss(entry), reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), mount: () => say(entry.w), onReveal: wireSayTaps };
}
// recall — meaning shown; pick the word (wordOpts: same pos/level first, never a
// distractor that would also be a right answer).
function recallItem(entry){
  const ds = VC.wordOpts(entry, WORDS);
  const byW = {}; [entry, ...ds].forEach(e=>{ byW[e.w] = e; });
  return { kind:"mc", key:"w:"+entry.id, label:"Which word is this?", optsClass:"opts-hero opts-w",
    html: `<div class="med" style="text-align:center">${escapeHtml(VC.gloss(entry))}</div>`,
    opts: [entry.w, ...ds.map(d=>d.w)], a: entry.w, optHtml: wordOptHtml(byW), reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), onReveal: () => { say(entry.w); wireSayTaps(); } };
}
// type — meaning shown; type the word (normalised per pack.typing, alt forms accepted).
function typeItem(entry){
  return { kind:"type", key:"w:"+entry.id, label:"Type the word",
    html: `<div class="med" style="text-align:center">${escapeHtml(VC.gloss(entry))}</div>`,
    check: val => VC.acceptTyped(val, entry, PACK), reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), onReveal: () => { say(entry.w); wireSayTaps(); } };
}
const WORD_ITEM = { hear: hearItem, read: readItem, recall: recallItem, type: e => TYPING ? typeItem(e) : recallItem(e) };
const itemFromPlan = p => WORD_ITEM[p.kind](p.word);
// One card per missed word/sentence (items carry `key`), however many question types
// it was missed as; the most-missed first, with a count when missed more than once.
function missSummary(miss){
  const u = VC.dedupeMisses(miss);
  return u.length ? `<p class="q">Missed:</p>${u.map(({item, count})=>`<div class="stmt">${count > 1 ? `<div class="q" style="margin:0 0 4px">missed ${count}×</div>` : ""}${item.reveal}</div>`).join("")}` : "<p class='q'>Clean.</p>";
}

// ===================== sentence drill items =====================
function sentenceRevealBlock(s){
  const p = pronOf(s);
  return `<div data-sent="${SENT_INDEX.get(s)}" style="cursor:pointer"><div class="rw">${escapeHtml(s.t)} <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span></div>${p ? `<div class="rp">${escapeHtml(p)}</div>` : ""}<div style="color:var(--mute)">${escapeHtml(s.en)}</div></div>`;
}
const sentenceChoices = s => [s.en, ...VC.sentenceOpts(s, SENTENCES).map(d=>d.en)];
function readSentence(s){
  const p = pronOf(s);
  return { kind:"mc", key:"s:"+s.id, label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="med wd">${escapeHtml(s.t)}</div>${p ? `<div class="q">${escapeHtml(p)}</div>` : ""}`,
    opts: sentenceChoices(s), a: s.en, reveal: sentenceRevealBlock(s), onAnswer: ok=>markSentence(s.id, ok),
    mount: () => saySentence(s), onReveal: wireSayTaps };
}
function hearSentence(s){
  if(!canHearSentence(s)) return Object.assign(readSentence(s), { html: speechNotice() + readSentence(s).html });
  return { kind:"mc", key:"s:"+s.id, label:"What did they say?", optsClass:"opts-hero",
    html: `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`,
    opts: sentenceChoices(s), a: s.en, reveal: `<div class="q">You heard:</div>${sentenceRevealBlock(s)}`,
    onAnswer: ok=>markSentence(s.id, ok),
    mount: () => { const btn = $("sp"); saySentence(s, btn); btn.onclick = ()=>saySentence(s, btn); },
    onReveal: wireSayTaps };
}
// gap — sentence with one content word blanked; pick it from 4, or type it. Returns
// null when the sentence has no legal blank (callers fall back to readSentence). No
// audio before answering: hearing the sentence would give the blank away.
function gapSentence(s, typed){
  const idxs = VC.gapCandidateIndices(s, WORDS_BY_ID, PACK);
  if(!idxs.length) return null;
  const entry = WORDS_BY_ID[s.words[idxs[Math.floor(Math.random()*idxs.length)]]];
  const match = VC.gapMatch(s, entry, WORDS_BY_ID, PACK);
  const b = VC.blankSentence(s, match);
  const html = `<div class="med wd">${escapeHtml(b.before)}<span class="blank">____</span>${escapeHtml(b.after)}</div><div class="q">${escapeHtml(s.en)}</div>`;
  const base = { key:"s:"+s.id, reveal: sentenceRevealBlock(s), onAnswer: ok=>markSentence(s.id, ok),
    onReveal: () => { saySentence(s); wireSayTaps(); } };
  if(typed && TYPING){
    return Object.assign(base, { kind:"type", label:"Type the missing word", html,
      check: val => VC.acceptTyped(val, entry, PACK, [match.text]) });
  }
  const ds = VC.gapOpts(entry, WORDS);
  const byW = {}; [entry, ...ds].forEach(e=>{ byW[e.w] = e; });
  return Object.assign(base, { kind:"mc", label:"What's the missing word?", optsClass:"opts-hero opts-w", html,
    opts: [entry.w, ...ds.map(d=>d.w)], a: entry.w, optHtml: wordOptHtml(byW) });
}
function sentenceItemFor(s){
  const k = VC.sentenceKind(PACK);
  if(k === "hear") return hearSentence(s);
  if(k === "read") return readSentence(s);
  return gapSentence(s, k === "gapType") || readSentence(s);
}

// ===================== lesson item wrapper =====================
// mode from VC.lessonSayMode: "audio" plays `say`; "inq" runs without audio (the

    opts: it.opts, a: it.a, reveal: `<div>${escapeHtml(it.rv||"")}</div>` };

// ===================== Today =====================
function pathStrip(){
  const stages = LEVELS.map(lv=>({ label: levelLabel(lv), frac: nSets(lv) ? (prog.sets[lv]||0)/nSets(lv) : 1 }));
  return `<div class="path">${stages.map(s=>`<div class="seg"><div class="bar"><i style="width:${Math.round(s.frac*100)}%"></i></div>${escapeHtml(s.label)}</div>`).join("")}</div>`;
}
let todayStepState = null;
function todayRender(){
  setScore(0,0);
  const P = $("panel"); const lw = learnedWords(); const nn = nextNewSet();
  const n = (prog.sessions||0) + 1;
  const availSent = availableSentences();
  const g = VC.todayGates(lw.length, !!nn, availSent.length);
  const steps = [
    ["Review", g.review ? `${VC.REVIEW_SIZE} items, weakest first` : "skipped until 5+ words are learned"],
    ["Learn", nn ? `${levelLabel(nn.lv)}, set ${nn.set+1}` : "everything covered"],
    ["Listen", g.listen ? "12 items" : "skipped until something is learned"],
    ["Recall", g.recall ? "8 items" : "skipped until something is learned"],
    ["Sentences", g.sentences ? "8 items, weakest first" : "skipped until 8+ sentences are available"]
  ];
  const showPlaceHint = !prog.placedOnce;
  const showSoundsHint = HAS_LESSONS && !prog.soundsOpened;
  P.innerHTML = `<div class="drill-body">${pathStrip()}
    ${showPlaceHint ? `<div class="stmt">New here? Placement finds where to start.<button class="next" id="hintPlace" style="margin-top:8px">Take the placement test</button></div>` : ""}
    ${showSoundsHint ? `<div class="stmt">A few short lessons explain how ${escapeHtml(PACK.name)} sounds and is written.<button class="next" id="hintSounds" style="margin-top:8px">Start the first lesson</button></div>` : ""}
    <p class="q">Session ${n}, about 15 minutes.<br>${lw.length} words learned so far.</p>
    <table class="stats">${steps.map((s,i)=>`<tr><td>${i+1}. ${s[0]}</td><td>${escapeHtml(s[1])}</td></tr>`).join("")}</table>
    </div><div class="actions"><button class="next" id="go">Start today</button></div>`;
  if(showPlaceHint) $("hintPlace").onclick = enterPlacementFromToday;
  if(showSoundsHint) $("hintSounds").onclick = enterFirstSoundsLessonFromToday;
  $("go").onclick = () => { todayStepState = { step:0 }; todayStep(); };
}
function enterPlacementFromToday(){ switchToTab("test", "Test"); testSel = "placement"; startPlacement(); }
function enterFirstSoundsLessonFromToday(){
  switchToTab("sounds", "Sounds");
  soundsSel = 0;
  const backToToday = () => { switchToTab("today", "Today"); soundsSel = null; todayRender(); };
  lessonTeach(LESSON_LIST[0], () => { prog.lessons[LESSON_LIST[0].id] = 1; store.save(); backToToday(); }, backToToday);
}
// review(15, >=40% production) -> learn(next set) -> listen(12 hear) -> recall(8
// recall/type) -> sentences(8) -> finish. Each step skips itself when its pool is too small.
function todayStep(){
  const lw = learnedWords(); const nn = nextNewSet();
  const avail = availableSentences();
  const g = VC.todayGates(lw.length, !!nn, avail.length);
  const s = todayStepState.step++;
  if(s === 0){
    if(g.review){ drill(VC.buildReviewPlan(lw, prog, PACK).map(itemFromPlan), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 1){
    if(g.learn){
      const list = levelList(nn.lv).slice(nn.set*SIZE, nn.set*SIZE+SIZE);
      vocabTeach(list, nn.lv, () => {
        const items = [];
        list.forEach(w => items.push(hearItem(w), readItem(w)));
        drill(items, () => { prog.sets[nn.lv] = nn.set+1; store.save(); todayStep(); }, missSummary);
      });
      return;
    }
    return todayStep();
  }
  if(s === 2){
    if(g.listen){ drill(weakFirst(lw,12).map(hearItem), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 3){
    if(g.recall){ drill(VC.buildRecallPlan(lw, prog, PACK, 8).map(itemFromPlan), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 4){
    if(g.sentences){ drill(weakFirstSentences(avail,8).map(sentenceItemFor), todayStep, missSummary); return; }
    return todayStep();
  }
  todayFinish();
}
function todayFinish(){
  D = null; drillKeyHandler = null; setScore(0,0);
  prog.sessions = (prog.sessions||0) + 1; store.save();
  const P = $("panel");
  P.innerHTML = `<div class="done"><h2>Session done</h2><p class="q">${learnedWords().length} words learned so far.</p><button class="next" id="again">Back to Today</button></div>`;
  $("again").onclick = todayRender;
}
function wordRowHTML(w, cls){
  const p = pronOf(w);
  return cls === "wl"
    ? `<span class="wd">${escapeHtml(w.w)}</span><span class="info">${p ? `<span class="pr">${escapeHtml(p)}</span>` : ""}<span class="en">${escapeHtml(VC.gloss(w))}</span></span>`
    : `<span class="wd">${escapeHtml(w.w)}</span><span class="pr">${escapeHtml(p)}</span><span class="en">${escapeHtml(VC.gloss(w))}</span>`;

function vocabTeach(list, lv, onDrill){
  setScore(0,0);
  const P = $("panel");
  P.innerHTML = `<p class="q">${escapeHtml(levelLabel(lv))}, new set. Tap a word to hear it.</p>
    <div id="tl"></div><div class="actions"><button class="next" id="dr">Drill this set</button></div>`;
  const tl = $("tl");
  list.forEach(w => {
    const row = document.createElement("div"); row.className = "rowset";
    row.innerHTML = `${wordRowHTML(w, "rowset")}<span style="color:var(--mute);flex:0 0 auto">${TEACH_PLAY_SVG}</span>`;
    row.onclick = () => say(w.w);
    row.style.cursor = "pointer";
    tl.appendChild(row);

    if(exHtml){
