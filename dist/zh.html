<style>
  :root{
    --bg:#EEF0ED;--ink:#1B2321;--mute:#5C6B67;--line:#D6DAD7;--card:#FFFFFF;

    --font: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Target-language text: the UI font first, then system fonts that cover non-Latin
       scripts (IBM Plex lacks many glyphs; missing ones fall through to system fonts). */
    --wbase: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;

    :root:not([data-theme="light"]){
      --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
      --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
    --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
  body{padding-bottom:calc(64px + var(--safe-b))}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 24px;min-height:calc(100dvh - 64px - var(--safe-b));display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex:0 0 auto}
  h1{font-size:18px;font-weight:600;margin:0}
  .score{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hdrbar{height:3px;border-radius:2px;background:transparent;margin-bottom:12px;flex:0 0 auto;overflow:hidden}
  .hdrbar i{display:block;height:100%;width:0;background:var(--ink);transition:width 0.2s ease}
  @media (prefers-reduced-motion: reduce){ .hdrbar i{transition:none} }
  .themebtn{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--ink);flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;flex:1 1 auto;display:flex;flex-direction:column}
  #panel > .done{display:flex;flex-direction:column;flex:1 1 auto}
  .next:last-child, .primary:last-child, .done .next{margin-top:auto}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .drill-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  /* Drill items centre in the tall card; dashboards (Today) read top-down, so they don't. */
  .drill-body.top{justify-content:flex-start}
  .q{color:var(--mute);font-size:15px;margin:0 0 10px}
  .big{font-size:52px;line-height:1.3;text-align:center;margin:6px 0 16px;font-weight:500;overflow-wrap:anywhere}
  .med{font-size:22px;line-height:1.5;margin:2px 0 14px}
  .wd{font-family:var(--wfont)}
  .pron{color:var(--mute);font-size:18px;text-align:center;margin:-10px 0 14px}
  .en{color:var(--mute);font-size:15px;text-align:center;margin-top:-8px;margin-bottom:14px}
  .blank{color:var(--mute);letter-spacing:1px;unicode-bidi:isolate}
  /* Target-language text carries data-tl + lang (+ dir="rtl" for pack.rtl); block
     elements then align to their start side. English glosses never carry it. */
  [data-tl]{font-family:var(--wfont)}
  :root[data-tlh] [data-tl]{line-height:var(--tlh)}
  /* Korean only: words (Hangul syllable blocks) are space-separated like Latin, so the
     default break-anywhere wrapping can split inside a word (봤어/요). Scoped off the
     lang attribute TA already sets from pack.langTag, not a global rule: languages with
     no spaces between words, e.g. zh, ja, must keep normal, break-anywhere wrapping. */
  [data-tl][lang|="ko"]{word-break:keep-all}
  /* minmax(0,1fr): the track never grows past the card for a long unbreakable word. */
  .opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .opts button{width:100%;min-width:0;overflow-wrap:anywhere;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:17px;color:var(--ink);line-height:1.35;min-height:48px;font-family:var(--font)}
  .opts button b.num{color:var(--mute);font-weight:500;margin-inline-end:8px;font-size:14px}
  /* inline-block: the pron stays beside a short word and drops whole onto its own line
     under a long one (профессиональный + its pron at 360px) instead of overflowing. */
  .opts button .op{display:inline-block;max-width:100%;color:var(--mute);font-size:14px;font-weight:400;margin-inline-start:8px}
  .opts button[dir=rtl]{text-align:right}
  .opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .opts-hero button{font-size:18px;padding:18px 18px;min-height:58px;font-weight:500}
  .opts-w button{font-family:var(--wfont)}
  .opts-w button b.num{font-family:var(--font)}
  .hear-stage{display:flex;justify-content:center;margin:14px 0 22px}
  .speaker{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:36px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @keyframes speakerPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .speaker.speaking{animation:speakerPulse 0.9s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .speaker.speaking{animation:none} }
  .reveal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:none;font-size:15px}
  .reveal .rw{font-size:22px;margin-bottom:2px;font-family:var(--wfont)}
  .reveal .rp{color:var(--mute);margin-bottom:2px}
  .next,.primary{margin-top:14px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;min-height:48px;font-family:var(--font)}
  .ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;min-height:44px;font-family:var(--font)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .row button, .chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;color:var(--ink);min-height:44px;font-family:var(--font)}
  .row button.on, .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .replay{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:17px;color:var(--ink);flex:0 0 auto}
  .listen-stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0}
  input[type=text]{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;font-size:19px;background:var(--card);color:var(--ink);font-family:var(--wfont)}
  input[type=text]:focus{outline:3px solid #7AA7D9;outline-offset:1px}
  .diff{font-size:15px;margin-top:6px}
  .wl{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;gap:12px}
  .wl .wd{font-size:22px;flex:0 1 auto;min-width:64px;max-width:48%;overflow-wrap:anywhere}
  .wl .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .wl .pr{font-size:15px;display:block}
  .wl .en{color:var(--mute);font-size:14px;text-align:left;display:block;margin:0}
  table.stats{width:100%;border-collapse:collapse;font-size:15px}
  table.stats td{padding:8px 0;border-bottom:1px solid var(--line)}
  table.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  /* Today step names never wrap ("5. Sentences" at 390px); the description column wraps. */
  table.steps td:first-child{white-space:nowrap;padding-right:12px;vertical-align:top}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--ink)}
  .path{display:flex;gap:6px;align-items:center;margin-bottom:14px}
  .path .seg{flex:1;text-align:center;font-size:11px;color:var(--mute)}
  .stmt{font-size:15px;line-height:1.5;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .warn{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .done h2{font-size:22px;margin:0 0 10px;font-weight:600}
  .done ul{padding-left:20px;font-size:15px;margin:8px 0}
  .card-teach{margin-bottom:14px}
  .card-teach h3{font-size:17px;margin:0 0 8px;font-weight:600}
  .card-teach p{font-size:15px;color:var(--mute);margin:0 0 10px}
  .rowset{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
  .rowset .wd{font-size:18px;flex:0 1 auto;min-width:52px;max-width:45%;overflow-wrap:anywhere}
  .rowset .pr{flex:1;min-width:0;color:var(--mute);font-size:15px;overflow-wrap:anywhere}
  .rowset .en{color:var(--mute);font-size:14px;text-align:right;flex:0 1 auto;min-width:0;margin:0;overflow-wrap:anywhere}
  .rowset .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .rowset .info .pr{flex:0 0 auto;display:block;overflow-wrap:anywhere}
  .rowset .info .en{text-align:left;display:block}
  .sent{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .sent .st{font-family:var(--wfont);font-size:17px}
  .sent .sp{color:var(--mute);font-size:14px}
  .sent .se{color:var(--mute);font-size:14px}

  .plist button{display:flex;justify-content:space-between;width:100%;text-align:start;padding:13px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:16px;color:var(--ink);min-height:48px;align-items:center}
  .plist .tick{color:var(--ok);font-size:14px}

  .rlv{margin-bottom:14px}
  .rlh{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:16px;margin-bottom:4px}
  .ptitle{font-size:21px;margin:0 0 4px;font-weight:600}
  .passage{margin:4px 0 8px}

  .psent.hi{background:var(--ok-bg)}
  .psent .ptxt{flex:1 1 0;min-width:0;font-size:19px;line-height:1.7;overflow-wrap:anywhere}
  .psent .psay{width:36px;height:36px;font-size:14px}
  .pchips{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:6px}
  .pw{border-bottom:1px dotted var(--mute);cursor:pointer}
  .pw.on{background:var(--ok-bg);border-bottom-color:var(--ok)}
  .pchip{font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:8px;border-bottom-style:solid}
  .gloss{position:sticky;top:0;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:15px;text-align:start}
  .gloss .gw{font-size:19px;font-weight:500}
  .gloss .gp,.gloss .ge,.wk .gp,.wk .ge{color:var(--mute)}
  mark{background:var(--ok-bg);color:inherit;border-radius:4px;padding:0 2px}
  .wk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;min-height:44px}
  .wk input{width:20px;height:20px;flex:0 0 auto}
  .wk .gw{font-size:18px}
  textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--card);color:var(--ink);font-family:var(--font)}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
  .tabs button{flex:1;background:transparent;border:none;padding:10px 4px 8px;font-size:12px;color:var(--mute);min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font)}
  .tabs button .ic{font-size:20px;line-height:1}
  .tabs button.on{color:var(--ink);font-weight:600}
  .tabs button[hidden]{display:none}
  button{cursor:pointer}
  button:focus-visible, .opts button:focus-visible, [tabindex]:focus-visible{outline:3px solid #7AA7D9;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .swtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:var(--ink);color:var(--card);border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:14px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .reveal{transition:opacity 0.15s ease}
  @media (prefers-reduced-motion: reduce){ .reveal{transition:none} }
  @media (min-width: 900px){
    .wrap{max-width:640px;min-height:0}
    body{padding-bottom:24px}
    .tabs{position:static;left:auto;right:auto;bottom:auto;transform:none;width:640px;max-width:100vw;margin:12px auto 0;padding-bottom:0;border:1px solid var(--line);border-radius:16px}
  }
</style>

25","w0396","w0202","w0032","w0044","w0083","w0018","w0162","w0071","w0277","w0280","w0087","w0331"],"spans":[[0,1,"w0091"],[1,2,"w0125"],[2,4,"w0396"],[4,6,"w0202"],[6,7,"w0032"],[7,8,"w0044"],[8,9,"w0083"],[9,10,"w0018"],[11,13,"w0162"],[13,14,"w0071"],[14,15,"w0125"],[15,17,"w0277"],[17,18,"w0280"],[18,19,"w0087"],[19,21,"w0331"]]},{"t":"我还很小的时候，奶奶经常给我讲故事。","en":"When I was very small, Grandma often told me stories.","words":["w0091","w0280","w0087","w0080","w0125","w0095","w0396","w0518","w0259","w0560","w0438"],"spans":[[0,1,"w0091"],[1,2,"w0280"],[2,3,"w0087"],[3,4,"w0080"],[4,5,"w0125"],[5,7,"w0095"],[8,10,"w0396"],[10,12,"w0518"],[12,13,"w0259"],[13,14,"w0091"],[14,15,"w0560"],[15,17,"w0438"]]},{"t":"我最喜欢听她讲她和爷爷的故事。","en":"My favourite was the story of her and Grandpa.","words":["w0091","w0231","w0058","w0052","w0071","w0560","w0054","w0484","w0125","w0438"],"spans":[[0,1,"w0091"],[1,2,"w0231"],[2,4,"w0058"],[4,5,"w0052"],[5,6,"w0071"],[6,7,"w0560"],[7,8,"w0071"],[8,9,"w0054"],[9,11,"w0484"],[11,12,"w0125"],[12,14,"w0438"]]},{"t":"很多年以前，奶奶家在一条小河旁边。","en":"Many years ago Grandma's home was beside a little river.","words":["w0087","w0065","w0085","w0319","w0396","w0078","w0062","w0001","w0455","w0080","w0467","w0225"],"spans":[[0,1,"w0087"],[1,2,"w0065"],[2,3,"w0085"],[3,5,"w0319"],[6,8,"w0396"],[8,9,"w0078"],[9,10,"w0062"],[10,11,"w0001"],[11,12,"w0455"],[12,13,"w0080"],[13,14,"w0467"],[14,16,"w0225"]]},{"t":"有一次，奶奶在河旁边洗衣服，她的帽子掉进了河里。","en":"Once, while Grandma was washing clothes by the river, her hat fell into the water.","words":["w0101","w0001","w0234","w0396","w0062","w0467","w0225","w0239","w0135","w0071","w0125","w0411","w0886","w0281","w0018","w0145"],"spans":[[0,1,"w0101"],[1,2,"w0001"],[2,3,"w0234"],[4,6,"w0396"],[6,7,"w0062"],[7,8,"w0467"],[8,10,"w0225"],[10,11,"w0239"],[11,13,"w0135"],[14,15,"w0071"],[15,16,"w0125"],[16,18,"w0411"],[18,19,"w0886"],[19,20,"w0281"],[20,21,"w0018"],[21,22,"w0467"],[22,23,"w0145"]]},{"t":"一个年轻人看见了，马上进了河里，把帽子拿了回来。","en" s":["1","2","3","4"],"a":"4","rv":"mà — 骂 scold — tone 4, falling sharply"},{"t":"mc","q":"In 你好吗 (nǐ hǎo ma), what tone is 吗?","say":"你好吗","opts":["1","2","3","neutral"],"a":"neutral","rv":"吗 (ma) is always a light, toneless question particle"},{"t":"mc","q":"好 is written hǎo, not hoǎ. Why does the mark sit on a?","opts":["a and e always take priority over other vowels","the mark always goes on the last vowel","the mark always goes on the first vowel"],"a":"a and e always take priority over other vowels","rv":"Rule: a/e first, then ou → o, otherwise the last vowel"},{"t":"mc","q":"都 is written dōu. Where does the tone mark go in the combination 'ou'?","opts":["on o","on u","no mark is needed"],"a":"on o","rv":"ou is a special case: the mark always lands on o"},{"t":"mc","q":"Which tone falls sharply from high to low, like a sharp command?","opts":["1","2","3","4"],"a":"4","rv":"Tone 4 is the fast falling tone"}]},{"id":"finals-simple","title":"Simple finals: a o e i u ü","blurb":"Six pure vowel sounds — including the tricky ü.","cards":[{"h":"Six basic vowels","body":"These are the building blocks every other final is made from. Say each one on its own before you try it in a word.","rows":[["bā","八","eight — a"],["wǒ","我","I / me — o"],["hē","喝","to drink — e"],["nǐ","你","you — i"],["bù","不","no / not — u"],["qù","去","to go — ü, written u after q"]],"say":["八","我","喝","你","不","去"]},{"h":"The ü sound","body":"Round your lips like you're about to say u, but keep your tongue where it is for i. That combination is ü. English has no equivalent — most learners' first mistake is swapping it for u.","rows":[["lù","路","road — u"],["lǜ","绿","green — ü"]],"say":["路","绿"]}],"items":[{"t":"mc","q":"What is the final in 我 (wǒ)?","say":"我","opts":["o","e","u"],"a":"o","rv":"我 = w + o"},{"t":"mc","q":"What is the final in 喝 (hē)?","say":"喝","opts":["e","o","a"],"a":"e","rv":"喝 = h + e"},{"t":"mc","q":"What is the final in 你 (nǐ)?","say":"你","opts":["i","u","ü"],"a":"i","rv":"你 = n + i"},{"t":"mc","q":"What is the final in 不 (bù)?","say":"不","opts":["u","o","ü"],"a":"u","rv":"不 = b + u"},{"t":"mc","q":"What is the final in 去 (qù)?","say":"去","opts":["ü","u","i"],"a":"ü","rv":"去 is spelled qu but pronounced with ü — after q the dots are dropped"},{"t":"mc","q":"Which word do you hear?","say":"绿","opts":["lù","lǜ","nǚ"],"a":"lǜ","rv":"绿 (lǜ) — rounded lips, tongue at the i position"},{"t":"mc","q":"After j, q, or x, how is ü written?","opts":["ü","u","yu"],"a":"u","rv":"The dots are dropped: ju, qu, xu are all really ü sounds"},{"t":"mc","q":"Which is the correctly spelled pinyin for 女 (woman)?","opts":["nǚ","nu","nv3"],"a":"nǚ","rv":"女 keeps its umlaut because it has no j/q/x before it"}]},{"id":"initials-bpmfdtnl","title":"Initials: b p m f · d t n l","blurb":"Aspiration — the puff-of-air test that splits b/p and d/t.","cards":[{"h":"Aspirated vs. unaspirated","body":"b and p use the same lip position — the only difference is a puff of air. b has none, p has a strong burst. Hold a hand or tissue in front of your mouth: it barely moves for b, but jumps for p. The same pairing applies to d/t.","rows":[["bà","爸","dad — b, no puff of air"],["pà","怕","to fear — p, puff of air"],["dà","大","big — d, no puff of air"],["tā","他","he / she — t, puff of air"]],"say":["爸","怕","大","他"]},{"h":"m, f, n, l","body":"m and n are nasal — air goes through the nose, lips closed for m, tongue tip on the ridge behind the teeth for n. f is like English f. l is a clear tongue-tip l, always light, never the 'dark l' at the end of English 'ball'.","rows":[["mā","妈","mother — lips together, nasal"],["fàn","饭","meal — like English f"],["nǐ","你","you — tongue tip on the ridge"],["lái","来","to come — clear, light l"]],"say":["妈","饭","你","来"]}],"items":[{"t":"mc","q":"Which initial do you hear?","say":"爸","opts":["b","p","m"],"a":"b","rv":"b — no puff of air"},{"t":"mc","q":"Which initial do you hear?","say":"怕","opts":["b","p","f"],"a":"p","rv":"p — strong puff of air"},{"t":"mc","q":"Which initial do you hear?","say":"大","opts":["d","t","n"],"a":"d","rv":"d — no puff of air"},{"t":"mc","q":"Which initial do you hear?","say":"他","opts":["d","t","l"],"a":"t","rv":"t — strong puff of air"},{"t":"mc","q":"Which word do you hear?","say":"你","opts":["nǐ","lǐ","dǐ"],"a":"nǐ","rv":"你 (nǐ) — tongue tip on the ridge, nasal"},{"t":"mc","q":"Which is the correctly spelled pinyin for 'meal'?","opts":["fàn","hàn","fann"],"a":"fàn","rv":"饭 is fàn — f like English f"},{"t":"mc","q":"Which initial does 来 (lái) start with?","say":"来","opts":["n","l","r"],"a":"l","rv":"来 (lái) — clear, light l"},{"t":"mc","q":"Hold a tissue in front of your mouth. Which sound makes it flutter?","opts":["b","p","d"],"a":"p","rv":"p is aspirated: a burst of air follows the lip release"}]},{"id":"initials-sibilants","title":"g k h · the three sibilant rows","blurb":"z c s vs. zh ch sh r vs. j q x — the classic trap for English speakers.","cards":[{"h":"g, k, h","body":"These come from the back of the throat, like English g, k, h, but crisper.","rows":[["gè","个","measure word — g"],["kě","可","can, as in 可以 — k"],["hē","喝","to drink — h"]],"say":["个","可","喝"]},{"h":"Three rows, three tongue shapes","body":"z c s sit with the tongue tip flat behind the lower teeth, like a soft English 'ds/ts/s'. zh ch sh r curl the tongue tip back without touching anything — the single hardest sound for English speakers to place. j q x are flat and forward, always followed by i or ü, close to English 'j/ch/sh' but lighter.","rows":[["zài","在","at / in — z, flat tongue"],["cái","才","only then — c, flat tongue"],["sān","三","three — s, flat tongue"],["zhè","这","this — zh, tongue curled back"],["chī","吃","to eat — ch, tongue curled back"],["shì","是","to be — sh, tongue curled back"],["rì","日","sun / day — r, tongue curled back"],["jiā","家","home — j, flat and forward"],["qī","七","seven — q, flat and forward"],["xiè","谢","thank, as in 谢谢 — x, flat and forward"]],"say":["在","才","三","这","吃","是","日","家","七","谢"]}],"items":[{"t":"mc","q":"Which word do you hear?","say":"吃","opts":["zhī","chī","cī","xī"],"a":"chī","rv":"吃 (chī) — retroflex, tongue curled back with a puff of air"},{"t":"mc","q":"Which word do you hear?","say":"是","opts":["sì","shì","xì"],"a":"shì","rv":"是 (shì) — retroflex sh, tongue curled back"},{"t":"mc","q":"Which word do you hear?","say":"七","opts":["qī","chī","cī","xī"],"a":"qī","rv":"七 (qī) — flat, forward tongue, always before i/ü"},{"t":"mc","q":"j, q, and x can only be followed by which vowels?","opts":["i or ü","a or o","any vowel"],"a":"i or ü","rv":"This row exists only before i and ü — no jia-without-i, no qa, no xo"},{"t":"mc","q":"Which initial does 这 (zhè) start with?","say":"这","opts":["z","zh","j"],"a":"zh","rv":"这 (zhè) — retroflex zh"},{"t":"mc","q":"Which initial does 在 (zài) start with?","say":"在","opts":["z","zh","j"],"a":"z","rv":"在 (zài) — flat-tongue z"},{"t":"mc","q":"Which initial does 家 (jiā) start with?","say":"家","opts":["z","zh","j"],"a":"j","rv":"家 (jiā) — flat, forward j"},{"t":"mc","q":"For zh, ch, sh, r, where does the tongue tip go?","opts":["curled back, not touching anything","flat against the back of the teeth","pressed to the roof at the front"],"a":"curled back, not touching anything","rv":"Retroflex sounds: tongue curls back into the mouth, floating"}]},{"id":"finals-compound","title":"Compound finals: ai ei ao ou · ia ie ua uo üe","blurb":"Two vowel sounds glide smoothly into one syllable.","cards":[{"h":"Gliding vowels","body":"Each of these is a smooth slide from the first vowel sound toward the second — don't pause in the middle. Say them slowly at first, then speed up until it's one motion.","rows":[["bái","白","white — ai"],["méi","没","not have — ei"],["hǎo","好","good — ao"],["dōu","都","all — ou"],["jiā","家","home — ia"],["xiě","写","to write — ie"],["huà","话","speech — ua"],["duō","多","many — uo"],["xué","学","to study — üe, written ue after x"]],"say":["白","没","好","都","家","写","话","多","学"]}],"items":[{"t":"mc","q":"Which final does 白 (bái) have?","say":"白","opts":["ai","ei","ao"],"a":"ai","rv":"白 (bái) — ai glide"},{"t":"mc","q":"Which final does 好 (hǎo) have?","say":"好","opts":["ai","ao","ou"],"a":"ao","rv":"好 (hǎo) — ao glide"},{"t":"mc","q":"Which final does 都 (dōu) have?","say":"都","opts":["ao","ou","uo"],"a":"ou","rv":"都 (dōu) — ou glide"},{"t":"mc","q":"Which final does 写 (xiě) have?","say":"写","opts":["ie","ia","üe"],"a":"ie","rv":"写 (xiě) — ie glide"},{"t":"mc","q":"学 is spelled xue. What is its final actually pronounced as?","say":"学","opts":["üe","ue, like English 'cue'","oo"],"a":"üe","rv":"After x the ü loses its dots but keeps its sound"},{"t":"mc","q":"Which is the correctly spelled pinyin for 'many' (duō)?","opts":["duo","dwo","duou"],"a":"duo","rv":"多 is duō — u glides into o"},{"t":"mc","q":"Which final does 话 (huà) have?","say":"话","opts":["ua","uo","ia"],"a":"ua","rv":"话 (huà) — ua glide"},{"t":"mc","q":"In 好 (hǎo), which letter carries the tone mark?","opts":["h","a","o"],"a":"a","rv":"a always outranks o for the tone mark"}]},{"id":"finals-nasal","title":"Nasal finals: an en ang eng ong","blurb":"-n touches the tongue tip; -ng doesn't touch anything.","cards":[{"h":"-n vs -ng","body":"For -n, the tongue tip presses against the ridge behind your upper teeth, same as English 'n'. For -ng, the tongue tip touches nothing — the back of the tongue rises and the sound is nasal, like English 'sing'. Mixing these up is one of the most common mistakes for English speakers.","rows":[["màn","慢","slow — an"],["mén","门","door — en"],["máng","忙","busy — ang"],["péng","朋","friend, as in 朋友 — eng"],["hóng","红","red — ong"]],"say":["慢","门","忙","朋","红"]}],"items":[{"t":"mc","q":"Which word do you hear?","say":"慢","opts":["màn","máng","wàn"],"a":"màn","rv":"慢 (màn) — tongue tip touches the ridge"},{"t":"mc","q":"Which word do you hear?","say":"忙","opts":["màn","máng","fáng"],"a":"máng","rv":"忙 (máng) — tongue tip touches nothing"},{"t":"mc","q":"Which final does 红 (hóng) have?","say":"红","opts":["an","ang","ong"],"a":"ong","rv":"红 (hóng) — ong, lips rounded"},{"t":"mc","q":"For -ng, does the tongue tip touch the roof of the mouth?","opts":["yes","no","only sometimes"],"a":"no","rv":"-ng is made entirely with the back of the tongue"},{"t":"mc","q":"Which final does 门 (mén) have?","say":"门","opts":["en","eng","an"],"a":"en","rv":"门 (mén) — en, tongue tip touches the ridge"},{"t":"mc","q":"Which final does 朋 (péng) have?","say":"朋","opts":["en","eng","ang"],"a":"eng","rv":"朋 (péng) — eng, tongue tip touches nothing"},{"t":"mc","q":"Which is the correctly spelled pinyin for 'busy' (máng)?","opts":["mang","manng","mng"],"a":"mang","rv":"忙 is máng"},{"t":"mc","q":"Which word do you hear?","say":"门","opts":["mén","méng","měn"],"a":"mén","rv":"门 (mén) ends in -n, not -ng"}]},{"id":"finals-i-row","title":"i-row finals: ian in iang ing iong iao iu","blurb":"Adding nasal and glide endings onto i.","cards":[{"h":"Building on i","body":"These finals all start from the i sound and add a nasal or glide ending. Watch the -n/-ng pairs again: ian vs iang, in vs ing.","rows":[["tiān","天","sky / day — ian"],["xīn","心","heart — in"],["liǎng","两","two, a couple — iang"],["míng","名","name, as in 名字 — ing"],["xiǎo","小","small — iao"],["jiǔ","九","nine — iu, shortened from iou"]],"say":["天","心","两","名","小","九"]}],"items":[{"t":"mc","q":"Which final does 天 (tiān) have?","say":"天","opts":["ian","in","iang"],"a":"ian","rv":"天 (tiān) — ian"},{"t":"mc","q":"Which final does 心 (xīn) have?","say":"心","opts":["in","ing","ian"],"a":"in","rv":"心 (xīn) — in, tongue tip touches the ridge"},{"t":"mc","q":"Which final does 两 (liǎng) have?","say":"两","opts":["iang","ing","iong"],"a":"iang","rv":"两 (liǎng) — iang"},{"t":"mc","q":"Which final does 名 (míng) have?","say":"名","opts":["in","ing","ian"],"a":"ing","rv":"名 (míng) — ing, back of the tongue only"},{"t":"mc","q":"九 (jiǔ) is really 'jiou' shortened to what spelling?","opts":["jiu","jio","jou"],"a":"jiu","r tays"},{"t":"mc","q":"一 (yī) — why does it start with y instead of a bare i?","opts":["pinyin syllables can't start with a bare i","y changes the vowel sound","it's random"],"a":"pinyin syllables can't start with a bare i","rv":"i, u, and ü always get a y/w when they start a syllable alone"},{"t":"mc","q":"Which is the correctly spelled pinyin for 五 (five)?","say":"五","opts":["wu","u","wo"],"a":"wu","rv":"五 is wǔ — bare u becomes wu"},{"t":"mc","q":"Which is the correctly spelled pinyin for 雨 (rain)?","say":"雨","opts":["yu","ü","yv"],"a":"yu","rv":"雨 is yǔ — bare ü becomes yu"},{"t":"mc","q":"Which final does 快 (kuài) have?","say":"快","opts":["uai","uan","uang"],"a":"uai","rv":"快 (kuài) — uai"},{"t":"mc","q":"Which word do you hear?","say":"短","opts":["duǎn","duǎng","duàn"],"a":"duǎn","rv":"短 (duǎn) ends in -n, not -ng"}]},{"id":"special-syllables","title":"Special syllables: zhi chi shi ri zi ci si · er","blurb":"The 'i' here is a buzz, not a real vowel — plus 儿 and erhua.","cards":[{"h":"A silent placeholder i","body":"After zh ch sh r z c s, the written i is not the vowel you hear elsewhere. It's just a buzzing continuation of the consonant — the tongue never moves to make a separate vowel sound.","rows":[["zhī","知","to know, as in 知道"],["chī","吃","to eat"],["shì","是","to be"],["rì","日","sun / day"],["zì","字","character / word"],["cí","词","word / term"],["sì","四","four"]],"say":["知","吃","是","日","字","词","四"]},{"h":"er and erhua","body":"儿 (ér) is a syllable on its own, made with the tongue curled back. Attached to the end of another syllable it becomes 'erhua' — the two blend into one sound with a retroflex color, common in Beijing speech.","rows":[["èr","二","two"],["ér","儿","son / child suffix"],["yìdiǎnr","一点儿","a little — diǎn + r blend into one syllable"]],"say":["二","儿","一点儿"]}],"items":[{"t":"mc","q":"In zhī, chī, shī, what is the 'i' sound really doing?","opts":["it's a real 'ee' vowel","it's just a buzz — the tongue stays where it is for the consonant","it function applyPlacement(prog, st, passed, words, pack){
  const out = Object.assign({}, prog, { w: {} });
  Object.keys(prog.w||{}).forEach(k => { out.w[k] = Object.assign({}, prog.w[k]); });
  out.sets = Object.assign({}, defaultProg(pack).sets, prog.sets||{});
  for(let i=0;i<passed;i++){ const b = st[i]; out.sets[b.lv] = Math.max(out.sets[b.lv]||0, b.s1); }
  const ids = levelIds(pack), byLv = wordsByLevel(words, pack), size = setSizeOf(pack);
  const firstIdx = ids.indexOf(String(((pack.placement||[])[0]||[])[0]));
  if(passed > 0 && firstIdx > 0) ids.slice(0, firstIdx).forEach(lv => { out.sets[lv] = Math.max(out.sets[lv]||0, nSets(byLv[lv], size)); });
  learnedWords(words, pack, out).forEach(w => { if(!out.w[w.id]) out.w[w.id] = {r:1,w:0,s:1,prov:1}; });
  out.placedOnce = true;
  return out;
}

// Groups a drill's missed items by their `key` (one word or sentence, whatever
// question type it was missed as), keeping the first item seen as the representative.
// Returns [{item, count}] ordered by count desc, then first-miss order.
function dedupeMisses(miss){
  const by = new Map();
  (miss||[]).forEach((m, i) => {
    const k = m.key != null ? m.key : `#${i}`;
    const e = by.get(k);
    if(e) e.count++; else by.set(k, { item: m, count: 1, order: by.size });
  });
  return [...by.values()].sort((a,b)=>b.count-a.count || a.order-b.order).map(({item, count})=>({item, count}));
}

// ------------------------------------------------------------------ progress
const PROG_VERSION = 1;
const WORD_MASTERED = 3;      // word streak for "mastered"
const SENTENCE_MASTERED = 2;  // sentences draw on several known words at once: lower bar
function storageKey(pack){ return `vocab_${pack.key}`; }
function defaultProg(pack){
  const sets = {}; levelIds(pack).forEach(id=>{ sets[id] = 0; });
  const p = { v:PROG_VERSION, w:{}, s:{}, sets, lessons:{}, sessions:0, theme:null, showPron: pack.showPron !== false, placedOnce:false };
  if(charsConfig(pack)) p.chars = defaultCharsProg(); // absent without pack.characters: flag-off shape unchanged
  return p;
}
const isObj = x => !!x && typeof x === "object" && !Array.isArray(x);
function validateRecMap(m, name, allowWordFlags){
  if(!isObj(m)) return `${name} must be an object`;
  for(const k of Object.keys(m)){
    const p = m[k];
    if(!isObj(p)) return `${name}.${k} must be an object`;
    for(const f of ["r","w","s"]) if(p[f] !== undefined && typeof p[f] !== "number") return `${name}.${k}.${f} must be a number`;
    if(allowWordFlags){
      for(const f of ["prov","d"]) if(p[f] !== undefined && typeof p[f] !== "number" && typeof p[f] !== "boolean") return `${name}.${k}.${f} must be a number or boolean`;
    }
  }
  return null;
}
// Validates imported progress JSON before it replaces the live object.
// levelIdList: the pack's level ids (sets keys must be among them).
// Returns {ok:true, data} or {ok:false, reason}.
function validateProgShape(data, levelIdList){
  if(!isObj(data)) return {ok:false, reason:"not a JSON object"};
  if(data.v !== undefined && data.v !== PROG_VERSION) return {ok:false, reason:`unknown progress version ${data.v}`};
  for(const b of ["w","s"]){
    if(data[b] === undefined) continue;
    const e = validateRecMap(data[b], b, b === "w"); if(e) return {ok:false, reason:e};
  }
  if(data.sets !== undefined){
    if(!isObj(data.sets)) return {ok:false, reason:"sets must be an object"};
    const allowed = new Set((levelIdList||[]).map(String));
    for(const k of Object.keys(data.sets)){
      if(!allowed.has(k)) return {ok:false, reason:`sets has unknown level "${k}"`};
      if(!Number.isInteger(data.sets[k]) || data.sets[k] < 0) return {ok:false, reason:`sets.${k} must be a non-negative integer`};
    }
  }
  if(data.lessons !== undefined && !isObj(data.lessons)) return {ok:false, reason:"lessons must be an object"};
  if(data.sessions !== undefined && typeof data.sessions !== "number") return {ok:false, reason:"sessions must be a number"};
  if(data.showPron !== undefined && typeof data.showPron !== "boolean") return {ok:false, reason:"showPron must be a boolean"};
  if(data.placedOnce !== undefined && typeof data.placedOnce !== "boolean" && typeof data.placedOnce !== "number") return {ok:false, reason:"placedOnce must be a boolean or number"};
  if(data.soundsOpened !== undefined && typeof data.soundsOpened !== "boolean" && typeof data.soundsOpened !== "number") return {ok:false, reason:"soundsOpened must be a boolean or number"};
  if(data.theme !== undefined && data.theme !== null && data.theme !== "light" && data.theme !== "dark") return {ok:false, reason:"theme must be null, \"light\" or \"dark\""};
  if(data.read !== undefined){ const e = validateReadShape(data.read); if(e) return {ok:false, reason:e}; }
  if(data.chars !== undefined){ const e = validateCharsShape(data.chars); if(e) return {ok:false, reason:e}; }
  return {ok:true, data};
}
// Fills every missing field of validated (or stored) progress from the pack's
// defaults, and gives every pack level a sets counter. Fields present are kept.
function normalizeProg(data, pack){
  const base = defaultProg(pack);
  const merged = Object.assign({}, base, data||{}, {v:PROG_VERSION});
  merged.sets = Object.assign({}, base.sets, (data && data.sets) || {});
  for(const k of ["w","s","lessons"]) if(!isObj(merged[k])) merged[k] = {};
  if(charsConfig(pack)) merged.chars = normalizeCharsProg(data && data.chars);
  return merged;
}
// Parses a stored/imported progress string. Only a JSON object is progress;
// arrays, strings, numbers, null are rejected rather than Object.assign'ed.
function parseStored(raw){
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return {ok:false, reason:"not valid JSON"}; }
  if(!isObj(data)) return {ok:false, reason:"not a JSON object"};
  return {ok:true, data};
}
// Boot-time leniency: a pack that renamed/removed a level must not wipe everything
// else. Drops `sets` keys that aren't current pack levels (reported in `dropped`),
// leaving the rest for strict validation. Manual import stays strict.
function dropUnknownSets(data, levelIdList){
  const allowed = new Set((levelIdList||[]).map(String));
  if(!isObj(data) || !isObj(data.sets)) return { data, dropped: [] };
  const dropped = Object.keys(data.sets).filter(k=>!allowed.has(k));
  if(!dropped.length) return { data, dropped };
  const sets = {}; Object.keys(data.sets).forEach(k=>{ if(allowed.has(k)) sets[k] = data.sets[k]; });
  return { data: Object.assign({}, data, { sets }), dropped };
}
// Decides boot progress from the raw stored string (null = nothing stored).
// Returns {prog, backupRaw, dropped, reason}: backupRaw non-null means the stored
// value was unusable and must be preserved under the invalid-backup key before the
// defaults replace it on the next save.
// readError: the storage backend threw on read. Nothing is known about what is stored,
// so the session runs read-only (defaults, never saved) rather than risk a save
// clobbering real progress that merely failed to load.
function bootProg(raw, pack, readError){
  const out = { prog: defaultProg(pack), backupRaw: null, dropped: [], reason: null, readOnly: false };
  if(readError){ out.readOnly = true; out.reason = "storage read failed"; return out; }
  if(raw == null || raw === "") return out;
  const p = parseStored(raw);
  if(!p.ok){ out.backupRaw = String(raw); out.reason = p.reason; return out; }
  const d = dropUnknownSets(p.data, levelIds(pack));
  const v = validateProgShape(d.data, levelIds(pack));
  if(!v.ok){ out.backupRaw = String(raw); out.reason = v.reason; return out; }
  out.dropped = d.dropped;
  out.prog = normalizeProg(d.data, pack);
  return out;
}
// Manual import (strict). prev = current progress: its theme/showPron survive when
// the import doesn't carry them. Returns {ok, prog} or {ok:false, reason}.
function applyImport(prev, text, pack){
  const p = parseStored(text);
  if(!p.ok) return p;
  const v = validateProgShape(p.data, levelIds(pack));
  if(!v.ok) return v;
  const prog = normalizeProg(v.data, pack);
  if(v.data.theme === undefined) prog.theme = prev ? prev.theme : null;
  if(v.data.showPron === undefined && prev && prev.showPron !== undefined) prog.showPron = prev.showPron;
  // The characters mix preference survives an import that doesn't carry it, like theme.
  if(prog.chars && !(isObj(v.data.chars) && v.data.chars.mix !== undefined) && prev && isObj(prev.chars) && typeof prev.chars.mix === "boolean") prog.chars.mix = prev.chars.mix;
  return {ok:true, prog};
}
function markRec(map, key, ok, isWord){
  const p = map[key] || {r:0,w:0,s:0};
  if(ok){ p.r++; p.s++; } else { p.w++; p.s=0; }
  if(isWord && p.prov && (p.s>=WORD_MASTERED || !ok)) delete p.prov;
  map[key] = p; return p;
}
const weakScore = rec => { const p = rec || {r:0,w:0,s:0}; return (p.w||0)*3 - (p.s||0); };
// Weakest first with jitter (ties and near-ties shuffle so reviews don't repeat).
function weakFirst(list, n, recs, keyOf, rng){
  const r = rng || Math.random; const key = keyOf || (x=>x.id);
  return list.map(x=>({x, k: weakScore((recs||{})[key(x)]) + (r()-0.5)})).sort((a,b)=>b.k-a.k).slice(0,n).map(o=>o.x);
}
function provPick(list, n, wrecs){
  return shuffle(list.filter(x=>{ const p = (wrecs||{})[x.id]; return p && p.prov && (p.s||0) < WORD_MASTERED; })).slice(0,n);
}

// Words from completed sets (per level, in pack order), plus any word flagged `d`
// (drilled ahead of its set from the Words tab).
function learnedWords(words, pack, prog){
  const size = setSizeOf(pack); const byLv = wordsByLevel(words, pack);
  const out = [];
  levelIds(pack).forEach(lv=>{ out.push(...byLv[lv].slice(0, ((prog.sets||{})[lv]||0)*size)); });
  const seen = new Set(out.map(w=>w.id));
  (words||[]).forEach(v=>{ if(!seen.has(v.id) && prog.w[v.id] && prog.w[v.id].d){ out.push(v); seen.add(v.id); } });
  return out;
}
// Next unlearned set, iterating levels in pack order: {lv, set} or null.
function nextNewSet(words, pack, prog){
  const size = setSizeOf(pack); const byLv = wordsByLevel(words, pack);
  for(const lv of levelIds(pack)){
    const done = (prog.sets||{})[lv]||0;
    if(done < nSets(byLv[lv], size)) return {lv, set: done};
  }
  return null;
}
// Index of the level nextNewSet() would teach from, or levels.length when all done.
function currentLevelIndex(words, pack, prog){
  const nn = nextNewSet(words, pack, prog);
  return nn ? levelIndexMap(pack)[nn.lv] : levelIds(pack).length;
}
// A sentence is available once every word id in it is learned, or once the learner
// has moved past the sentence's level entirely.
function availableSentences(sentences, words, pack, prog){
  const lw = new Set(learnedWords(words, pack, prog).map(w=>w.id));
  const cur = currentLevelIndex(words, pack, prog); const idx = levelIndexMap(pack);
  return (sentences||[]).filter(s => cur > idx[s.lv] || (s.words||[]).every(id=>lw.has(id)));
}

// ------------------------------------------------------------------ Today item plans
// Plans are [{kind, word}] (words) or [{kind, sentence}] — the app turns each into a
// drill item. Kept here, DOM-free, so composition rules are testable under Node.
const PRODUCTION_KINDS = ["recall","type"];
const REVIEW_SIZE = 15, REVIEW_PROV = 5, REVIEW_PRODUCTION_SHARE = 0.4;
// Assigns kinds to n slots: ceil(share*n) production (recall/type alternating when
// typing is on, else all recall), the rest receptive hear:read at 2:1.
function kindMix(n, share, typing, rng){
  const nProd = Math.ceil(n*share - 1e-9);
  const kinds = [];
  for(let i=0;i<nProd;i++) kinds.push(typing && i%2===1 ? "type" : "recall");
  for(let i=0;i<n-nProd;i++) kinds.push(i%3===2 ? "read" : "hear");
  return shuffle(kinds, rng);
}
// Review step: up to REVIEW_PROV provisional (placement-guessed) words plus the
// weakest learned words, REVIEW_SIZE total, >= REVIEW_PRODUCTION_SHARE production.
// opts.units (optional): the pack's character units. When the pack has a characters
// block and some unit has a record, Review is unified (see unifiedReviewPlan); with no
// such unit the code below runs unchanged, so the output is identical to a word-only plan.
function buildReviewPlan(learned, prog, pack, opts){
  const o = opts || {}; const n = o.size || REVIEW_SIZE;
  const ru = recordedUnits(o.units, prog, pack);
  if(ru.length) return unifiedReviewPlan(learned, ru, prog, pack, n, o.rng);
  const pv = provPick(learned, Math.min(REVIEW_PROV, n), prog.w);
  const pvSet = new Set(pv.map(w=>w.id));
  const rest = weakFirst(learned.filter(x=>!pvSet.has(x.id)), n - pv.length, prog.w, null, o.rng);
  const pool = shuffle([...rest, ...pv], o.rng);
  const kinds = kindMix(pool.length, REVIEW_PRODUCTION_SHARE, typingEnabled(pack), o.rng);
  return pool.map((word,i)=>({ kind: kinds[i], word }));
}
// Recall step: weakest n learned words, all production (recall/type mix).
// opts.units / opts.rng: as buildReviewPlan. Recorded units join the same weakest-first
// ranking as charRecall items; with none the word-only code below runs unchanged.
function buildRecallPlan(learned, prog, pack, n, opts){
  const o = opts || {};
  const ru = recordedUnits(o.units, prog, pack);
  if(ru.length) return unifiedRecallPlan(learned, ru, prog, pack, n, o.rng);
  const pool = weakFirst(learned, n, prog.w);
  const kinds = kindMix(pool.length, 1, typingEnabled(pack));
  return pool.map((word,i)=>({ kind: kinds[i], word }));
}
// Sentence kind: hear 50 / read 25 / gap 25. Gap is "gapType" (type the blank) half
// the time when the pack has typing, else multiple choice.
function sentenceKind(pack, rng){
  const r = (rng || Math.random)();
  if(r < 0.5) return "hear";
  if(r < 0.75) return "read";
  return typingEnabled(pack) && (rng || Math.random)() < 0.5 ? "gapType" : "gap";
}

// ------------------------------------------------------------------ lessons
// Miss-dedupe key for a lesson item: its lesson id plus its index in lesson.items
// (question text is reused across items, so it can't be the key).
const lessonItemKey = (lessonId, index) => `l:${lessonId}#${index}`;
// How a lesson item with `say` (audio) runs when speech may be unavailable:
//   "audio"  speech works (or the item has no say): play it as authored
//   "inq"    no speech, but the question text already contains the say text: run as is
//   "text"   no speech: show the say text in place of the audio
//   "skip"   no speech, and the say text would give the answer away (contains it)
function lessonSayMode(item, speechOK){
  if(!item || !item.say || speechOK) return "audio";
  const say = normKey(item.say), q = normKey(item.q), a = normKey(item.a);
  if(q.indexOf(say) >= 0) return "inq";
  if(a && say.indexOf(a) >= 0) return "skip";
  return "text";
}

// Which Today steps run, given the learned-word count, whether a new set remains,
// and the available-sentence count. Shared by the Today plan table and the runner.
function todayGates(learnedCount, hasNextSet, availSentCount){
  return { review: learnedCount >= 5, learn: !!hasNextSet, listen: learnedCount >= 4, recall: learnedCount >= 4, sentences: availSentCount >= 8 };
}
// Test tab: free word tests need TEST_MIN_WORDS learned words; the sentence test needs
// 8 available sentences. The "learn first" notice depends on learned words only
// (placement itself needs no sentences); the sentence button simply stays hidden.
const TEST_MIN_WORDS = 8;
function testGates(learnedCount, availSentCount){
  const words = learnedCount >= TEST_MIN_WORDS, sentences = availSentCount >= 8;
  return { words, sentences, needPlacement: !words };
}

// ------------------------------------------------------------------ speech
const normLang = s => String(s||"").replace(/_/g,"-").toLowerCase();
// Best voice for a BCP-47 locale: exact locale, else same base language, else null.
function pickVoice(voices, lang){
  const want = normLang(lang), base = want.split("-")[0];
  const vs = voices || [];
  return vs.find(v=>normLang(v.lang)===want) || vs.find(v=>normLang(v.lang).split("-")[0]===base) || null;
}
// Whether listening items can play: needs the API, and — once the browser has
// reported its voice list — a voice for the pack's language (a zh word read by an
// English voice is worse than showing it). An empty list means "not loaded yet /
// unknown": optimistic, since some browsers never populate it but still speak.
function speechUsable(apiPresent, voices, lang){
  if(!apiPresent) return false;
  if(!voices || !voices.length) return true;
  return !!pickVoice(voices, lang);
}
// Samsung Internet on Android reports a voice via speechSynthesis for most
// languages but never actually plays audio through it, so speechUsable()
// (which only checks voice availability) misses it. Pure UA check, no pack
// involvement: shown regardless of hasSpeech, every visit, no dismiss —
// unlike the no-voice notice, the problem persists until the browser changes.
function isSamsungBrowser(ua){
  return /SamsungBrowser/i.test(String(ua||""));
}

// ------------------------------------------------------------------ audio
// One shared playback slot for recorded audio. play(url) pauses whatever the slot played
// last and reuses a single audio object (created once via make()), so repeated or
// duplicated taps can never stack parallel players or requests.
function audioSlot(make){
  let a = null;
  return {
    play(url){
      if(!a) a = make(); else { try{ a.pause(); }catch(e){} }
      a.src = url;
      return a;
    },
    stop(){ if(a){ try{ a.pause(); }catch(e){} } }
  };
}

// ------------------------------------------------------------------ reading passages
// Optional pack data (passages.json, docs/PACK_SCHEMA.md "passages.json"). A level's
// passages unlock once READ_UNLOCK of that level's words are learned; the unlock is
// stored in prog.read.unlocked so it survives later changes. Reading state lives in
// prog.read = { unlocked: {levelId: 1}, done: {passageId: {sc, n, d, x}} } and is absent
// until the learner first meets a passage, so older stored progress needs no migration.
const READ_UNLOCK = 0.7;
// Weights for "Weak words from this passage": misses added to prog.w[id].w.
const READ_WEIGHT = { tapped: 2, wrong: 2, reopened: 1 };
function readState(prog){
  if(!isObj(prog.read)) prog.read = {};
  if(!isObj(prog.read.unlocked)) prog.read.unlocked = {};
  if(!isObj(prog.read.done)) prog.read.done = {};
  return prog.read;
}
// Per pack level: {lv, total, learned, need, frac, met, unlocked, count}. count = passages
// at that level; need = learned words the threshold asks for (ceil(70% of total)).
function readingLevels(passages, words, pack, prog){
  const learned = learnedWords(words, pack, prog);
  const byLv = wordsByLevel(words, pack);
  const stored = (isObj(prog.read) && isObj(prog.read.unlocked)) ? prog.read.unlocked : {};
  return levelIds(pack).map(lv => {
    const total = byLv[lv].length, got = learned.filter(w => w.lv === lv).length;
    const need = Math.ceil(total * READ_UNLOCK - 1e-9);
    const met = total > 0 && got >= need;
    return { lv, total, learned: got, need, frac: total ? got/total : 0, met, unlocked: met || !!stored[lv],
      count: (passages||[]).filter(p => p.lv === lv).length };
  });
}
// Records newly met thresholds in prog.read.unlocked (sticky). Only levels that have
// passages are recorded. Returns the level ids unlocked by this call.
function updateReadUnlocks(passages, words, pack, prog){
  const fresh = readingLevels(passages, words, pack, prog).filter(l => l.met && l.count > 0 && !(isObj(prog.read) && isObj(prog.read.unlocked) && prog.read.unlocked[l.lv]));
  if(fresh.length){ const st = readState(prog); fresh.forEach(l => { st.unlocked[l.lv] = 1; }); }
  return fresh.map(l => l.lv);
}
// Today's suggestion: the first not-done passage in pack order at an unlocked level, or null.
function suggestPassage(passages, words, pack, prog){
  const open = new Set(readingLevels(passages, words, pack, prog).filter(l => l.unlocked).map(l => l.lv));
  const done = (isObj(prog.read) && isObj(prog.read.done)) ? prog.read.done : {};
  return (passages||[]).find(p => open.has(p.lv) && !done[p.id]) || null;
}
// Length in words: whitespace tokens for spaced scripts, linked word tokens otherwise.
function passageLength(p, pack){
  if(!pack || pack.spaced !== false) return String((p && p.text) || "").trim().split(/\s+/).filter(Boolean).length;
  return ((p && p.sentences) || []).reduce((n, s) => n + ((s.words || []).length), 0);
}
// Sentence text split into tappable pieces: [{text, id}] where id is the linked word
// found there (null for plain text), plus `unplaced`, the linked ids not visible in the
// text, which the UI lists under the sentence so every linked word stays tappable.
// Builder spans come first: s.spans = [[start, end, wordId]] (UTF-16 offsets into s.t,
// the token each word was read from, so inflected forms like mele or va are tappable).
// A span is used when its bounds are valid, it covers non-blank text without splitting a
// surrogate pair, its id is in s.words and known, and it does not overlap an earlier span. Ids in s.words with no span fall back to surface matching:
// w, every alt and its bare form, as findSurface does for the pack; overlapping hits keep
// the longest (per start, earliest first), so 为什么 wins over 为, and never cover a span.
// A pack without spans behaves exactly as before. Joining every piece's text gives s.t.
// True when UTF-16 index i falls between the two halves of a surrogate pair.
function splitsPair(t, i){ return i > 0 && i < t.length && t.codePointAt(i - 1) > 0xFFFF; }
function passageSegments(s, wordsById, pack){
  const t = String((s && s.t) || "");
  const spaced = !pack || pack.spaced !== false;
  const by = wordsById || {};
  const arts = packArticles(by);
  const ids = [...new Set((s && s.words) || [])];
  const idSet = new Set(ids);
  const keep = [], spanned = new Set();
  ((s && Array.isArray(s.spans)) ? s.spans : [])
    .filter(x => Array.isArray(x) && Number.isInteger(x[0]) && Number.isInteger(x[1]) && x[0] >= 0 && x[0] < x[1] && x[1] <= t.length && idSet.has(x[2]) && by[x[2]]
      && t.slice(x[0], x[1]).trim() && !splitsPair(t, x[0]) && !splitsPair(t, x[1]))
    .map(x => ({ start: x[0], end: x[1], id: x[2] }))
    .sort((a,b) => a.start - b.start)
    .forEach(h => { if(!keep.some(k => h.start < k.end && k.start < h.end)){ keep.push(h); spanned.add(h.id); } });
  const hits = [];
  ids.forEach(id => {
    const e = by[id]; if(!e || spanned.has(id)) return;
    const forms = [...new Set([e.w, ...(e.alt || []), bareForm(e, arts)].filter(Boolean))];
    forms.forEach(f => findSurface(t, f, spaced).forEach(m => hits.push({ start: m.start, end: m.end, id })));
  });
  hits.sort((a,b) => (b.end - b.start) - (a.end - a.start) || a.start - b.start);
  hits.forEach(h => { if(!keep.some(k => h.start < k.end && k.start < h.end)) keep.push(h); });
  keep.sort((a,b) => a.start - b.start);
  const parts = []; let at = 0;
  keep.forEach(h => { if(h.start > at) parts.push({ text: t.slice(at, h.start), id: null }); parts.push({ text: t.slice(h.start, h.end), id: h.id }); at = h.end; });
  if(at < t.length || !parts.length) parts.push({ text: t.slice(at), id: null });
  const placed = new Set(keep.map(h => h.id));
  return { parts, unplaced: ids.filter(id => !placed.has(id) && by[id]) };
}
// Grades one answer: mc = option index, tf = boolean. Anything else is wrong.
function gradeQuestion(q, answer){
  if(!q) return false;
  if(q.type === "tf") return typeof answer === "boolean" && answer === q.answer;
  return Number.isInteger(answer) && answer === q.answer;
}
// "Weak words from this passage". log = {tapped: [wordId], answers: [{ok, reopened}] by
// question index}. Tapped words and the words of wrongly answered questions weigh

// ------------------------------------------------------------------ characters

  return `<div class="big wd"${TA}>${escapeHtml(entry.w)}</div>${p ? `<div class="pron">${escapeHtml(p)}</div>` : ""}`;
}
// Option label for word-choice items (recall/gap): the word, plus its pron when shown.
function wordOptHtml(byW){
  return o => { const e = byW[o]; const p = e ? pronOf(e) : ""; return `${tw(o)}${p ? `<span class="op"><bdi>${escapeHtml(p)}</bdi></span>` : ""}`; };
}

// ===================== generic drill runner =====================
// item: {kind:'mc'|'type', label, html, opts?, a?, optHtml?, reveal, onAnswer?, mount?, check?, onReveal?}
function drill(items, onDone, summary){ D = { q: shuffle(items.slice()), right:0, seen:0, miss:[], onDone, summary }; dnext(); }
function setScore(answered, total){
  const left = total ? Math.max(0, total - answered) : 0;
  $("score").textContent = (total && left > 0) ? `${left} left` : "";
  const fill = $("hdrbarfill");
  if(!fill) return;
  if(!total){ fill.style.display = "none"; fill.style.width = "0%"; return; }
  fill.style.display = "block";
  fill.style.width = `${Math.min(100, Math.max(0, Math.round((answered/total)*100)))}%`;
}
function announce(html){
  const el = $("live"); if(!el) return;
  const tmp = document.createElement("div"); tmp.innerHTML = html || "";
  el.textContent = tmp.textContent || "";
}
function showReveal(html){
  const rv = $("rv"); if(!rv) return;
  rv.innerHTML = html;
  rv.style.display = html ? "block" : "none";
  if(html){ rv.style.opacity = "0"; requestAnimationFrame(()=>{ rv.style.opacity = "1"; }); }
  announce(html);
}
function dnext(){
  if(!D) return;
  const P = $("panel");
  if(!D.q.length){
    const { right, seen, miss, onDone, summary } = D;
    setScore(0, 0);
    P.innerHTML = `<div class="done"><h2>${right} / ${seen}</h2>${summary ? summary(miss) : ""}<button class="next" id="ok">Continue</button></div>`;
    D = null; drillKeyHandler = null;
    $("ok").onclick = onDone;
    return;
  }
  setScore(D.seen, D.seen + D.q.length);
  const it = D.q.shift();
  if(it.kind === "type") renderTypeItem(it); else renderMcItem(it);
}
function renderMcItem(it){
  const P = $("panel");
  P.innerHTML = `<div class="drill-body"><p class="q">${escapeHtml(it.label)}</p>${noticeFor(it)}${it.html||""}<div class="opts ${it.optsClass||""}" id="o"></div><div class="reveal" id="rv"></div></div><div class="actions"><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const opts = shuffle(it.opts.slice());
  const container = $("o");
  let answered = false;
  opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.innerHTML = `<b class="num">${i+1}</b>${it.optHtml ? it.optHtml(o) : escapeHtml(o)}`;
    if(it.optsT && SCRIPT.rtl) b.dir = "rtl"; // options are target-language words
    b.onclick = () => {
      if(answered) return; answered = true;
      [...container.children].forEach(x=>{ x.disabled = true; if(x.dataset.v === it.a) x.classList.add("ok"); });
      const ok = o === it.a;
      if(!ok) b.classList.add("bad");
      D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(it); }
      if(it.onAnswer) it.onAnswer(ok);
      showReveal(it.reveal || "");
      if(it.onReveal) it.onReveal();
      $("nx").style.display = "block"; setScore(D.seen, D.seen + D.q.length);
    };
    b.dataset.v = o;
    container.appendChild(b);
  });
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    const nx = $("nx");
    if(e.key >= "1" && e.key <= String(opts.length) && !answered){ container.children[+e.key-1].click(); }
    else if(e.key === "Enter" && nx && nx.style.display !== "none"){ dnext(); }
    else if(e.key === "Escape"){ quitDrill(); }
  };
}
function renderTypeItem(it){
  const P = $("panel");
  P.innerHTML = `<div class="drill-body"><p class="q">${escapeHtml(it.label)}</p>${noticeFor(it)}${it.html||""}
    <input type="text" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"${TA} placeholder="${SCRIPT.rtl ? "type the word" : "type the word…"}">
    <div class="reveal" id="rv"></div></div><div class="actions"><button class="next" id="submit">Check</button><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const input = $("tin"); input.focus();
  let answered = false;
  function submit(){
    if(answered) return; if(!input.value.trim()) return;
    answered = true; input.disabled = true; $("submit").style.display = "none";
    const ok = it.check(input.value);
    D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(it); }
    if(it.onAnswer) it.onAnswer(ok);
    showReveal((ok ? "" : `<div class="diff">you typed: ${escapeHtml(input.value)}</div>`) + (it.reveal||""));
    if(it.onReveal) it.onReveal();
    $("nx").style.display = "block"; setScore(D.seen, D.seen + D.q.length);
  }
  $("submit").onclick = submit;
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    if(e.key === "Enter"){ answered ? dnext() : submit(); }
    else if(e.key === "Escape"){
      if(document.activeElement === input){ input.blur(); return; }
      quitDrill();
    }
  };
}
document.addEventListener("keydown", e => { if(drillKeyHandler) drillKeyHandler(e); });
function quitDrill(){ D = null; drillKeyHandler = null; render(); }

// Tap-to-hear for markup anywhere in #panel: data-sent (a SENTENCES index) speaks that
// sentence, data-wid (a word id) speaks that word. INVARIANT: this is the only listener
// for these attributes and it is attached exactly once, here, at load. #panel is
// persistent (screens replace its innerHTML), so attaching per render/reveal/drill-end
// would accumulate one more listener each time (N taps -> N sounds). Render code just
// emits the attributes and never wires them.
$("panel").addEventListener("click", e => {
  const t = e.target.closest("[data-sent],[data-wid]");
  if(!t) return;
  if(t.dataset.wid !== undefined){ const w = WORDS_BY_ID[t.dataset.wid]; if(w) say(w.w); return; }
  const s = SENTENCES[+t.dataset.sent]; if(s) saySentence(s);
});

// ===================== word drill items =====================
// Sentence text with the taught word bolded where it is visible (VC.highlightParts).
function highlightHTML(s, entry){
  return VC.highlightParts(s, entry, WORDS_BY_ID, PACK).map(x => x.hit ? `<b>${escapeHtml(x.text)}</b>` : escapeHtml(x.text)).join("");
}
// entry (optional): the taught word, highlighted in the sentence.
function sentenceRowHTML(s, entry){
  const p = pronOf(s);
  return `<div class="sent" data-sent="${SENT_INDEX.get(s)}"><div class="st"${TA}>${entry ? highlightHTML(s, entry) : escapeHtml(s.t)}</div>${p ? `<div class="sp">${escapeHtml(p)}</div>` : ""}<div class="se">${escapeHtml(s.en)}</div></div>`;
}
function exampleSentencesHTML(entry){
  const ex = wordExampleSentences(entry, 2);
  if(!ex.length) return "";
  return `<p class="q" style="margin-top:12px">Example${ex.length>1?"s":""}:</p>${ex.map(s => sentenceRowHTML(s, entry)).join("")}`;
}
function revealBlock(entry){
  const p = pronOf(entry);
  const icon = hasSpeech ? ` <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span>` : "";
  return `<div${hasSpeech ? ` data-wid="${escapeHtml(entry.id)}" style="cursor:pointer"` : ""}><div class="rw"${TA}>${escapeHtml(entry.w)}${icon}</div>${p ? `<div class="rp">${escapeHtml(p)}</div>` : ""}<div style="color:var(--mute)">${escapeHtml(VC.gloss(entry))}</div></div>${exampleSentencesHTML(entry)}`;
}
const meaningChoices = entry => [VC.gloss(entry), ...VC.meaningOpts(entry, WORDS).map(d=>VC.gloss(d))];
// hear — TTS plays the word; pick the meaning. Without speech it degrades to read.
function hearItem(entry){
  if(!hasSpeech) return Object.assign(readItem(entry), { needsNotice: true });
  return { kind:"mc", key:"w:"+entry.id, label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`,
    opts: meaningChoices(entry), a: VC.gloss(entry), reveal: `<div class="q">You heard:</div>${revealBlock(entry)}`,
    onAnswer: ok=>markWord(entry.id, ok),
    mount: () => { const btn = $("sp"); speak(entry.w, btn); btn.onclick = ()=>speak(entry.w, btn); },
    };
}
// read — word shown; pick the meaning. Audio auto-plays.
function readItem(entry){
  return { kind:"mc", key:"w:"+entry.id, label:"What does it mean?", optsClass:"opts-hero",
    html: bigWordHTML(entry), opts: meaningChoices(entry), a: VC.gloss(entry), reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), mount: () => say(entry.w), };
}
// recall — meaning shown; pick the word (wordOpts: same pos/level first, never a
// distractor that would also be a right answer).
function recallItem(entry){
  const ds = VC.wordOpts(entry, WORDS, null, PACK); // same word class as the answer
  const byW = {}; [entry, ...ds].forEach(e=>{ byW[e.w] = e; });
  return { kind:"mc", key:"w:"+entry.id, label:"Which word is this?", optsClass:"opts-hero opts-w",
    html: `<div class="med" style="text-align:center">${escapeHtml(VC.gloss(entry))}</div>`,
    opts: [entry.w, ...ds.map(d=>d.w)], a: entry.w, optHtml: wordOptHtml(byW), optsT: true, reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), onReveal: () => say(entry.w) };
}
// type — meaning shown; type the word (normalised per pack.typing, alt forms accepted).
function typeItem(entry){
  return { kind:"type", key:"w:"+entry.id, label:"Type the word",
    html: `<div class="med" style="text-align:center">${escapeHtml(VC.gloss(entry))}</div>`,
    check: val => VC.acceptTyped(val, entry, PACK), reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), onReveal: () => say(entry.w) };
}
const WORD_ITEM = { hear: hearItem, read: readItem, recall: recallItem, type: e => TYPING ? typeItem(e) : recallItem(e) };
const itemFromPlan = p => WORD_ITEM[p.kind](p.word);
// One card per missed word/sentence (items carry `key`), however many question types
// it was missed as; the most-missed first, with a count when missed more than once.
function missSummary(miss){
  const u = VC.dedupeMisses(miss);
  return u.length ? `<p class="q">Missed:</p>${u.map(({item, count})=>`<div class="stmt">${count > 1 ? `<div class="q" style="margin:0 0 4px">missed ${count}×</div>` : ""}${item.reveal}</div>`).join("")}` : "<p class='q'>Clean.</p>";
}

// ===================== sentence drill items =====================
function sentenceRevealBlock(s){
  const p = pronOf(s);
  const canHear = canHearSentence(s);
  const icon = canHear ? ` <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span>` : "";
  return `<div${canHear ? ` data-sent="${SENT_INDEX.get(s)}" style="cursor:pointer"` : ""}><div class="rw"${TA}>${escapeHtml(s.t)}${icon}</div>${p ? `<div class="rp">${escapeHtml(p)}</div>` : ""}<div style="color:var(--mute)">${escapeHtml(s.en)}</div></div>`;
}
const sentenceChoices = s => [s.en, ...VC.sentenceOpts(s, SENTENCES).map(d=>d.en)];
function readSentence(s){
  const p = pronOf(s);
  return { kind:"mc", key:"s:"+s.id, label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="med wd"${TA}>${escapeHtml(s.t)}</div>${p ? `<div class="q">${escapeHtml(p)}</div>` : ""}`,
    opts: sentenceChoices(s), a: s.en, reveal: sentenceRevealBlock(s), onAnswer: ok=>markSentence(s.id, ok),
    mount: () => saySentence(s), };
}
function hearSentence(s){
  if(!canHearSentence(s)) return Object.assign(readSentence(s), { needsNotice: true });
  return { kind:"mc", key:"s:"+s.id, label:"What did they say?", optsClass:"opts-hero",
    html: `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`,
    opts: sentenceChoices(s), a: s.en, reveal: `<div class="q">You heard:</div>${sentenceRevealBlock(s)}`,
    onAnswer: ok=>markSentence(s.id, ok),
    mount: () => { const btn = $("sp"); saySentence(s, btn); btn.onclick = ()=>saySentence(s, btn); },
    };
}
// gap — sentence with one content word blanked; pick it from 4, or type it. Returns
// null when the sentence has no legal blank (callers fall back to readSentence). No
// audio before answering: hearing the sentence would give the blank away.
function gapSentence(s, typed){
  const idxs = VC.gapCandidateIndices(s, WORDS_BY_ID, PACK);
  if(!idxs.length) return null;
  const entry = WORDS_BY_ID[s.words[idxs[Math.floor(Math.random()*idxs.length)]]];
  const match = VC.gapMatch(s, entry, WORDS_BY_ID, PACK);
  const b = VC.blankSentence(s, match);
  const html = `<div class="med wd"${TA}>${escapeHtml(b.before)}<span class="blank">____</span>${escapeHtml(b.after)}</div><div class="q">${escapeHtml(s.en)}</div>`;
  const base = { key:"s:"+s.id, reveal: sentenceRevealBlock(s), onAnswer: ok=>markSentence(s.id, ok),
    onReveal: () => saySentence(s) };
  if(typed && TYPING){
    return Object.assign(base, { kind:"type", label:"Type the missing word", html,
      check: val => VC.acceptTyped(val, entry, PACK, [match.text]) });
  }
  const gc = VC.gapChoices(entry, match, WORDS, PACK);
  return Object.assign(base, { kind:"mc", label:"What's the missing word?", optsClass:"opts-hero opts-w", html,
    opts: gc.opts, a: gc.a, optHtml: wordOptHtml(gc.byLabel), optsT: true });
}
function sentenceItemFor(s){
  const k = VC.sentenceKind(PACK);
  if(k === "hear") return hearSentence(s);
  if(k === "read") return readSentence(s);
  return gapSentence(s, k === "gapType") || readSentence(s);
}

// ===================== lesson item wrapper =====================
// mode from VC.lessonSayMode: "audio" plays `say`; "inq" runs without audio (the
// question already shows it); "text" shows the say text instead of audio.
// ("skip" items never reach here — lessonTeach filters them out.)
function lessonItem(it, key, mode){
  const html = mode === "audio"
    ? (it.say ? `<div class="listen-stage"><button class="replay" id="rpl" aria-label="Replay">${REPLAY_SVG}</button></div>` : "")
    : (mode === "text" ? `<div class="big wd"${TA}>${escapeHtml(it.say)}</div>` : "");
  return { kind:"mc", key, label: it.q, html,
    mount: () => { if(mode === "audio" && it.say){ say(it.say); $("rpl").onclick = ()=>say(it.say); } },
    opts: it.opts, a: it.a, reveal: `<div>${escapeHtml(it.rv||"")}</div>` };
}

// ===================== Today =====================
function pathStrip(){
  const stages = LEVELS.map(lv=>({ label: levelLabel(lv), frac: nSets(lv) ? (prog.sets[lv]||0)/nSets(lv) : 1 }));
  return `<div class="path">${stages.map(s=>`<div class="seg"><div class="bar"><i style="width:${Math.round(s.frac*100)}%"></i></div>${escapeHtml(s.label)}</div>`).join("")}</div>`;
}
function todayRender(){
  setScore(0,0);
  const P = $("panel"); const lw = learnedWords(); const nn = nextNewSet();
  const n = (prog.sessions||0) + 1;
  const availSent = availableSentences();
  const g = VC.todayGates(lw.length, !!nn, availSent.length);
  const steps = [
    ["Review", g.review ? `${VC.REVIEW_SIZE} items, weakest first` : "skipped until 5+ words are learned"],
    ["Learn", nn ? `${levelLabel(nn.lv)}, set ${nn.set+1}` : "everything covered"],
    ["Listen", g.listen ? "12 items" : "skipped until something is learned"],
    ["Recall", g.recall ? "8 items" : "skipped until something is learned"],
    ["Sentences", g.sentences ? "8 items, weakest first" : "skipped until 8+ sentences are available"]
  ];
  const showPlaceHint = !prog.placedOnce;
  const showSoundsHint = HAS_LESSONS && !prog.soundsOpened;
  refreshReadUnlocks();
  const readHint = HAS_PASSAGES ? VC.suggestPassage(PASSAGE_LIST, WORDS, PACK, prog) : null;
  P.innerHTML = `<div class="drill-body top">${samsungNoticeHTML}${pathStrip()}
    ${showPlaceHint ?`<div class="stmt">New here? Placement finds where to start.<button class="next" id="hintPlace" style="margin-top:8px">Take the placement test</button></div>` : ""}
    ${showSoundsHint ? `<div class="stmt">A few short lessons explain how ${escapeHtml(PACK.name)} sounds and is written.<button class="next" id="hintSounds" style="margin-top:8px">Start the first lesson</button></div>` : ""}
    ${readHint ? `<div class="stmt" id="readHintBox">Read 1 passage: ${tw(readHint.title)} (${escapeHtml(levelLabel(readHint.lv))}, ${VC.passageLength(readHint, PACK)} words).<button class="next" id="hintRead" style="margin-top:8px">Read 1 passage</button></div>` : ""}
    <p class="q">Session ${n}, about 15 minutes.<br>${lw.length} words learned so far.</p>
    <table class="stats steps">${steps.map((s,i)=>`<tr><td>${i+1}. ${s[0]}</td><td>${escapeHtml(s[1])}</td></tr>`).join("")}</table>
    </div><div class="actions"><button class="next" id="go">Start today</button></div>`;
  if(showPlaceHint) $("hintPlace").onclick = enterPlacementFromToday;
  if(showSoundsHint) $("hintSounds").onclick = enterFirstSoundsLessonFromToday;
  if(readHint) $("hintRead").onclick = () => { switchToTab("read", "Read"); RD = null; startPassage(readHint); };
  $("go").onclick = () => { todayStepState = { step:0 }; todayStep(); };
}
function enterPlacementFromToday(){ switchToTab("test", "Test"); testSel = "placement"; startPlacement(); }
function enterFirstSoundsLessonFromToday(){
  switchToTab("sounds", "Sounds");
  soundsSel = 0;
  const backToToday = () => { switchToTab("today", "Today"); soundsSel = null; todayRender(); };
  lessonTeach(LESSON_LIST[0], () => { prog.lessons[LESSON_LIST[0].id] = 1; store.save(); backToToday(); }, backToToday);
}
// review(15, >=40% production) -> learn(next set) -> listen(12 hear) -> recall(8
// recall/type) -> sentences(8) -> finish. Each step skips itself when its pool is too small.
function todayStep(){
  const lw = learnedWords(); const nn = nextNewSet();
  const avail = availableSentences();
  const g = VC.todayGates(lw.length, !!nn, avail.length);
  const s = todayStepState.step++;
  if(s === 0){
    if(g.review){ drill(VC.buildReviewPlan(lw, prog, PACK).map(itemFromPlan), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 1){
    if(g.learn){
      const list = levelList(nn.lv).slice(nn.set*SIZE, nn.set*SIZE+SIZE);
      vocabTeach(list, nn.lv, () => {
        const items = [];
        list.forEach(w => items.push(hearItem(w), readItem(w)));
        drill(items, () => { prog.sets[nn.lv] = nn.set+1; store.save(); todayStep(); }, missSummary);
      });
      return;
    }
    return todayStep();
  }
  if(s === 2){
    if(g.listen){ drill(weakFirst(lw,12).map(hearItem), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 3){
    if(g.recall){ drill(VC.buildRecallPlan(lw, prog, PACK, 8).map(itemFromPlan), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 4){
    if(g.sentences){ drill(weakFirstSentences(avail,8).map(sentenceItemFor), todayStep, missSummary); return; }
    return todayStep();
  }
  todayFinish();
}
function todayFinish(){
  D = null; drillKeyHandler = null; setScore(0,0);
  prog.sessions = (prog.sessions||0) + 1; store.save();
  const P = $("panel");
  P.innerHTML = `<div class="done"><h2>Session done</h2><p class="q">${learnedWords().length} words learned so far.</p><button class="next" id="again">Back to Today</button></div>`;
  $("again").onclick = todayRender;
}
function wordRowHTML(w, cls){
  // Pron + gloss always share one .info column so the pron span never has to
  // shrink to width:0 next to the gloss (that caused unbreakable transliterations
  // like "budan" to overlap the gloss text when the gloss was long).
  const p = pronOf(w);
  return `<span class="wd"${TA}>${escapeHtml(w.w)}</span><span class="info">${p ? `<span class="pr">${escapeHtml(p)}</span>` : ""}<span class="en">${escapeHtml(VC.gloss(w))}</span></span>`;
}
function vocabTeach(list, lv, onDrill){
  setScore(0,0);
  const P = $("panel");
  const hint = hasSpeech ? " Tap a word to hear it." : "";
  P.innerHTML = `<p class="q">${escapeHtml(levelLabel(lv))}, new set.${hint}</p>
    <div id="tl"></div><div class="actions"><button class="next" id="dr">Drill this set</button></div>`;
  const tl = $("tl");
  list.forEach(w => {
    const row = document.createElement("div"); row.className = "rowset";
    row.innerHTML = `${wordRowHTML(w, "rowset")}${hasSpeech ? `<span style="color:var(--mute);flex:0 0 auto">${TEACH_PLAY_SVG}</span>` : ""}`;
    if(hasSpeech){ row.onclick = () => say(w.w); row.style.cursor = "pointer"; }
    tl.appendChild(row);
    const exHtml = exampleSentencesHTML(w);
    if(exHtml){
      const exWrap = document.createElement("div");
      exWrap.style.cssText = "margin:-4px 0 10px;padding-left:2px;font-size:14px";
      exWrap.innerHTML = exHtml;
      tl.appendChild(exWrap);
    }
  });
  $("dr").onclick = onDrill;
}
// Lesson card `body` is trusted pack HTML (pack authors write it); everything else is escaped.
function lessonTeach(lesson, onDone, onBack){
  setScore(0,0);
  if(!prog.soundsOpened){ prog.soundsOpened = true; store.save(); }
  const P = $("panel");
  P.innerHTML = `${onBack ? '<div class="row"><button id="back">‹ lessons</button></div>' : ""}<p class="q">${escapeHtml(lesson.blurb)}</p>
    <div id="cards"></div><div class="actions"><button class="next" id="dr">Drill</button></div>`;
  if(onBack) $("back").onclick = onBack;
  const cw = $("cards");
  (lesson.cards||[]).forEach(c => {
    const el = document.createElement("div"); el.className = "card-teach";
    el.innerHTML = `<h3>${escapeHtml(c.h)}</h3><p>${c.body}</p>
      ${c.rows ? `<div>${c.rows.map(r=>`<div class="rowset">${r.map((cell,i)=>`<span class="${["pr","wd","en"][i]||"en"}"${i===1 ? TA : ""}>${escapeHtml(cell)}</span>`).join("")}</div>`).join("")}</div>` : ""}
      ${c.say ? `<div class="taplist">${c.say.map((s,i)=>`<button data-s="${i}">▶ ${tw(s)}</button>`).join("")}</div>` : ""}`;
    if(c.say) el.querySelectorAll("[data-s]").forEach((b,i)=>b.onclick=()=>say(c.say[i]));
    cw.appendChild(el);
  });
  // Only t:"mc" lesson items exist today; anything else is skipped, not mis-rendered.
  const planned = lesson.items.map((it, i) => ({ it, i, mode: VC.lessonSayMode(it, hasSpeech) }))
    .filter(x => x.it.t === "mc" && x.mode !== "skip");
  const skipped = lesson.items.filter(it => it.t === "mc" && VC.lessonSayMode(it, hasSpeech) === "skip").length;
  // One notice on the lesson screen (not per item: the drill shuffles, so a one-shot
  // per-item notice could land anywhere in the queue).
  const hasSay = lesson.items.some(it => it.say);
  if(!hasSpeech && hasSay){
    $("cards").insertAdjacentHTML("beforebegin", `<div class="warn">This browser has no voice for this language, so listening items show the text instead of playing audio.${skipped ? ` ${skipped} item${skipped>1?"s were":" was"} skipped because the text would give the answer away.` : ""}</div>`);
  }
  $("dr").onclick = () => drill(planned.map(x => lessonItem(x.it, VC.lessonItemKey(lesson.id, x.i), x.mode)), onDone, missSummary);
}
