<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking font CSS: first paint never waits on fonts.googleapis.com (system fonts
     until it lands; display=swap then swaps the webfont in). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
  :root{
    --bg:#EEF0ED;--ink:#1B2321;--mute:#5C6B67;--line:#D6DAD7;--card:#FFFFFF;
    --ok:#2F7A5B;--ok-bg:#E4F1EB;--bad:#B4483F;--bad-bg:#FBEAE8;
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Target-language text: the UI font first, then system fonts that cover non-Latin
       scripts (IBM Plex lacks many glyphs; missing ones fall through to system fonts). */
    --wbase: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    /* pack.fontFamily, when set, is prepended at boot: --wfont = <pack font>, var(--wbase)
       (pack.rtl: its named families only, generic keywords such as serif dropped). */
    --wfont: var(--wbase);
    --safe-b: env(safe-area-inset-bottom, 0px);
    /* The fixed tab bar's real height: 56px buttons (fixed, see .tabs) + 1px top border,
       plus the safe area. Content clears it by --tabbar-gap: body padding sets the scroll
       end, html scroll-padding keeps scrollIntoView (showNext) targets above the bar. */
    --tabbar-h: calc(57px + var(--safe-b));
    --tabbar-gap: 8px;
    --t1:#3B6E99;--t2:#35784F;--t3:#8E622A;--t4:#B33F3F;--t5:#706A61;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
      --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
      --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
    --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
    --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
  html{scroll-padding-bottom:calc(var(--tabbar-h) + var(--tabbar-gap))}
  body{padding-bottom:calc(var(--tabbar-h) + var(--tabbar-gap))}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 24px;min-height:calc(100dvh - var(--tabbar-h) - var(--tabbar-gap));display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex:0 0 auto}
  h1{font-size:18px;font-weight:600;margin:0}
  .score{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hdrbar{height:3px;border-radius:2px;background:transparent;margin-bottom:12px;flex:0 0 auto;overflow:hidden}
  .hdrbar i{display:block;height:100%;width:0;background:var(--ink);transition:width 0.2s ease}
  @media (prefers-reduced-motion: reduce){ .hdrbar i{transition:none} }
  .themebtn{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--ink);flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;flex:1 1 auto;display:flex;flex-direction:column}
  #panel > .done{display:flex;flex-direction:column;flex:1 1 auto}
  .next:last-child, .primary:last-child, .done .next{margin-top:auto}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .drill-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  /* Drill items centre in the tall card; dashboards (Today) read top-down, so they don't. */
  .drill-body.top{justify-content:flex-start}
  .q{color:var(--mute);font-size:15px;margin:0 0 10px}
  .big{font-size:52px;line-height:1.3;text-align:center;margin:6px 0 16px;font-weight:500;overflow-wrap:anywhere}
  .med{font-size:22px;line-height:1.5;margin:2px 0 14px}
  .wd{font-family:var(--wfont)}
  .pron{color:var(--mute);font-size:18px;text-align:center;margin:-10px 0 14px}
  .en{color:var(--mute);font-size:15px;text-align:center;margin-top:-8px;margin-bottom:14px}
  .blank{color:var(--mute);letter-spacing:1px;unicode-bidi:isolate}
  /* Target-language text carries data-tl + lang (+ dir="rtl" for pack.rtl); block
     elements then align to their start side. English glosses never carry it. */
  [data-tl]{font-family:var(--wfont)}
  :root[data-tlh] [data-tl]{line-height:var(--tlh)}
  /* pack.rtl (docs/PACK_SCHEMA.md "RTL rendering"): target text and UI/English text never
     share a bidi context. UI lines nested in a target-language block carry dir=ltr +
     data-ui (UIA): their own isolated LTR context, in the UI font. Target-language
     fragments inside UI text (ui(), tf()) are <bdi data-tl lang dir=rtl class=tlf>: the
     pack font, with the pack line-height capped so a tall script (Nastaliq 2.6) does
     not grow the UI line it sits in. */
  [data-ui]{font-family:var(--font);unicode-bidi:isolate}
  [dir=rtl] [data-ui]{text-align:right} /* still aligned to the RTL block's start edge */
  :root[data-tlrtl] input[data-tl]::placeholder{font-family:var(--font)} /* English placeholder, UI font */
  :root[data-tlrtl] .gloss{text-align:right} /* the LTR popover line sits on the RTL block's edge */
  :root[data-tlh] [data-tl].tlf{line-height:1}
  /* Korean only: words (Hangul syllable blocks) are space-separated like Latin, so the
     default break-anywhere wrapping can split inside a word (봤어/요). Scoped off the
     lang attribute TA already sets from pack.langTag, not a global rule: languages with
     no spaces between words, e.g. zh, ja, must keep normal, break-anywhere wrapping. */
  [data-tl][lang|="ko"]{word-break:keep-all}
  /* minmax(0,1fr): the track never grows past the card for a long unbreakable word. */
  .opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .opts button{width:100%;min-width:0;overflow-wrap:anywhere;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:17px;color:var(--ink);line-height:1.35;min-height:48px;font-family:var(--font)}
  .opts button b.num{color:var(--mute);font-weight:500;margin-inline-end:8px;font-size:14px}
  /* inline-block: the pron stays beside a short word and drops whole onto its own line
     under a long one (профессиональный + its pron at 360px) instead of overflowing. */
  .opts button .op{display:inline-block;max-width:100%;color:var(--mute);font-size:14px;font-weight:400;margin-inline-start:8px}
  .opts button[dir=rtl]{text-align:right}
  /* .num and .op carry UIA (dir=ltr data-ui, docs/PACK_SCHEMA.md "RTL rendering"), so
     their own margin-inline-* resolves against their OWN ltr direction, not the RTL
     button's. In an RTL button the number sits first (rightmost) with the word to its
     left, and the pron span sits after the word (further left, word to ITS right): both
     gaps are on each element's physical-left/right, the opposite of the ltr case, so the
     inline-end/inline-start pair flips here rather than moving to a flex gap (the button
     is a plain wrapping text run, not a flex row, and .opts uses grid for the button
     list itself — restructuring it to flex would change dist bytes for every pack). */
  .opts button[dir=rtl] b.num{margin-inline-end:0;margin-inline-start:8px}
  .opts button[dir=rtl] .op{margin-inline-start:0;margin-inline-end:8px}
  .opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .opts-hero button{font-size:18px;padding:18px 18px;min-height:58px;font-weight:500}
  .opts-w button{font-family:var(--wfont)}
  .opts-w button b.num{font-family:var(--font)}
  .hear-stage{display:flex;justify-content:center;margin:14px 0 22px}
  .speaker{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:36px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @keyframes speakerPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .speaker.speaking{animation:speakerPulse 0.9s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .speaker.speaking{animation:none} }
  .reveal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:none;font-size:15px}
  .reveal .rw{font-size:22px;margin-bottom:2px;font-family:var(--wfont)}
  .reveal .rp{color:var(--mute);margin-bottom:2px}
  /* pack.rtl: an answer block (the reveal, and the same block in the Missed list) aligns
     to one edge, the right: target lines are dir=rtl (start = right) and the Latin pron,
     gloss and labels keep their LTR direction but share the right edge. */
  :root[data-tlrtl] .reveal,:root[data-tlrtl] .rvb{text-align:right}
  .next,.primary{margin-top:14px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;min-height:48px;font-family:var(--font)}
  .ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;min-height:44px;font-family:var(--font)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .row button, .chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;color:var(--ink);min-height:44px;font-family:var(--font)}
  .row button.on, .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .replay{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:17px;color:var(--ink);flex:0 0 auto}
  .ktag{text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
  .ktag b{font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .listen-stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0}
  input[type=text]{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;font-size:19px;background:var(--card);color:var(--ink);font-family:var(--wfont)}
  input[type=text]:focus{outline:3px solid #7AA7D9;outline-offset:1px}
  .diff{font-size:15px;margin-top:6px}
  .wl{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;gap:12px}
  .wl .wd{font-size:22px;flex:0 1 auto;min-width:64px;max-width:48%;overflow-wrap:anywhere}
  .wl .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .wl .pr{font-size:15px;display:block}
  .wl .en{color:var(--mute);font-size:14px;text-align:left;display:block;margin:0}
  table.stats{width:100%;border-collapse:collapse;font-size:15px}
  table.stats td{padding:8px 0;border-bottom:1px solid var(--line)}
  table.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  /* Today step names never wrap ("5. Sentences" at 390px); the description column wraps. */
  table.steps td:first-child{white-space:nowrap;padding-right:12px;vertical-align:top}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--ink)}
  /* Stage path: one line per label, bars on one top line. A segment is as wide as its label
     plus an equal share of the rest (flex 1 1 auto), so a long script-stage label stays whole
     beside A1; labels only ellipsize when the whole strip cannot fit. flex-start: a taller
     label line (a target-script font) never moves its bar. */
  .path{display:flex;gap:6px;align-items:flex-start;margin-bottom:14px}
  .path .seg{flex:1 1 auto;min-width:0;text-align:center;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stmt{font-size:15px;line-height:1.5;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .warn{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .done h2{font-size:22px;margin:0 0 10px;font-weight:600}
  .done ul{padding-left:20px;font-size:15px;margin:8px 0}
  .card-teach{margin-bottom:14px}
  .card-teach h3{font-size:17px;margin:0 0 8px;font-weight:600}
  .card-teach p{font-size:15px;color:var(--mute);margin:0 0 10px}
  .rowset{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
  .rowset .wd{font-size:18px;flex:0 1 auto;min-width:52px;max-width:45%;overflow-wrap:anywhere}
  .rowset .pr{flex:1;min-width:0;color:var(--mute);font-size:15px;overflow-wrap:anywhere}
  .rowset .en{color:var(--mute);font-size:14px;text-align:right;flex:0 1 auto;min-width:0;margin:0;overflow-wrap:anywhere}
  .rowset .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .rowset .info .pr{flex:0 0 auto;display:block;overflow-wrap:anywhere}
  .rowset .info .en{text-align:left;display:block}
  /* Characters stage (pack.characters): Learn teach cards, and sentence ruby by tier.
     A sentence carrying ruby gets a fixed tall line box, so lines with and without a
     ruby token are the same height (no jump as tokens change tier) and wrapped lines
     never collide with the reading above them. */
  .charteach{padding:10px 0;border-bottom:1px solid var(--line)}
  .charteach .chead{display:flex;align-items:center;gap:14px}
  .charteach .cform{font-size:40px;line-height:1.2;flex:0 1 auto;min-width:56px;max-width:55%;text-align:center;overflow-wrap:anywhere}
  .charteach .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .charteach .pr{font-size:16px}
  .charteach .en{color:var(--mute);font-size:14px;text-align:left;margin:0}
  .charteach .sent{border-bottom:none;padding:4px 0 0;font-size:14px}
  /* script primer (pack.script): glyph stimuli 64px, glyph options 2x2, teach card rows,
     joined-forms strip (right to left), the Script tab chart. */
  .big.xg{font-size:64px;line-height:1.2}
  .opts-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts-g button{text-align:center;font-size:28px;line-height:1.3}
  .xteach{padding:10px 0;border-bottom:1px solid var(--line)}
  .xhead{display:flex;align-items:center;gap:14px}
  .xhead .cform{font-size:64px;line-height:1.15;flex:0 1 auto;min-width:64px;max-width:50%;text-align:center;overflow-wrap:anywhere}
  .xhead .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .xhead .en{color:var(--mute);font-size:14px;text-align:left;margin:0;overflow-wrap:anywhere}
  .xnm{font-size:15px}
  .xrm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
  .xrow2 .xrm{font-size:15px;color:var(--mute);font-weight:400}
  .xrow2{font-size:24px;line-height:1.5;margin:8px 0 2px;overflow-wrap:anywhere}
  .xit{font-style:italic;font-size:30px;margin-inline-start:8px}
  .xforms{display:flex;gap:6px;margin:8px 0 2px}
  .xfc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 2px}
  .xff{font-size:32px;line-height:1.5}
  .xfl{font-size:11px;color:var(--mute)}
  /* Spread shadow widens the tint past a thin joined letter (fa medial ا, ی) without
     padding: padding/border on an inline breaks Arabic-script shaping across it. */
  .xhl{background:var(--ok-bg);border-radius:3px;box-shadow:0 0 0 2px var(--ok-bg)}
  /* ::highlight() takes no box-shadow/border-radius, so the span's spread (which keeps a
     thin joined letter, medial ا or initial ل, visible) is replaced by tinting the glyph
     itself: the letter turns --ok on the --ok-bg ground, visible at any width. */
  ::highlight(xhl){background-color:var(--ok-bg);color:var(--ok)}
  .xrword{margin-top:8px}
  .xset{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
  .xsn{color:var(--mute);font-size:12px;min-width:14px;padding-top:12px;text-align:right}
  .xcells{flex:1;min-width:0}
  .xcells button{display:flex;flex-direction:column;align-items:center;min-width:48px;min-height:48px;padding:4px 8px}
  .xcg{font-size:20px;line-height:1.2}
  .xcr{font-size:11px;color:var(--mute)}
  .xcells button.xt,.xkey.xt{border-color:var(--ink)}
  .xcells button.xm,.xkey.xm{border-color:var(--ok);background:var(--ok-bg)}
  .xkey{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  #xcard .xteach{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--card);scroll-margin-top:12px}
  .hasruby{line-height:2.3}
  /* pack.pronFirst: the "show written form" tap beside a word shown by its reading. */
  .showw{display:inline-block;width:auto;min-height:0;margin:0 0 0 6px;padding:2px 6px;border:0;background:none;color:var(--mute);font:400 12px/1.2 var(--font);text-decoration:underline;vertical-align:middle;cursor:pointer}
  .wwr{color:var(--mute);font-size:.8em;margin-inline-start:3px}
  .showw,.wwr{white-space:nowrap}
  /* A row word shown by its reading (class pf) keeps reading and tap on one line: the
     word column may take up to 75% (a reading has no break points), the gloss column
     shrinks and wraps instead. Readings stay short (zh max 13 letters, 公共汽车). */
  .wl .wd.pf,.rowset .wd.pf{white-space:nowrap;max-width:75%}
  .psent .ptxt.hasruby{line-height:2.3}
  .hasruby ruby{ruby-position:over}
  .hasruby rt{font-family:var(--font);font-size:0.5em;line-height:1;color:var(--mute);font-weight:400}
  .hasruby ruby.bare rt{visibility:hidden}
  .sent{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .sent .st{font-family:var(--wfont);font-size:17px}
  .sent .sp{color:var(--mute);font-size:14px}
  .sent .se{color:var(--mute);font-size:14px}
  .taplist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .taplist button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:15px;min-height:48px;font-family:var(--wfont)}
  .plist button{display:flex;justify-content:space-between;width:100%;text-align:start;padding:13px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:16px;color:var(--ink);min-height:48px;align-items:center}
  .plist .tick{color:var(--ok);font-size:14px}
  /* Read tab: passage sentences with tappable linked words. */
  .rlv{margin-bottom:14px}
  .rlh{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:16px;margin-bottom:4px}
  .ptitle{font-size:21px;margin:0 0 4px;font-weight:600}
  .passage{margin:4px 0 8px}
  .passage[hidden],.gloss[hidden],[hidden].q{display:none}
  .psent{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 8px;padding:8px 6px;border-radius:10px}
  .psent.hi{background:var(--ok-bg)}
  .psent .ptxt{flex:1 1 0;min-width:0;font-size:19px;line-height:1.7;overflow-wrap:anywhere}
  .psent .psay{width:36px;height:36px;font-size:14px}
  .pchips{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:6px}
  .pw{border-bottom:1px dotted var(--mute);cursor:pointer}
  .pw.on{background:var(--ok-bg);border-bottom-color:var(--ok)}
  .pchip{font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:8px;border-bottom-style:solid}
  .gloss{position:sticky;top:0;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:15px;text-align:start}
  .gloss .gw{font-size:19px;font-weight:500}
  .gloss .gp,.gloss .ge,.wk .gp,.wk .ge{color:var(--mute)}
  /* Pronunciation aids (docs/PACK_SCHEMA.md): syllable colours (pack.tones), word taps in
     sentences (.tk, popover .tokgloss, sentence speaker .ssay), the Sounds Reference card. */
  .t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t5{color:var(--t5)}
  .sent.tks{cursor:auto}
  .tk{border-bottom:1px dotted var(--line);cursor:pointer}
  .tk.on{background:var(--ok-bg);border-bottom-color:var(--ok)}
  .gloss.tokgloss{position:static;margin:6px 0 2px;font-family:var(--font)}
  .ssay{width:32px;height:32px;margin:0 0 0 6px;vertical-align:middle;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .refcard{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
  .refcard summary{cursor:pointer;font-weight:500}
  .refh{color:var(--mute);font-size:13px;margin:10px 0 4px}
  .refcells{display:flex;flex-wrap:wrap;gap:6px}

     engine/app.html?pack=zh  (loads ../packs/zh/)  or  ?packdir=../../pack -->
<script>
(function(){

<script src="core.js"></script>
<script>
"use strict";
const VC = window.VocabCore;
const $ = id => document.getElementById(id);

const HAS_LESSONS = !!PACK.hasLessons && LESSON_LIST.length > 0;

// {units, notes} (docs/SCRIPT_PRIMER.md). Every primer surface (path stages, choice card,

// notice) is gated on HAS_SCRIPT; without it each code path is the pre-primer one, and SU

const SCRIPT_DATA = (typeof SCRIPT !== "undefined" && SCRIPT && typeof SCRIPT === "object" && Array.isArray(SCRIPT.units)) ? SCRIPT : null;

// asks for a symbol it does not teach. A Latin `pron` (fa) never replaces the word.
const SCRIPT_BYID = (() => {
  if(!HAS_SCRIPT) return WORDS_BY_ID;
  const fold = s => String(s || "").normalize("NFKD").toLowerCase();
  const inv = new Set();
  SUNITS.forEach(u => { [String(u.t || ""), ...(Array.isArray(u.syll) ? u.syll.map(s => String((s && s.t) || "")) : [])].forEach(t => [...fold(t)].forEach(ch => { if(/\p{L}/u.test(ch)) inv.add(ch); })); });

// so it never reorders the English/number text around it.
const DISP = VC.scriptDisplay(PACK);
const TA = ` data-tl lang="${escapeHtml(DISP.lang)}"${DISP.rtl ? ' dir="rtl"' : ""}`;

// LTR packs (same markup as before).

// sentence translations, notes, lesson text, meta lines): escaped, each RTL-script run
// wrapped in <bdi TA class="tlf"> so it neither reorders the English around it nor falls
// to a system font; class tlf caps its line-height inside the UI line.
// tf: a pack label placed inside a UI line (stage label, a symbol's name): for RTL packs
// ui() (a Latin name such as "choṭī he" stays UI text, never dir=rtl / pack font), else

// localStorage. Backups go through the same backend as the progress they protect.
// A read error is not "nothing stored": boot goes read-only (no saves) so real
// progress that merely failed to load is never overwritten. A write error never
// falls through to the other backend (that would split progress across two stores);
// it is surfaced instead.
let storeReadOnly = false;
function storageWarn(msg){ const el = $("storeWarn"); if(!el) return; el.textContent = msg; el.hidden = false; }

  async getRaw(key){

      if(window.storage){ const r = await window.storage.get(key); return { ok:true, value: r ? r.value : null }; }
      return { ok:true, value: localStorage.getItem(key) };
    }catch(e){ return { ok:false, value:null }; }
  },
  async setRaw(key, value){
    if(storeReadOnly) return false;
    try{
      if(window.storage) await window.storage.set(key, value);
      else localStorage.setItem(key, value);
      return true;
    }catch(e){
      storageWarn("Progress could not be saved in this browser (storage error). Export your progress from the Progress tab to keep it.");
      return false;
    }

  load(){ return this.getRaw(STORE_KEY); },
  save(){ return this.setRaw(STORE_KEY, JSON.stringify(prog)); },

function markSentence(id, ok){ VC.markRec(prog.s, id, ok, false); store.save(); }
function markChar(unitId, ok){ VC.markChar(prog, unitId, ok); store.save(); } // prog.chars.c only

const weakFirstSentences = (list, n) => VC.weakFirst(list, n, prog.s);

const nSets = lv => VC.nSets(levelList(lv), SIZE);

const nextNewSet = () => VC.nextNewSet(WORDS, PACK, prog);
const availableSentences = () => VC.availableSentences(SENTENCES, WORDS, PACK, prog);
const wordExampleSentences = (entry, n) => VC.exampleSentences(entry, SENTENCES, PACK, n);

// ===================== app state =====================

// that code can run synchronously during init, before the rest of this script

// beforehand or reading it throws (temporal dead zone). New top-level state
// that render() or a tab-render function reads belongs here, not inline.
let D = null;                  // active drill session (generic drill runner)
let drillKeyHandler = null;    // keydown handler while a drill is active
let tab = "today";             // current tab
let todayStepState = null;     // Today tab step UI state
let todayPrep = null;          // pack.characters: the snapshot + Review plan Today last showed, run by Start today
let soundsSel = null;          // Sounds tab selection
let wordsLv = LEVELS[0], wordsSet = null, wordsQuery = ""; // Words tab state

let testSel = null, PL = null; // Test tab state
let legacyNotice = null;       // one-time notice after the boot migration (HTML), until dismissed
let legacyFail = null;         // boot found an old-app record it could not import: why (text); session read-only until "Start without it"

// script. The voice probe below can fire synchronously before boot has run at all —
// before store.load() has even been called, so prog is still the just-in-case default
// from VC.defaultProg(), not what's actually saved. Rendering Today then (e.g. via

// before boot's own store.load() ever reads the real one back, clobbering it. booted
// gates the probe's re-render to after boot has rendered once, on top of the state
// hoisting above (defence in depth, not a substitute for it).
let booted = false;

const samsungNoticeHTML = VC.isSamsungBrowser(navigator.userAgent)

// tap that somehow fires twice restarts one sound instead of stacking players.
const audioOut = VC.audioSlot(() => new Audio());

// that fails to load (offline and not cached by sw.js, or a 404) falls back to TTS of the

// a cross-origin clip (Tatoeba) is never cached, so it only ever needs a connection.
function clipFailed(text, btn, url){

// the first one built isn't necessarily the first one the learner sees. noticeFor()
// is called from the render path instead, once the drill actually shows an item, so
// the one-time notice lands on whichever needsNotice item is shown first.

// ===================== speaker icon =====================
function speakerSVG(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

// type items may add: placeholder (input hint), inputTA (input attributes instead of TA),

function drill(items, onDone, summary, onShown){ D = { q: shuffle(items.slice()), right:0, seen:0, miss:[], onDone, summary, onShown }; dnext(); }
function setScore(answered, total){

  const fill = $("hdrbarfill");
  if(!fill) return;
  if(!total){ fill.style.display = "none"; fill.style.width = "0%"; return; }

function announce(html){

  el.textContent = tmp.textContent || "";
}
// Show the Next button after an answer and scroll it into view when a long reveal pushed
// it under the fixed tab bar (html scroll-padding-bottom = bar height + gap; "nearest"
// leaves the page still when it is already clear). Every drill/Read reveal goes through here.
function showNext(){

// Content that opens away from where the learner tapped (a teach card above the chart, a

  const r = el.getBoundingClientRect(), bar = tb.getBoundingClientRect();
  const limit = Math.min(innerHeight, bar.height ? bar.top : innerHeight);
  if((r.top < 0 || r.bottom > limit) && typeof el.scrollIntoView === "function")

function dnext(){

    D = null; drillKeyHandler = null;

function renderMcItem(it){

function renderTypeItem(it){

// A key on a show-written button (pack.pronFirst) is the button's own (Enter/Space reveal
// the written form); it never reaches the drill's shortcuts (Enter = Next, 1-4 = answer).
const onShowWritten = e => !!(e && e.target && e.target.closest && e.target.closest("[data-showw]"));
// Enter/Space on a focused word tap are the tap's own. Escape is the tap's own only when it
// closed an open popover or cleared a highlight (the panel listener below marks that event,
// tokEscEaten); otherwise it reaches the drill as usual (quit).
let tokEscEaten = null;
const tokOwns = e => onTok(e) && (e.key !== "Escape" || e === tokEscEaten);
// Escape closes whatever gloss is open (the Read-tab #gloss box, any word-tap popover) and
// clears the tapped highlight, staying on the same view; only an Escape with nothing
// open reaches the drill (quit). A focused tap's own Escape is handled (and marked) by

function dismissGlosses(){
  const P = $("panel"); if(!P) return false;

document.addEventListener("keydown", e => {

// ---- word taps inside sentences (any pack whose sentences carry ruby, or pronFirst

// data-ts/data-tr = a phrase span's surface and reading, tokHead). A tap shows the word's
// popover (glossHTML, the Read-tab one) inside the nearest data-tokbox and speaks the word
// only; the whole sentence is heard from its speaker button (sentSayHTML). No progress
// effect. Never used inside answer buttons.
// A multi-token pack word (PACK_SCHEMA.md sentences[].spans/passages[].spans: "a word may
// have several spans, one per occurrence" — the builder emits one span per surface token
// of a multi-word entry, के लिए as two adjacent spans sharing one wordId) renders one .tk

// from the tapped token's own head/surface.

  const h = head ? ` data-ts="${escapeHtml(head.surface)}" data-tr="${escapeHtml(head.reading)}"` : "";

}
// A phrase token's popover head: a token whose surface contains its word's written form
// and more (这个 for 这, 他们 for 他, 越来越 for 越) heads the popover with that surface and its
// reading, and a tap speaks the surface; any other token (the word itself, or a token
// covering only part of the word, as ja ruby over the written stem) keeps the word's own
// headword (null). Used by sentence tokens and passage spans (spanHead).
function phraseHead(surface, w, reading){
  const ww = String((w && w.w) || ""), t = String(surface || "");

}
const sentSayHTML = s => canHearSentence(s) ? `<button type="button" class="replay ssay" data-sent="${SENT_INDEX.get(s)}" aria-label="Hear the sentence">${TEACH_PLAY_SVG}</button>` : "";

function tokTap(t){
  const w = WORDS_BY_ID[t.dataset.tok]; if(!w) return;

  const html = glossHTML(w.id, "", head);
  const box = t.closest("[data-tokbox]");
  if(box){
    box.querySelectorAll(".tk.on").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    box.querySelectorAll(".tk").forEach(x => { if(x !== t && x.dataset && x.dataset.tok === t.dataset.tok) x.classList.add("on"); });
    let g = box.querySelector(".tokgloss");
    if(!g){ g = document.createElement("div"); g.className = "gloss tokgloss"; if(DISP.rtl) g.setAttribute("dir", "ltr"); box.appendChild(g); } // an LTR box, as glossBox
    g.innerHTML = html; g.hidden = false;
    bringIntoView(g); // appended below the sentence: a tap on its last line can open it under the tab bar
  }
  announce(html);

  if(head && head.surface !== w.w) say(head.surface); else sayWord(w);
}
// Hides the popover of the tap's data-tokbox and clears its highlight; true when there was

function tokDismiss(t){
  const box = t.closest("[data-tokbox]"); if(!box) return false;

const onTok = e => !!(e && e.target && e.target.closest && e.target.closest("[data-tok]"));

// Tap-to-hear for markup anywhere in #panel: data-sent (a SENTENCES index) speaks that
// sentence, data-wid (a word id) speaks that word, data-tok (tokTap) shows a word's popover,
// data-xs/data-xw (pack.script) a script unit's sound / a primer example word. INVARIANT: this is the only listener
// for these attributes and it is attached exactly once, here, at load. #panel is
// persistent (screens replace its innerHTML), so attaching per render/reveal/drill-end
// would accumulate one more listener each time (N taps -> N sounds). Render code just
// emits the attributes and never wires them.
$("panel").addEventListener("click", e => {
  const t = e.target.closest(HAS_SCRIPT ? "[data-tok],[data-sent],[data-wid],[data-xs],[data-xw]" : "[data-tok],[data-sent],[data-wid]");

  if(t.dataset.xw !== undefined){ const w = SCRIPT_BYID[t.dataset.xw]; if(w && (wordAudio(w) || scriptVoice())) sayWord(w); return; }
  if(t.dataset.wid !== undefined){ const w = WORDS_BY_ID[t.dataset.wid]; if(w) sayWord(w); return; }

});
// Keyboard for word taps (role=button): Enter/Space. Attached once, here, like the above.
$("panel").addEventListener("keydown", e => {

  else if(t && e.key === "Escape" && tokDismiss(t)){ tokEscEaten = e; e.preventDefault(); } // consumed: the drill never sees it
});

// pack.pronFirst "show written form" tap: capture phase, so it runs before (and stops) the
// row/tap-to-hear handlers of whatever it sits in. Only attached for pronFirst packs.
// The revealed span takes the button's place and, when the button had focus (keyboard),
// the focus too (tabindex -1: focusable, not a tab stop), so focus never drops to body.
function revealWritten(b){
  const sp = document.createElement("span");
  sp.className = "wwr"; sp.setAttribute("data-tl", ""); sp.setAttribute("lang", DISP.lang); if(DISP.rtl) sp.setAttribute("dir", "rtl");
  sp.setAttribute("tabindex", "-1"); sp.textContent = b.dataset.showw || "";

if(PRON_FIRST) $("panel").addEventListener("click", e => {

  if(!b) return;

}, true);

// ===================== word drill items =====================
// Sentence text with the taught word bolded where it is visible (VC.highlightParts).
function highlightHTML(s, entry){
  return VC.highlightParts(s, entry, WORDS_BY_ID, PACK).map(x => x.hit ? `<b>${escapeHtml(x.text)}</b>` : escapeHtml(x.text)).join("");
}
// Sentence ruby by tier (pack.characters, sentence.ruby): VC.rubyTiers' tokens, or null
// when the sentence renders exactly as without characters (no characters stage, no
// ruby on it, characters not started, mix off, or pron hidden: showPron off hides all
// ruby). Non-null replaces the sentence's pron line.
function sentenceRuby(s){
  if(!HAS_CHARACTERS || !s || !Array.isArray(s.ruby) || (!showPron() && !PRON_FIRST)) return null;
  return VC.rubyTiers(s, CHAR_LIST, prog, PACK, VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU));
}
// One ruby token (base: escaped written form). Below the bare tier <ruby>t<rt>reading</rt></ruby>;
// at or above it the same markup with class "bare", whose <rt> is visibility:hidden (CSS
// .hasruby ruby.bare rt), so a token's width never changes across tiers and a line
// wraps the same whether its tokens show their reading or not.
const rubyTokHTML = (base, k) => k.tier === "bare"
  ? `<ruby class="bare">${base}<rt>${readingHTML(k.reading)}</rt></ruby>`
  : `<ruby>${base}<rt>${readingHTML(k.reading)}</rt></ruby>`;
// Sentence text with ruby tokens (rubyTokHTML): below the bare tier with its reading shown,
// at or above it hidden. entry (optional): the taught word, bolded as in
// highlightHTML (a ruby token overlapping it is bolded whole). Offsets are UTF-16, as
// JS string indices; a malformed token (overlapping, out of range) renders as plain text.
// taps (optional): each token with a known word becomes a word tap (tokTapHTML).
function rubyTextHTML(s, toks, entry, taps){
  const t = String(s.t || ""); const hits = [];
  if(entry){ let o = 0; VC.highlightParts(s, entry, WORDS_BY_ID, PACK).forEach(x => { if(x.hit) hits.push([o, o + x.text.length]); o += x.text.length; }); }
  const inHit = (a, b) => hits.some(([h0, h1]) => a < h1 && b > h0);
  const plain = (a, b) => {
    const cuts = new Set([a, b]);
    hits.forEach(([h0, h1]) => { if(h0 > a && h0 < b) cuts.add(h0); if(h1 > a && h1 < b) cuts.add(h1); });
    const cs = [...cuts].sort((x, y) => x - y); let out = "";
    for(let k = 0; k < cs.length - 1; k++){ const seg = escapeHtml(t.slice(cs[k], cs[k+1])); out += inHit(cs[k], cs[k+1]) ? `<b>${seg}</b>` : seg; }
    return out;
  };
  let out = "", pos = 0;
  toks.forEach(k => {
    if(!(k.start >= pos && k.end > k.start && k.end <= t.length)) return;
    out += plain(pos, k.start);
    const base = escapeHtml(t.slice(k.start, k.end));
    const tw0 = taps ? WORDS_BY_ID[k.wordId] : null;
    const h = tw0 ? tokTapHTML(k.wordId, rubyTokHTML(base, k), phraseHead(t.slice(k.start, k.end), tw0, k.reading)) : rubyTokHTML(base, k);
    out += inHit(k.start, k.end) ? `<b>${h}</b>` : h;
    pos = k.end;
  });
  return out + plain(pos, t.length);
}
// pack.pronFirst sentence markup (core.js sentenceDisplay): null when off or when the
// sentence has no written characters (render as without pronFirst); false when blank is
// given and cannot be shown (the sentence falls back to its reading line: no gap item);
// else {html, ruby, written}: tokens below mastered as their reading, others by tier
// (ruby/bare, bare when pron is hidden), the taught word (entry) bolded, blank as ____;
// written = the written sentence for the show-written tap (false: nothing hidden).
// written (optional word ids): their tokens show written with ruby (VC.sentenceDisplay).
// taps (optional): each token with a known word becomes a word tap (tokTapHTML); the
// result's `taps` says whether any was made.
function pfSentence(s, entry, blank, written, taps){
  if(!PRON_FIRST) return null;
  const d = VC.sentenceDisplay(s, CHAR_LIST, prog, PACK, VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU), blank, written);
  if(d === null) return blank ? false : null;
  if(d.mode === "text") return null;
  if(d.mode === "pron") return { html: readingHTML(d.text), ruby: false, written: String(s.t || ""), taps: false };
  const hits = [];
  if(entry){ let o = 0; VC.highlightParts(s, entry, WORDS_BY_ID, PACK).forEach(x => { if(x.hit) hits.push([o, o + x.text.length]); o += x.text.length; }); }
  const inHit = (a, b) => hits.some(([h0, h1]) => a < h1 && b > h0);
  let ruby = false, anyPron = false, bl = null, tapped = false;
  const html = d.pieces.map(p => {
    let h;
    if(p.kind === "blank"){ bl = p; h = `<span class="blank">____</span>`; }
    else if(p.kind === "text") h = escapeHtml(p.text);
    else if(p.tier === "pron"){ anyPron = true; h = readingHTML(p.text); }
    else { ruby = true; h = rubyTokHTML(escapeHtml(p.text), showPron() ? p : Object.assign({}, p, { tier:"bare" })); }
    if(taps && p.kind === "tok" && WORDS_BY_ID[p.wordId]){ tapped = true; h = tokTapHTML(p.wordId, h, phraseHead(String(s.t || "").slice(p.start, p.end), WORDS_BY_ID[p.wordId], p.reading)); }
    if(p.kind !== "blank" && inHit(p.start, p.end)) h = `<b>${h}</b>`;
    return escapeHtml(p.pre) + h;
  }).join("");
  const t = String(s.t || "");
  return { html, ruby, written: anyPron ? (bl ? t.slice(0, bl.start) + "____" + t.slice(bl.end) : t) : false, taps: tapped };
}
const pfWrittenTap = pf => pf.written ? showWrittenBtn(pf.written) : "";
// entry (optional): the taught word, highlighted in the sentence. written (optional
// word ids, pronFirst only): tokens shown written with ruby (a unit's teach card).
// A sentence whose tokens are word taps (tokTapHTML) is itself not a tap target: it is
// heard from its own speaker button (sentSayHTML) and is a data-tokbox for the popover.
function sentenceRowHTML(s, entry, written){
  const pf = pfSentence(s, entry, null, written, true);
  if(pf && pf.taps) return `<div class="sent tks" data-tokbox><div class="st${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}${sentSayHTML(s)}${pfWrittenTap(pf)}</div><div class="se">${ui(s.en)}</div></div>`;
  if(pf) return `<div class="sent" data-sent="${SENT_INDEX.get(s)}"><div class="st${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}${pfWrittenTap(pf)}</div><div class="se">${ui(s.en)}</div></div>`;
  const rt = sentenceRuby(s);
  if(rt && rt.some(k => WORDS_BY_ID[k.wordId])) return `<div class="sent tks" data-tokbox><div class="st hasruby"${TA}>${rubyTextHTML(s, rt, entry, true)}${sentSayHTML(s)}</div><div class="se">${ui(s.en)}</div></div>`;
  if(rt) return `<div class="sent" data-sent="${SENT_INDEX.get(s)}"><div class="st hasruby"${TA}>${rubyTextHTML(s, rt, entry)}</div><div class="se">${ui(s.en)}</div></div>`;
  const p = pronOf(s);
  return `<div class="sent" data-sent="${SENT_INDEX.get(s)}"><div class="st"${TA}>${entry ? highlightHTML(s, entry) : escapeHtml(s.t)}</div>${p ? `<div class="sp">${readingHTML(p)}</div>` : ""}<div class="se">${ui(s.en)}</div></div>`;
}
function exampleSentencesHTML(entry){
  const ex = wordExampleSentences(entry, 2);
  if(!ex.length) return "";
  return `<p class="q" style="margin-top:12px">Example${ex.length>1?"s":""}:</p>${ex.map(s => sentenceRowHTML(s, entry)).join("")}`;
}
function revealBlock(entry){
  const p = pronBeside(entry), hear = canHearWord(entry);
  const icon = hear ? ` <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span>` : "";
  return `<div${hear ? ` data-wid="${escapeHtml(entry.id)}" style="cursor:pointer"` : ""}><div class="rw"${TA}>${wordFormHTML(entry)}${icon}</div>${p ? `<div class="rp">${readingHTML(p)}</div>` : ""}<div style="color:var(--mute)">${ui(VC.gloss(entry))}</div></div>${exampleSentencesHTML(entry)}`;
}
const meaningChoices = entry => [VC.gloss(entry), ...VC.meaningOpts(entry, WORDS).map(d=>VC.gloss(d))];
// hear — the word's clip or TTS plays it; pick the meaning. Unhearable, it degrades to read.
function hearItem(entry){
  if(!canHearWord(entry)) return Object.assign(readItem(entry), { needsNotice: true });
  return { kind:"mc", key:"w:"+entry.id, label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`,
    opts: meaningChoices(entry), a: VC.gloss(entry), reveal: `<div class="q">You heard:</div>${revealBlock(entry)}`,
    onAnswer: ok=>markWord(entry.id, ok),
    mount: () => { const btn = $("sp"); sayWord(entry, btn); btn.onclick = ()=>sayWord(entry, btn); },
    };
}
// read — word shown; pick the meaning. Audio auto-plays.
function readItem(entry){
  return { kind:"mc", key:"w:"+entry.id, label:"What does it mean?", optsClass:"opts-hero",
    html: bigWordHTML(entry), opts: meaningChoices(entry), a: VC.gloss(entry), reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), mount: () => sayWord(entry), };
}
// recall — meaning shown; pick the word (wordOpts: same pos/level first, never a
// distractor that would also be a right answer).
function recallItem(entry){
  const ds = VC.wordOpts(entry, WORDS, PRON_FIRST ? (e => dispWord(e).text) : null, PACK); // same word class as the answer; pronFirst: distinct displayed labels, no homophones
  // Options are keyed by word id (the label is optHtml's): two options can never collapse
  // into one key, whatever they display as.
  const byId = {}; [entry, ...ds].forEach(e=>{ byId[e.id] = e; });
  return { kind:"mc", key:"w:"+entry.id, label:"Which word is this?", optsClass:"opts-hero opts-w",
    html: `<div class="med" style="text-align:center">${ui(VC.gloss(entry))}</div>`,
    opts: [entry.id, ...ds.map(d=>d.id)], a: entry.id, optHtml: wordOptHtml(byId, o => byId[o].w), optsT: true, reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), onReveal: () => sayWord(entry) };
}
// type — meaning shown; type the word (normalised per pack.typing, alt forms accepted).
function typeItem(entry){
  return { kind:"type", key:"w:"+entry.id, label:"Type the word",
    html: `<div class="med" style="text-align:center">${ui(VC.gloss(entry))}</div>`,
    check: val => VC.acceptTyped(val, entry, PACK), reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), onReveal: () => sayWord(entry) };
}
// pack.typing "pron": the word's production slot (kindMix "type", the slot recall also
// fills) is one of two typed items, alternating in plan order (VC.typeSlotKind), each
// tagged on the card so the learner never confuses them:
//  - pronTypeItem ("Type the <pack.tones>", else "Type the reading"): meaning shown, silent (no replay, no autoplay:
//    audio would give the reading away). Tones optional: VC.checkPronTyped's "ok",
//    "tones" (none typed) and "tonesDiff" (other tones) all count as right; the last two
//    get a note with the tone-coloured marked form. Latin keyboard (lang="en").
//  - writtenTypeItem ("Type the characters"): meaning shown and the word's audio played
//    once (replay button, as hear items); type the written form (VC.acceptTyped, alt forms
//    accepted). Target-language input attributes (TA) so the keyboard switches.
// A word with no pron always gets the characters item; no written form either: recall.
const PRON_NOUN = TONES ? PACK.tones : "reading"; // the reading system's name (pack.tones), else "reading"
const kindTag = (tag, sub) => `<div class="ktag"${UIA}><b>${escapeHtml(tag)}</b>${sub ? ` · ${escapeHtml(sub)}` : ""}</div>`;
function pronTypeItem(entry){
  return { kind:"type", key:"w:"+entry.id, label:`Type the ${PRON_NOUN}`,
    html: `${kindTag(PRON_NOUN, TONES ? "tones optional" : "")}<div class="med" style="text-align:center">${ui(VC.gloss(entry))}</div>`,
    placeholder: TONES ? `${PRON_NOUN}, tones optional…` : `${PRON_NOUN}…`, inputTA: ' lang="en"',
    check: val => VC.checkPronTyped(val, entry.pron) !== "wrong",
    feedback: val => { const v = VC.checkPronTyped(val, entry.pron); return v === "tones" || v === "tonesDiff" ? `<div class="diff">tones: <span class="tpron">${readingHTML(entry.pron)}</span></div>` : ""; },
    reveal: revealBlock(entry), onAnswer: ok=>markWord(entry.id, ok), onReveal: () => sayWord(entry) };
}
function writtenTypeItem(entry){
  const hear = canHearWord(entry);
  return { kind:"type", key:"w:"+entry.id, label:"Type the characters",
    html: `${kindTag("characters", hear ? "listen" : "")}<div class="med" style="text-align:center">${ui(VC.gloss(entry))}</div>${hear ? `<div class="listen-stage"><button class="replay" id="rp2" aria-label="Replay">${REPLAY_SVG}</button></div>` : ""}`,
    placeholder: "characters…",
    mount: () => { if(hear){ const b = $("rp2"); sayWord(entry, b); b.onclick = () => sayWord(entry, b); } },
    check: val => VC.acceptTyped(val, entry, PACK), reveal: revealBlock(entry),
    onAnswer: ok=>markWord(entry.id, ok), onReveal: () => sayWord(entry) };
}
function pronSlotItem(entry, slot){
  if(entry.pron && (slot === "pron" || !entry.w)) return pronTypeItem(entry);
  return entry.w ? writtenTypeItem(entry) : recallItem(entry);
}
const WORD_ITEM = { hear: hearItem, read: readItem, recall: recallItem, type: (e, slot) => PRON_TYPING ? pronSlotItem(e, slot) : TYPING ? typeItem(e) : recallItem(e) };
// (p, i, plan): as an Array.map callback; i/plan pick the type slot's item (PRON_TYPING).
const itemFromPlan = (p, i, plan) => WORD_ITEM[p.kind](p.word, p.kind === "type" && PRON_TYPING ? VC.typeSlotKind(plan, i) : undefined);
// One card per missed word/sentence (items carry `key`), however many question types
// it was missed as; the most-missed first, with a count when missed more than once.
function missSummary(miss){
  const u = VC.dedupeMisses(miss);
  return u.length ? `<p class="q">Missed:</p>${u.map(({item, count})=>`<div class="stmt rvb">${count > 1 ? `<div class="q" style="margin:0 0 4px">missed ${count}×</div>` : ""}${item.reveal}</div>`).join("")}` : "<p class='q'>Clean.</p>";
}

// ===================== sentence drill items =====================
function sentenceRevealBlock(s){
  const pf = pfSentence(s, null, null, null, true);
  if(pf && pf.taps) return `<div data-tokbox><div class="rw${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}${sentSayHTML(s)}${pfWrittenTap(pf)}</div><div style="color:var(--mute)">${ui(s.en)}</div></div>`;
  if(pf){
    const canHear = canHearSentence(s);
    const icon = canHear ? ` <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span>` : "";
    return `<div${canHear ? ` data-sent="${SENT_INDEX.get(s)}" style="cursor:pointer"` : ""}><div class="rw${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}${icon}${pfWrittenTap(pf)}</div><div style="color:var(--mute)">${ui(s.en)}</div></div>`;
  }
  const rt = sentenceRuby(s);
  if(rt && rt.some(k => WORDS_BY_ID[k.wordId])) return `<div data-tokbox><div class="rw hasruby"${TA}>${rubyTextHTML(s, rt, null, true)}${sentSayHTML(s)}</div><div style="color:var(--mute)">${ui(s.en)}</div></div>`;
  const p = rt ? "" : pronOf(s);
  const canHear = canHearSentence(s);
  const icon = canHear ? ` <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span>` : "";
  return `<div${canHear ? ` data-sent="${SENT_INDEX.get(s)}" style="cursor:pointer"` : ""}><div class="rw${rt ? " hasruby" : ""}"${TA}>${rt ? rubyTextHTML(s, rt) : escapeHtml(s.t)}${icon}</div>${p ? `<div class="rp">${readingHTML(p)}</div>` : ""}<div style="color:var(--mute)">${ui(s.en)}</div></div>`;
}
const sentenceChoices = s => [s.en, ...VC.sentenceOpts(s, SENTENCES).map(d=>d.en)];
function readSentence(s){
  const pf = pfSentence(s);
  const rt = pf ? null : sentenceRuby(s);
  const p = rt || pf ? "" : pronOf(s);
  return { kind:"mc", key:"s:"+s.id, label:"What does it mean?", optsClass:"opts-hero",
    html: pf ? `<div class="med wd${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}${pfWrittenTap(pf)}</div>`
      : `<div class="med wd${rt ? " hasruby" : ""}"${TA}>${rt ? rubyTextHTML(s, rt) : escapeHtml(s.t)}</div>${p ? `<div class="q">${readingHTML(p)}</div>` : ""}`,
    opts: sentenceChoices(s), a: s.en, reveal: sentenceRevealBlock(s), onAnswer: ok=>markSentence(s.id, ok),
    mount: () => saySentence(s), };
}
function hearSentence(s){
  if(!canHearSentence(s)) return Object.assign(readSentence(s), { needsNotice: true });
  return { kind:"mc", key:"s:"+s.id, label:"What did they say?", optsClass:"opts-hero",
    html: `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`,
    opts: sentenceChoices(s), a: s.en, reveal: `<div class="q">You heard:</div>${sentenceRevealBlock(s)}`,
    onAnswer: ok=>markSentence(s.id, ok),
    mount: () => { const btn = $("sp"); saySentence(s, btn); btn.onclick = ()=>saySentence(s, btn); },
    };
}
// gap — sentence with one content word blanked; pick it from 4, or type it. Returns
// null when the sentence has no legal blank (callers fall back to readSentence). No
// audio before answering: hearing the sentence would give the blank away.
function gapSentence(s, typed){
  const idxs = VC.gapCandidateIndices(s, WORDS_BY_ID, PACK);
  if(!idxs.length) return null;
  const entry = WORDS_BY_ID[s.words[idxs[Math.floor(Math.random()*idxs.length)]]];
  const match = VC.gapMatch(s, entry, WORDS_BY_ID, PACK);
  const b = VC.blankSentence(s, match);
  // pronFirst: the blanked sentence by tiers (pfSentence); false = only its reading line
  // could be shown, where no blank can be placed: no gap item (caller falls back).
  const pf = pfSentence(s, null, match);
  if(pf === false) return null;
  const html = pf ? `<div class="med wd${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}${pfWrittenTap(pf)}</div><div class="q">${ui(s.en)}</div>`
    : `<div class="med wd"${TA}>${escapeHtml(b.before)}<span class="blank">____</span>${escapeHtml(b.after)}</div><div class="q">${ui(s.en)}</div>`;
  const base = { key:"s:"+s.id, reveal: sentenceRevealBlock(s), onAnswer: ok=>markSentence(s.id, ok),
    onReveal: () => saySentence(s) };
  if(typed && TYPING){
    return Object.assign(base, { kind:"type", label:"Type the missing word", html,
      check: val => VC.acceptTyped(val, entry, PACK, [match.text]) });
  }
  const gc = VC.gapChoices(entry, match, WORDS, PACK);
  return Object.assign(base, { kind:"mc", label:"What's the missing word?", optsClass:"opts-hero opts-w", html,
    opts: gc.opts, a: gc.a, optHtml: wordOptHtml(gc.byLabel), optsT: true });
}
function sentenceItemFor(s){
  const k = VC.sentenceKind(PACK);
  if(k === "hear") return hearSentence(s);
  if(k === "read") return readSentence(s);
  return gapSentence(s, k === "gapType") || readSentence(s);
}

// ===================== character drill items =====================
// One renderer per VC.charItem kind (pack.characters only). The stimulus is what the
// item's `show` says: charRead/charSound the written form alone (no reading, no audio),
// charPick the reading plus the linked word's audio, charRecall the meaning. The reveal
// always gives form, reading and meaning. Scoring writes prog.chars.c only (markChar).
const sayUnit = (it, btn) => { const w = WORDS_BY_ID[it.wordId]; if(w) sayWord(w, btn); else speak(it.t, btn); };
const canHearUnit = it => { const w = WORDS_BY_ID[it.wordId]; return w ? canHearWord(w) : hasSpeech; };
function charRevealBlock(it){
  const tap = WORDS_BY_ID[it.wordId] && canHearWord(WORDS_BY_ID[it.wordId]);
  const icon = tap ? ` <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span>` : "";
  return `<div${tap ? ` data-wid="${escapeHtml(it.wordId)}" style="cursor:pointer"` : ""}><div class="rw"${TA}>${escapeHtml(it.t)}${icon}</div>${it.reading ? `<div class="rp">${readingHTML(it.reading)}</div>` : ""}<div style="color:var(--mute)">${ui(it.gloss)}</div></div>`;
}
function charDrillItem(kind, unit){
  const it = VC.charItem(kind, unit, CHAR_CTX);
  const base = { kind:"mc", key: it.key, opts: it.options, a: it.answer, reveal: charRevealBlock(it),
    onAnswer: ok => markChar(it.unitId, ok), onReveal: () => sayUnit(it) };
  const form = `<div class="big wd"${TA}>${escapeHtml(it.t)}</div>`;
  const formOpts = { optsClass:"opts-hero opts-w", optHtml: o => tw(o), optsT: true };
  if(kind === "charRead") return Object.assign(base, { label:"What does it mean?", optsClass:"opts-hero", html: form });
  if(kind === "charSound") return Object.assign(base, { label:"How is it said?", optsClass:"opts-hero", html: form, optHtml: o => `<bdi>${readingHTML(o)}</bdi>` });
  if(kind === "charPick"){
    const hear = it.audio && canHearUnit(it);
    return Object.assign(base, formOpts, { label:"How is it written?",
      html: `${hear ? `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>` : ""}<div class="med" style="text-align:center">${readingHTML(it.reading)}</div>`,
      mount: () => { if(!hear) return; const btn = $("sp"); sayUnit(it, btn); btn.onclick = () => sayUnit(it, btn); },
      onReveal: null });
  }
  return Object.assign(base, formOpts, { label:"How is it written?", html: `<div class="med" style="text-align:center">${ui(it.gloss)}</div>` });
}
// ===================== script primer items =====================
// One renderer per VC.scriptItem kind (pack.script only, docs/SCRIPT_PRIMER.md §2). The
// stimulus is the item's `show` (or a speaker for audio "before"); options are glyphs in
// a 2x2 grid, or romans/words in a list. audio "after" plays on answering. Scoring writes
// prog.script.u only (markScript). No voice (pack.script.tts false, or no browser voice):
// ctx.tts false, so soundSym shows the roman and wordHear becomes wordRead (core.js).
const scriptVoice = () => !!SCFG && SCFG.tts !== false && hasSpeech;
const scriptCtx = set => ({ units: SUNITS, pool: VC.scriptPool(SUNITS, prog, set), byId: SCRIPT_BYID, tts: scriptVoice() });
// Kind-picking context for the core plans (VC.scriptKindFits): a kind that cannot get 4
// options from every unit is never picked. undefined without pack.script.
const scriptKindCtx = () => HAS_SCRIPT ? { units: SUNITS, byId: SCRIPT_BYID, tts: scriptVoice() } : undefined;
function markScriptRec(unitId, ok){ VC.markScript(prog, unitId, ok); store.save(); } // prog.script.u only
const sayScript = (it, btn) => speak(it.say || "", btn, it.audioUrl || undefined);
// A unit's own sound: its recorded clip, else its `say` when the pack has a voice.
const unitHasSound = u => !!(u && (u.audio || (scriptVoice() && u.say)));
// A unit's clip falls back (clipFailed) to its say carrier by TTS when the script is voiced.
const sayUnitSound = (u, btn) => { if(u.audio) speak(scriptVoice() && u.say ? String(u.say) : "", btn, String(u.audio)); else if(scriptVoice() && u.say) speak(String(u.say), btn); };
const FORM_LABEL = { isol:"isolated", init:"initial", medi:"medial", fina:"final" };
function scriptRevealBlock(it){
  const r = it.reveal;
  // A composed syllable is mixed text (parts, "+", "="): each target piece is isolated by tw().
  const head = r.syll ? `<div class="rw xrs">${r.syll.parts.map(p => tw(p)).join(" + ")} = ${tw(r.syll.t)}</div>` : `<div class="rw"${TA}>${escapeHtml(r.t)}</div>`;
  const w = r.word;
  const wordTap = w && (scriptVoice() || !!wordAudio(SCRIPT_BYID[w.id]));
  return `<div>${head}<div>${r.name ? `${tf(r.name)} · ` : ""}<b>${escapeHtml(r.roman)}</b></div>${r.note ? `<div style="color:var(--mute)">${ui(r.note)}</div>` : ""}${w ? `<div class="xrword"${wordTap ? ` data-xw="${escapeHtml(w.id)}" style="cursor:pointer"` : ""}><div class="rw"${TA}>${escapeHtml(w.w)}${wordTap ? ` <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span>` : ""}</div><div class="rp">${escapeHtml(w.roman)}</div><div style="color:var(--mute)">${ui(w.en || "")}</div></div>` : ""}</div>`;
}
function scriptDrillItem(kind, unit, ctx){
  const it = VC.scriptItem(kind, unit, ctx || scriptCtx());
  const base = { kind:"mc", key: it.key, opts: it.options, a: it.answer, reveal: scriptRevealBlock(it),
    onAnswer: ok => markScriptRec(it.unitId, ok), onReveal: it.audio === "after" ? () => sayScript(it) : null };
  const glyphOpts = { optsClass:"opts-hero opts-w opts-g", optHtml: o => tw(o), optsT: true };
  const wordOpts = { optsClass:"opts-hero opts-w", optHtml: o => tw(o), optsT: true };
  const romanOpts = { optsClass:"opts-hero", optHtml: o => `<bdi>${escapeHtml(o)}</bdi>` };
  const big = s => `<div class="big wd xg"${TA}>${escapeHtml(s)}</div>`;
  const sub = s => s ? `<div class="pron">${escapeHtml(s)}</div>` : "";
  const hear = () => ({ html: `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`,
    mount: () => { const b = $("sp"); sayScript(it, b); b.onclick = () => sayScript(it, b); } });
  const k = it.kind;
  if(k === "symSound") return Object.assign(base, romanOpts, { label:"How does it sound?", html: big(it.show) });
  if(k === "soundSym") return Object.assign(base, glyphOpts, it.audio === "before" ? hear() : { html: `<div class="med" style="text-align:center">${escapeHtml(it.show)}</div>` }, { label:"Which one makes this sound?" });
  if(k === "symType"){
    const accept = (it.accept || [it.answer]).map(VC.normKey);
    return { kind:"type", key: it.key, label:"Type how it sounds", html: big(it.show), inputTA: "", placeholder: "type the sound",
      check: v => accept.includes(VC.normKey(v)), reveal: base.reveal, onAnswer: base.onAnswer, onReveal: base.onReveal };
  }
  if(k === "compose") return Object.assign(base, glyphOpts, { label:"Put them together", html: big(it.show) });
  if(k === "formFind") return Object.assign(base, wordOpts, { label:"Which word has this letter?", html: big(it.show) + sub(it.hint) });
  if(k === "formMatch") return Object.assign(base, glyphOpts, { label:"Which letter is this?", html: big(it.show) + sub(`${FORM_LABEL[it.form] || it.form} form`) });
  if(k === "wordRead") return Object.assign(base, romanOpts, { label:"How is it read?", html: big(it.show) });

// Glyph occurrences in an example word. A browser shapes each element's text on its own,
// so a span boundary inside a word can break a ligature (لا splits into ل + ا, a Devanagari
// conjunct into half forms). Two layers, chosen together:
//  - markup (every browser, and what node tests see): the tint spans whole shaping
//    clusters (core shapingClusters: a grapheme, lam+alef, a virama conjunct), so a
//    boundary never falls inside a mandatory ligature or conjunct. Highlighting ا in لا
//    tints لا; adjacent tinted clusters share one span.
//  - paintScriptHL, where the CSS Custom Highlight API exists (Chrome 105+, Safari 17.2+,
//    Firefox 140+): after insertion the spans are replaced by plain text plus ranges in a
//    registered Highlight, so the word is one text node and shapes exactly as untinted
//    (this also keeps Nastaliq's longer ligatures whole, which clusters cannot promise).
// The Highlight API alone would leave older browsers with no tint and nothing testable in
// markup; clusters alone cannot cover every font's discretionary ligatures.
// Which clusters match: the glyph as a substring (code units), else per cluster by core's
// scriptGlyphIn, the validator's fold (compatibility decomposition, lower case, positional
// jamo as letters), so a jamo tints its syllable block and آ counts as ا.
function scriptHL(word, glyph){
  const w = String(word), g = String(glyph || "");
  if(!g) return escapeHtml(w);
  const cl = VC.shapingClusters(w);
  let marks;
  if(w.includes(g)){
    const hits = []; for(let i = w.indexOf(g); i >= 0; i = w.indexOf(g, i + g.length)) hits.push([i, i + g.length]);
    let at = 0;
    marks = cl.map(c => { const a = at, b = at += c.length; return hits.some(([s, e]) => s < b && e > a); });
  } else marks = cl.map(c => VC.scriptGlyphIn(g, c));
  let out = "", run = "";
  cl.forEach((c, i) => {
    if(marks[i]){ run += c; return; }
    if(run){ out += `<span class="xhl">${escapeHtml(run)}</span>`; run = ""; }
    out += escapeHtml(c);
  });
  return out + (run ? `<span class="xhl">${escapeHtml(run)}</span>` : "");
}
// StaticRange, not Range: a live Range whose text node is replaced collapses into the

// at the removed node.
const HL_API = typeof CSS !== "undefined" && !!CSS.highlights && typeof Highlight === "function" && typeof StaticRange === "function";
let XHL = null;
function paintScriptHL(root){
  if(!HL_API || !root || !root.querySelectorAll) return;
  if(!XHL){ XHL = new Highlight(); CSS.highlights.set("xhl", XHL); }
  [...XHL].forEach(r => { if(!r.startContainer.isConnected) XHL.delete(r); }); // cards re-rendered since
  root.querySelectorAll(".xteach .wd").forEach(wd => {
    if(!wd.querySelector(".xhl")) return;
    const spans = []; let text = "";
    wd.childNodes.forEach(n => { const t = n.textContent; if(n.nodeType === 1 && n.classList.contains("xhl")) spans.push([text.length, text.length + t.length]); text += t; });
    wd.textContent = text;
    const tn = wd.firstChild;
    spans.forEach(([a, b]) => XHL.add(new StaticRange({ startContainer: tn, startOffset: a, endContainer: tn, endOffset: b })));
  });
}

// review(15, >=40% production) -> learn(next set) -> listen(12 hear) -> recall(8
// recall/type) -> sentences(8) -> finish. Each step skips itself when its pool is too small.
// With pack.characters every step reads the Start-today snapshot (todayStepState.snap,
// taken lazily if a step is entered without one): Learn teaches its stage's set (word
// or unit), Review is snap.reviewSize, and Review/Recall rank units with words once
// characters have started. Without it each step is the pre-characters code.
function todayStep(){
  const snap = HAS_STAGES ? (todayStepState.snap || (todayStepState.snap = takeSnapshot())) : null;
  const lw = learnedWords();
  const nn = snap ? (snap.stage && snap.stage.kind === "words" ? { lv: snap.stage.lv, set: snap.stage.set } : null) : nextNewSet();
  const avail = availableSentences();
  const g = VC.todayGates(lw.length, snap ? snapLearns(snap) : !!nn, avail.length, scriptCount());
  const units = snap && snap.charsStarted ? CHAR_LIST : undefined;
  const s = todayStepState.step++;
  if(s === 0){
    if(g.review && snap){
      const plan = todayStepState.review || VC.buildReviewPlan(lw, prog, PACK, { size: snap.reviewSize, units, script: SU, scriptCtx: scriptKindCtx() });
      todayStepState.review = null;
      drill(plan.map(planItem), todayStep, missSummary); return;
    }
    if(g.review){ drill(VC.buildReviewPlan(lw, prog, PACK).map(itemFromPlan), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 1){
    if(g.learn && snap && snap.stage.kind === "script"){ scriptLearn(snap, 0); return; }
    if(g.learn && snap && snap.stage.kind === "chars"){
      const cs = snap.cset;
      charTeach(cs, snap.stage, () => drill(VC.learnCharPlan(cs.units, PACK).map(planItem), todayStep, missSummary));
      return;
    }
    if(g.learn){
      const list = levelList(nn.lv).slice(nn.set*SIZE, nn.set*SIZE+SIZE);
      vocabTeach(list, nn.lv, () => {
        const items = [];
        list.forEach(w => items.push(hearItem(w), readItem(w)));
        drill(items, () => { prog.sets[nn.lv] = nn.set+1; store.save(); todayStep(); }, missSummary);
      });
      return;
    }
    return todayStep();
  }
  if(s === 2){
    if(g.listen){ drill(weakFirst(lw,12).map(hearItem), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 3){
    if(g.recall && units){ drill(VC.buildRecallPlan(lw, prog, PACK, 8, { units }).map(planItem), todayStep, missSummary); return; }
    if(g.recall){ drill(VC.buildRecallPlan(lw, prog, PACK, 8).map(itemFromPlan), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 4){
    if(g.sentences){ drill(weakFirstSentences(avail,8).map(sentenceItemFor), todayStep, missSummary); return; }
    return todayStep();
  }

}

// reading, card.say[i] its text), grouped by lesson, first occurrence of each reading
// only. The lessons already teach every sound, so the reference is built from them.
function soundsRefGroups(){
  const seen = new Set(), groups = [];

// One passage sentence: linked words as tappable spans (data-pw), words not visible in
// the text as chips below, and a read-aloud button when speech works (or it has audio).
// With pack.characters a passage sentence carrying `ruby` (sentences.json format) gets the
// same tiers as sentence rows (sentenceRuby): each tap segment's text renders its ruby
// tokens (passageRubyHTML); the line box is the fixed tall one, so no line jumps.
function passageSentenceHTML(s, si, hi){
  const seg = VC.passageSegments(s, WORDS_BY_ID, PACK);
  const pf = pfPassage(s, seg, "pw");
  if(pf){
    const chips = seg.unplaced.length ? `<div class="pchips">${seg.unplaced.map(id => `<span class="pw pchip" data-pw="${escapeHtml(id)}" role="button" tabindex="0"${TA}>${wordFormHTML(WORDS_BY_ID[id], false)}</span>`).join("")}</div>` : "";
    const aloud = canHearSentence(s) ? `<button class="replay psay" data-say="${si}" aria-label="Read sentence aloud">${TEACH_PLAY_SVG}</button>` : "";
    return `<div class="psent${hi ? " hi" : ""}" data-si="${si}"><div class="ptxt${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}</div>${aloud}${chips}</div>`;
  }
  const rt = sentenceRuby(s);
  let at = 0;
  const inner = x => { const a = at; at += x.text.length; return rt ? passageRubyHTML(String(s.t || ""), rt, a, at) : escapeHtml(x.text); };
  const txt = seg.parts.map(x => x.id ? `<span class="pw" data-pw="${escapeHtml(x.id)}"${x.gloss ? ` data-pg="${escapeHtml(x.gloss)}"` : ""} role="button" tabindex="0">${inner(x)}</span>` : inner(x)).join("");
  const chips = seg.unplaced.length ? `<div class="pchips">${seg.unplaced.map(id => `<span class="pw pchip" data-pw="${escapeHtml(id)}" role="button" tabindex="0"${TA}>${wordFormHTML(WORDS_BY_ID[id], false)}</span>`).join("")}</div>` : "";
  const aloud = canHearSentence(s) ? `<button class="replay psay" data-say="${si}" aria-label="Read sentence aloud">${TEACH_PLAY_SVG}</button>` : "";
  return `<div class="psent${hi ? " hi" : ""}" data-si="${si}"><div class="ptxt${rt ? " hasruby" : ""}"${TA}>${txt}</div>${aloud}${chips}</div>`;
}
// Text t[a, b) with the ruby tokens that lie wholly inside it (rubyTokHTML: reading shown
// below bare, hidden at or above it). A token crossing a tap-segment edge, or malformed,
// renders plain.
function passageRubyHTML(t, toks, a, b){
  let out = "", pos = a;
  toks.forEach(k => {
    if(!(k.start >= pos && k.end > k.start && k.end <= b)) return;
    out += escapeHtml(t.slice(pos, k.start));
    const base = escapeHtml(t.slice(k.start, k.end));
    out += rubyTokHTML(base, k);
    pos = k.end;
  });
  return out + escapeHtml(t.slice(pos, b));
}
// pack.pronFirst passage sentence (null when off): its tap segments (VC.passageSegments)
// rendered by the same rule as sentences. With `ruby` the tokens follow their tiers
// (VC.rubyTiers); without it each linked word is one token, its reading while its unit
// is below mastered (displayForm), else its written form. A span longer than its word
// (这个 for 这, 越来越 for 越) reads as VC.composeSpanReading: the word's pron where its
// written form occurs, each other character its single-character unit reading when the
// pack sets characters.compose, else (and with no reading) written, so no character is
// ever dropped or given a guessed reading. Text outside
// every token (a name with no word) stays as written: there is no reading for it.
// taps: "pw" wraps linked words as data-pw tap spans (the Read screen, logged as
// tapped), "tok" as word taps (tokTapHTML: question reveals and results, no log), false
// plain. A phrase span (spanHead) carries its surface and reading for the popover.
function pfPassage(s, seg, taps){
  if(!PRON_FIRST) return null;
  const t = String(s.t || "");
  const rt = sentenceRuby(s);
  let toks = rt;
  const cuts = []; let at = 0;
  seg.parts.forEach(x => { cuts.push(at); at += x.text.length; });
  if(!toks){
    toks = []; at = 0;
    seg.parts.forEach(x => {
      const a = at; at += x.text.length;
      const w = x.id ? WORDS_BY_ID[x.id] : null; if(!w) return;
      const d = dispWord(w);
      if(!d.isPron || x.text === w.w){ toks.push({ start: a, end: at, tier: d.isPron ? "pron" : "plain", reading: w.pron || "", wordId: w.id }); return; }
      VC.composeSpanReading(x.text, w, charReading, PACK).forEach(q => { if(q.reading) toks.push({ start: a + q.start, end: a + q.end, tier: "pron", reading: q.reading, wordId: w.id }); });
    });
  }
  const pieces = VC.sentencePieces(s, toks, null, cuts);
  let ruby = false;
  const pieceHTML = p => {
    if(p.kind === "tok" && (p.tier === "ruby" || p.tier === "bare")){ ruby = true; return rubyTokHTML(escapeHtml(p.text), showPron() ? p : Object.assign({}, p, { tier:"bare" })); }
    return p.kind === "tok" && p.tier === "pron" ? readingHTML(p.text) : escapeHtml(p.text);
  };
  let html = ""; at = 0;
  seg.parts.forEach(x => {
    const a = at; at += x.text.length;
    const mine = pieces.filter(p => p.start >= a && p.start < at);
    if(!mine.length) return;
    const inner = mine.map((p, i) => (i ? escapeHtml(p.pre) : "") + pieceHTML(p)).join("");
    const w = x.id ? WORDS_BY_ID[x.id] : null;
    const head = w && taps ? spanHead(x.text, w, rt, a) : null;
    const hd = head ? ` data-ts="${escapeHtml(head.surface)}" data-tr="${escapeHtml(head.reading)}"` : "";
    html += escapeHtml(mine[0].pre) + (w && taps === "pw" ? `<span class="pw" data-pw="${escapeHtml(x.id)}"${x.gloss ? ` data-pg="${escapeHtml(x.gloss)}"` : ""}${hd} role="button" tabindex="0">${inner}</span>`
      : w && taps === "tok" ? tokTapHTML(w.id, inner, head) : inner);
  });
  return { html, ruby };
}
// Popover head of a phrase span (pronFirst): a span whose text contains its word's written
// form and more (越来越 for 越, 一下 for 下) is shown in the popover as the tapped surface
// with its reading: from the sentence's ruby tokens inside it when it has ruby (a
// character outside every token stays written), else VC.spanReadingText. null for any
// other span (the word's own headword). rt: the sentence's ruby tiers or null; a: the
// span's offset in the sentence.
function spanHead(text, w, rt, a){
  if(!phraseHead(text, w, "")) return null;
  if(!rt) return { surface: text, reading: VC.spanReadingText(text, w, charReading, PACK) };
  let r = "", pos = 0;
  rt.filter(k => k.start >= a && k.end <= a + text.length).forEach(k => {
    if(k.start - a > pos) r += text.slice(pos, k.start - a);
    r = VC.joinReadings(r, String(k.reading || ""), PACK); pos = k.end - a;
  });
  return { surface: text, reading: r + text.slice(pos) };
}
// A passage sentence as display text (question reveal, results): pronFirst by pfPassage
// with word taps (tokTapHTML; the caller's container is a data-tokbox), else the written text.
function passagePlainHTML(s){
  const pf = PRON_FIRST ? pfPassage(s, VC.passageSegments(s, WORDS_BY_ID, PACK), "tok") : null;
  return pf ? pf.html : escapeHtml(s.t);
}
const TOKBOX = PRON_FIRST ? " data-tokbox" : ""; // passage reveals hold word taps (passagePlainHTML)
// pack.pronFirst text carrying its own ruby (passages.json titleRuby, questions[].ruby,
// questions[].optionsRuby): reading-first by the sentence tier rules (VC.rubyTiers +
// VC.sentencePieces), readings tone-coloured (readingHTML); a token with a null wordId (a
// name) shows its reading. No word taps. null when pronFirst is off or the text has no
// ruby: the caller shows it as written, exactly as before.
function pfRubyText(t, ruby){
  if(!PRON_FIRST || !Array.isArray(ruby) || !ruby.length) return null;
  const obj = { t: String(t == null ? "" : t), ruby };
  const toks = VC.rubyTiers(obj, CHAR_LIST, prog, PACK, VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU));
  if(!toks) return null;
  let hasRuby = false, anyPron = false;
  const html = VC.sentencePieces(obj, toks).map(p => {
    if(p.kind === "tok" && p.tier === "pron"){ anyPron = true; return escapeHtml(p.pre) + readingHTML(p.text); }
    if(p.kind === "tok"){ hasRuby = true; return escapeHtml(p.pre) + rubyTokHTML(escapeHtml(p.text), showPron() ? p : Object.assign({}, p, { tier:"bare" })); }
    return escapeHtml(p.pre) + escapeHtml(p.text);
  }).join("");
  return { html, ruby: hasRuby, written: anyPron ? obj.t : false };
}
// Target-language text with optional ruby, as inner HTML: under pronFirst by pfRubyText
// plus the show-written tap (none when inButton: option and list buttons are tap targets
// themselves), else escaped as written.
function rubyTextOr(t, ruby, inButton){
  const pf = pfRubyText(t, ruby);
  return pf ? pf.html + (inButton ? "" : pfWrittenTap(pf)) : escapeHtml(t);
}
// The same wrapped as target-language text (tw) for places that used tw(text).
function rubyTw(t, ruby, inButton){
  return pfRubyText(t, ruby) ? `<bdi${TA}>${rubyTextOr(t, ruby, inButton)}</bdi>` : tw(t);
}
function passageHTML(hiIndex){ return RD.p.sentences.map((s, i) => passageSentenceHTML(s, i, i === hiIndex)).join(""); }
// RTL packs: the popover (#gloss and the sentence tokgloss) is an LTR line, right-aligned:
// the tapped word is its own isolated dir=rtl span (TA), pron and gloss follow as
// isolated LTR runs, so a gloss that wraps never interleaves with the word, and RTL
// fragments inside the gloss are isolated by ui(). The results' weak-word rows are RTL
// flex rows (checkbox on the right like the rows around them); each piece is its own
// flex item, pron/gloss/why labels dir=ltr.
const LTR = DISP.rtl ? ' dir="ltr"' : "";
const glossBox = () => `<div class="gloss" id="gloss"${LTR} hidden></div>`;
// spanGloss: the tapped span's display-only gloss (spans[i][3], carried as data-pg on
// the tap span), shown instead of the word's gloss; without one the word's own gloss.
// head (optional {surface, reading}, pronFirst phrase spans, spanHead): the headword is the
// tapped surface (越来越), shown as its reading while the word is shown by its reading
// (with the show-written tap), else written with the reading beside it.
function glossHTML(id, spanGloss, head){
  const w = WORDS_BY_ID[id]; if(!w) return "";
  const g = spanGloss ? String(spanGloss).replace(/\s+/g, " ").trim() : "";
  const ge = ` <span class="ge"${LTR}>${ui(g || VC.gloss(w))}</span>`;
  if(head){
    const r = head.reading || "";
    if(dispWord(w).isPron && r) return `<span class="gw"${TA}>${readingHTML(r)}${showWrittenBtn(head.surface)}</span>${ge}`;
    const hp = r && showPron() ? r : "";
    return `<span class="gw"${TA}>${escapeHtml(head.surface)}</span>${hp ? ` <span class="gp"${LTR}>${readingHTML(hp)}</span>` : ""}${ge}`;
  }
  const p = pronBeside(w);
  return `<span class="gw"${TA}>${wordFormHTML(w)}</span>${p ? ` <span class="gp"${LTR}>${readingHTML(p)}</span>` : ""}${ge}`;
}
// Wires tap-to-gloss and read-aloud on a freshly rendered passage container (its
// innerHTML is replaced on every render, so listeners never accumulate).
function wirePassage(box, glossEl){
  const tap = t => {
    const id = t.dataset.pw;
    if(RD && RD.tapped.indexOf(id) < 0) RD.tapped.push(id);
    box.querySelectorAll(".pw.on").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    // RD.glosses: the sense last seen per tapped word, so the results screen's weak-word
    // list shows the gloss the learner actually looked at.
    const g = t.dataset.pg || "";
    if(RD && RD.glosses){ if(g) RD.glosses[id] = g; else delete RD.glosses[id]; }
    const head = tokHeadOf(t);
    if(glossEl){ glossEl.innerHTML = glossHTML(id, g, head); glossEl.hidden = false; }
    announce(glossHTML(id, g, head));
  };
  box.addEventListener("click", e => {
    const w = e.target.closest("[data-pw]"); if(w){ tap(w); return; }
    const b = e.target.closest("[data-say]"); if(b){ const s = RD && RD.p.sentences[+b.dataset.say]; if(s) saySentence(s, b); }
  });
  box.addEventListener("keydown", e => { const w = e.target.closest && e.target.closest("[data-pw]"); if(w && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); tap(w); } });
}

function readQuestionScreen(){
  screenTop();

  if(!RD.answers[qi]) RD.answers[qi] = { ok: null, reopened: false, given: null };

  RD.shown = false;

  const tf = q.type === "tf";
  const order = tf ? [true, false] : shuffle([0,1,2,3]);
  P.innerHTML = `<div class="drill-body top"><p class="q">Question ${qi+1} / ${p.questions.length}</p>
    <div class="med wd"${TA}>${rubyTextOr(q.q, q.ruby)}</div>${q.en ? `<div class="q">${ui(q.en)}</div>` : ""}
    <div class="opts ${tf ? "" : "opts-w"}" id="o"></div>
    <div class="reveal" id="rv"></div>
    <button class="ghost" id="ptoggle" aria-expanded="${RD.shown}" style="margin-top:12px">${RD.shown ? "Hide passage" : "Show passage"}</button>
    ${glossBox()}

    </div><div class="actions"><button class="next" id="nx" style="display:none">${qi+1 < p.questions.length ? "Next" : "See results"}</button></div>`;
  wirePassage($("pbox"), $("gloss"));
  $("ptoggle").onclick = () => {
    RD.shown = !RD.shown;
    if(RD.shown && rec.ok === null) rec.reopened = true; // logged: looked back before answering

    $("ptoggle").textContent = RD.shown ? "Hide passage" : "Show passage";
    $("ptoggle").setAttribute("aria-expanded", String(RD.shown));
  };
  const box = $("o");
  order.forEach((v, i) => {
    const b = document.createElement("button");
    b.innerHTML = `<b class="num"${UIA}>${i+1}</b>${tf ? (v ? "True" : "False") : rubyTw(q.options[v], (q.optionsRuby || [])[v], true)}`;
    if(!tf && DISP.rtl) b.dir = "rtl";

    b.onclick = () => {
      if(rec.ok !== null) return;

      [...box.children].forEach(x => { x.disabled = true; if(x.dataset.v === String(q.answer)) x.classList.add("ok"); });
      if(!rec.ok) b.classList.add("bad");
      const s = p.sentences[q.sentence];
      showReveal(`<div class="q" style="margin:0 0 6px">${rec.ok ? "Right." : "Not quite."} The answer is in this sentence:</div><div class="stmt hi" style="margin:0"${TOKBOX}><div${TA}><mark>${passagePlainHTML(s)}</mark></div><div class="q" style="margin:4px 0 0">${ui(s.en)}</div></div>`);
      const hs = $("pbox").querySelector(`[data-si="${q.sentence}"]`); if(hs) hs.classList.add("hi");
