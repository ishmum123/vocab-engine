function startPassage(p){
  if(!p) return;
  RD = { p, tapped: [], answers: [], qi: null, shown: false, resultsDone: false };
  readPassageScreen();
}
// One passage sentence: linked words as tappable spans (data-pw), words not visible in
// the text as chips below, and a read-aloud button when speech works (or it has audio).
// With pack.characters a passage sentence carrying `ruby` (sentences.json format) gets the
// same tiers as sentence rows (sentenceRuby): each tap segment's text renders its ruby
// tokens (passageRubyHTML); the line box is the fixed tall one, so no line jumps.
function passageSentenceHTML(s, si, hi){
  const seg = VC.passageSegments(s, WORDS_BY_ID, PACK);
  const pf = pfPassage(s, seg, true);
  if(pf){
    const chips = seg.unplaced.length ? `<div class="pchips">${seg.unplaced.map(id => `<span class="pw pchip" data-pw="${escapeHtml(id)}" role="button" tabindex="0"${TA}>${wordFormHTML(WORDS_BY_ID[id], false)}</span>`).join("")}</div>` : "";
    const aloud = canHearSentence(s) ? `<button class="replay psay" data-say="${si}" aria-label="Read sentence aloud">${TEACH_PLAY_SVG}</button>` : "";
    return `<div class="psent${hi ? " hi" : ""}" data-si="${si}"><div class="ptxt${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}</div>${aloud}${chips}</div>`;
  }
  const rt = sentenceRuby(s);
  let at = 0;
  const inner = x => { const a = at; at += x.text.length; return rt ? passageRubyHTML(String(s.t || ""), rt, a, at) : escapeHtml(x.text); };
  const txt = seg.parts.map(x => x.id ? `<span class="pw" data-pw="${escapeHtml(x.id)}" role="button" tabindex="0">${inner(x)}</span>` : inner(x)).join("");
  const chips = seg.unplaced.length ? `<div class="pchips">${seg.unplaced.map(id => `<span class="pw pchip" data-pw="${escapeHtml(id)}" role="button" tabindex="0"${TA}>${wordFormHTML(WORDS_BY_ID[id], false)}</span>`).join("")}</div>` : "";
  const aloud = canHearSentence(s) ? `<button class="replay psay" data-say="${si}" aria-label="Read sentence aloud">${TEACH_PLAY_SVG}</button>` : "";
  return `<div class="psent${hi ? " hi" : ""}" data-si="${si}"><div class="ptxt${rt ? " hasruby" : ""}"${TA}>${txt}</div>${aloud}${chips}</div>`;
}
// Text t[a, b) with the ruby tokens that lie wholly inside it (rubyTokHTML: reading shown
// below bare, hidden at or above it). A token crossing a tap-segment edge, or malformed,
// renders plain.
function passageRubyHTML(t, toks, a, b){
  let out = "", pos = a;
  toks.forEach(k => {
    if(!(k.start >= pos && k.end > k.start && k.end <= b)) return;
    out += escapeHtml(t.slice(pos, k.start));
    const base = escapeHtml(t.slice(k.start, k.end));
    out += rubyTokHTML(base, k);
    pos = k.end;
  });
  return out + escapeHtml(t.slice(pos, b));
}
// pack.pronFirst passage sentence (null when off): its tap segments (VC.passageSegments)
// rendered by the same rule as sentences. With `ruby` the tokens follow their tiers
// (VC.rubyTiers); without it each linked word is one token, its reading while its unit
// is below mastered (displayForm), else its written form. Text outside every token (a
// name with no word) stays as written: there is no reading for it. taps: wrap linked
// words as data-pw tap spans (false: plain, for question reveals and results).
function pfPassage(s, seg, taps){
  if(!PRON_FIRST) return null;
  const t = String(s.t || "");
  let toks = sentenceRuby(s);
  const cuts = []; let at = 0;
  seg.parts.forEach(x => { cuts.push(at); at += x.text.length; });
  if(!toks){
    toks = []; at = 0;
    seg.parts.forEach(x => {
      const a = at; at += x.text.length;
      const w = x.id ? WORDS_BY_ID[x.id] : null; if(!w) return;
      const d = dispWord(w);
      toks.push({ start: a, end: at, tier: d.isPron ? "pron" : "plain", reading: w.pron || "", wordId: w.id });
    });
  }
  const pieces = VC.sentencePieces(s, toks, null, cuts);
  let ruby = false;
  const pieceHTML = p => {
    if(p.kind === "tok" && (p.tier === "ruby" || p.tier === "bare")){ ruby = true; return rubyTokHTML(escapeHtml(p.text), showPron() ? p : Object.assign({}, p, { tier:"bare" })); }
    return escapeHtml(p.text);
  };
  let html = ""; at = 0;
  seg.parts.forEach(x => {
    const a = at; at += x.text.length;
    const mine = pieces.filter(p => p.start >= a && p.start < at);
    if(!mine.length) return;
    const inner = mine.map((p, i) => (i ? escapeHtml(p.pre) : "") + pieceHTML(p)).join("");
    html += escapeHtml(mine[0].pre) + (x.id && taps ? `<span class="pw" data-pw="${escapeHtml(x.id)}" role="button" tabindex="0">${inner}</span>` : inner);
  });
  return { html, ruby };
}
// A passage sentence as plain display text (question reveal, results): pronFirst by
// pfPassage without taps, else the written text.
function passagePlainHTML(s){
  const pf = PRON_FIRST ? pfPassage(s, VC.passageSegments(s, WORDS_BY_ID, PACK), false) : null;
  return pf ? pf.html : escapeHtml(s.t);
}
function passageHTML(hiIndex){ return RD.p.sentences.map((s, i) => passageSentenceHTML(s, i, i === hiIndex)).join(""); }
// RTL packs: the popover runs right-to-left (tapped word at the right edge, then pron and
// gloss in reading order); pron and the English gloss stay isolated LTR runs inside it.
const LTR = SCRIPT.rtl ? ' dir="ltr"' : "";
const glossBox = () => `<div class="gloss" id="gloss"${SCRIPT.rtl ? ' dir="rtl"' : ""} hidden></div>`;
function glossHTML(id){
  const w = WORDS_BY_ID[id]; if(!w) return "";
  const p = pronBeside(w);
  return `<span class="gw"${TA}>${wordFormHTML(w)}</span>${p ? ` <span class="gp"${LTR}>${escapeHtml(p)}</span>` : ""} <span class="ge"${LTR}>${escapeHtml(VC.gloss(w))}</span>`;
}
// Wires tap-to-gloss and read-aloud on a freshly rendered passage container (its
// innerHTML is replaced on every render, so listeners never accumulate).
function wirePassage(box, glossEl){
  const tap = t => {
    const id = t.dataset.pw;
    if(RD && RD.tapped.indexOf(id) < 0) RD.tapped.push(id);
    box.querySelectorAll(".pw.on").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    if(glossEl){ glossEl.innerHTML = glossHTML(id); glossEl.hidden = false; }
    announce(glossHTML(id));
  };
  box.addEventListener("click", e => {
    const w = e.target.closest("[data-pw]"); if(w){ tap(w); return; }
    const b = e.target.closest("[data-say]"); if(b){ const s = RD && RD.p.sentences[+b.dataset.say]; if(s) saySentence(s, b); }
  });
  box.addEventListener("keydown", e => { const w = e.target.closest && e.target.closest("[data-pw]"); if(w && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); tap(w); } });
}
function readPassageScreen(){
  setScore(0,0);
  const p = RD.p, P = $("panel");
  P.innerHTML = `<div class="row"><button id="rback">‹ passages</button></div>
    <h2 class="ptitle"${TA}>${escapeHtml(p.title)}</h2>
    <p class="q">${escapeHtml(levelLabel(p.lv))} · ${VC.passageLength(p, PACK)} words. Tap a word to see its meaning.</p>
    ${glossBox()}
    <div class="passage" id="pbox">${passageHTML(-1)}</div>
    <div class="actions"><button class="next" id="rdone">Done reading</button></div>`;
  wirePassage($("pbox"), $("gloss"));
  $("rback").onclick = () => { RD = null; readRender(); };
  $("rdone").onclick = () => { RD.qi = 0; RD.shown = false; readQuestionScreen(); };
}
function readQuestionScreen(){
  const p = RD.p, P = $("panel"), qi = RD.qi, q = p.questions[qi];
  if(!RD.answers[qi]) RD.answers[qi] = { ok: null, reopened: false, given: null };
  const rec = RD.answers[qi];
  // Each question starts with the passage hidden, so "reopened" is logged per question.
  RD.shown = false;
  setScore(qi, p.questions.length);
  const tf = q.type === "tf";
  const order = tf ? [true, false] : shuffle([0,1,2,3]);
  P.innerHTML = `<div class="drill-body top"><p class="q">Question ${qi+1} / ${p.questions.length}</p>
    <div class="med wd"${TA}>${escapeHtml(q.q)}</div>${q.en ? `<div class="q">${escapeHtml(q.en)}</div>` : ""}
    <div class="opts ${tf ? "" : "opts-w"}" id="o"></div>
    <div class="reveal" id="rv"></div>
    <button class="ghost" id="ptoggle" aria-expanded="${RD.shown}" style="margin-top:12px">${RD.shown ? "Hide passage" : "Show passage"}</button>
    ${glossBox()}
    <div class="passage" id="pbox"${RD.shown ? "" : " hidden"}>${passageHTML(-1)}</div>
    </div><div class="actions"><button class="next" id="nx" style="display:none">${qi+1 < p.questions.length ? "Next" : "See results"}</button></div>`;
  wirePassage($("pbox"), $("gloss"));
  $("ptoggle").onclick = () => {
    RD.shown = !RD.shown;
    if(RD.shown && rec.ok === null) rec.reopened = true; // logged: looked back before answering
    $("pbox").hidden = !RD.shown;
    $("ptoggle").textContent = RD.shown ? "Hide passage" : "Show passage";
    $("ptoggle").setAttribute("aria-expanded", String(RD.shown));
  };
  const box = $("o");
  order.forEach((v, i) => {
    const b = document.createElement("button");
    b.innerHTML = `<b class="num">${i+1}</b>${tf ? (v ? "True" : "False") : tw(q.options[v])}`;
    if(!tf && SCRIPT.rtl) b.dir = "rtl";
    b.dataset.v = String(v);
    b.onclick = () => {
      if(rec.ok !== null) return;
      rec.given = v; rec.ok = VC.gradeQuestion(q, v);
      [...box.children].forEach(x => { x.disabled = true; if(x.dataset.v === String(q.answer)) x.classList.add("ok"); });
      if(!rec.ok) b.classList.add("bad");
      const s = p.sentences[q.sentence];
      showReveal(`<div class="q" style="margin:0 0 6px">${rec.ok ? "Right." : "Not quite."} The answer is in this sentence:</div><div class="stmt hi" style="margin:0"><div${TA}><mark>${passagePlainHTML(s)}</mark></div><div class="q" style="margin:4px 0 0">${escapeHtml(s.en)}</div></div>`);
      const hs = $("pbox").querySelector(`[data-si="${q.sentence}"]`); if(hs) hs.classList.add("hi");
      $("nx").style.display = "block"; setScore(qi+1, p.questions.length);
    };
    box.appendChild(b);
  });
  $("nx").onclick = () => {
    if(qi+1 < p.questions.length){ RD.qi = qi+1; RD.shown = false; readQuestionScreen(); }
    else { RD.resultsDone = true; markPassageFinished(); readResults(); }
  };
  drillKeyHandler = e => {
    if(e.target && e.target.closest && e.target.closest("[data-pw]")) return;
    if(e.key >= "1" && e.key <= String(order.length) && rec.ok === null) box.children[+e.key-1].click();
    else if(e.key === "Enter" && $("nx").style.display !== "none") $("nx").click();
  };
}
function markPassageFinished(){
  const sc = RD.answers.filter(a => a && a.ok).length;
  VC.markPassageDone(prog, RD.p.id, sc, RD.p.questions.length, todayISO());
  store.save();
}
const WHY_LABEL = { tapped: "tapped while reading", wrong: "missed question", reopened: "looked back" };

// ===================== Test (placement + free tests) =====================
function testRender(){
  setScore(0,0);
  const P = $("panel");
  if(testSel === "placement"){ placeRender(); return; }
  const lw = learnedWords(); const availSent = availableSentences();
  const tg = VC.testGates(lw.length, availSent.length);
  const needMore = tg.needPlacement;
  const n20 = Math.min(20, lw.length), sentN = Math.min(20, availSent.length);
  // Characters N (pack.characters, predecessor-app parity): recorded units weakest first, topped up to
  // 20 with learned words' unrecorded units, each a pack testKinds kind (VC.charTestPlan).
  // Shown once characters have started (VC.charsStarted), not only once a record exists.
  const charPlan = () => VC.charTestPlan(CHAR_LIST, learnedWords(), prog, PACK, 20);
  const charN = HAS_CHARACTERS && VC.charsStarted(PACK, WORDS, CHAR_LIST, prog) ? charPlan().length : 0;
  P.innerHTML = `<p class="q">Placement finds where to start. Free tests draw from what's already learned.</p>
    <div class="actions">
      ${needMore ? `<div class="stmt">Free tests unlock at ${VC.TEST_MIN_WORDS} learned words (${lw.length} so far). Learn ${VC.TEST_MIN_WORDS} words first, or let placement find where to start.<button class="next" id="needPlace" style="margin-top:8px">Take the placement test</button></div>` : `<button class="next" id="pl">Take Placement</button>`}
      ${tg.words ? `<div class="row" style="margin-top:8px;margin-bottom:0">
        <button class="ghost" id="tListen" style="flex:1">Listen ${n20}</button>
        <button class="ghost" id="tRecall" style="flex:1">Recall ${n20}</button>
      </div>` : ""}
      ${tg.sentences ? `<button class="ghost" id="tSentences">Sentences ${sentN}</button>` : ""}${charN ? `
      <button class="ghost" id="tChars">Characters ${charN}</button>` : ""}
    </div>`;
  if(needMore) $("needPlace").onclick = enterPlacementFromToday;
  else $("pl").onclick = () => { testSel = "placement"; testRender(); };
  if(tg.words){
    $("tListen").onclick = () => drill(weakFirst(lw,20).map(hearItem), testRender, missSummary);
    $("tRecall").onclick = () => drill(VC.buildRecallPlan(lw, prog, PACK, 20).map(itemFromPlan), testRender, missSummary);
  }
  if(tg.sentences){
    $("tSentences").onclick = () => drill(weakFirstSentences(availSent,20).map(hearSentence), testRender, missSummary);
  }
  if(charN) $("tChars").onclick = () => drill(charPlan().map(planItem), testRender, missSummary);
}
function placementItemTotal(){ return VC.strata(WORDS, PACK.placement, SIZE).reduce((n,_,i)=>n+VC.placementItemCount(i), 0); }
function placeRender(){
  D = null; drillKeyHandler = null; setScore(0,0);
  const P = $("panel"); const lw = learnedWords();
  const first = levelLabel(PACK.placement[0][0]), last = levelLabel(PACK.placement[PACK.placement.length-1][0]);
  P.innerHTML = `<div class="row"><button id="back">‹ test</button></div>
    <p class="q">${placementItemTotal()} words across ${escapeHtml(first)}–${escapeHtml(last)}: hear or read the word, pick the meaning. No feedback until the end. Places you inside a level; skipped words stay in review as provisional.</p>
    ${lw.length ? `<p class="q">Current: ${lw.length} words learned. Retaking can only move you forward: nothing already learned is lost.</p>` : ""}
    <div class="actions"><button class="next" id="go">Start placement</button></div>`;
  $("back").onclick = () => { testSel = null; testRender(); };
  $("go").onclick = startPlacement;
}
function startPlacement(){
  D = null; drillKeyHandler = null; setScore(0,0);
  const st = VC.strata(WORDS, PACK.placement, SIZE);
  const bucketItems = [];
  st.forEach((b,bi) => { pick(b.words, VC.placementItemCount(bi)).forEach(w=>bucketItems.push({b:bi, w})); });
  PL = { vocab:{items:shuffle(bucketItems), i:0}, st, res: st.map(()=>({r:0,n:0})) };
  placeVocabNext();
}
function placeVocabNext(){
  const P = $("panel"); const V = PL.vocab;
  if(V.i >= V.items.length){ placeResult(); return; }
  const it = V.items[V.i++]; const w = it.w; setScore(V.i - 1, V.items.length);
  const opts = shuffle(meaningChoices(w));
  const asHear = hasSpeech && Math.random() < 0.5;
  P.innerHTML = `<p class="q">Words ${V.i} / ${V.items.length}</p>
    ${asHear ? `<div class="hear-stage"><button class="speaker" id="rp" aria-label="Replay">${SPEAKER_SVG}</button></div>` : bigWordHTML(w)}
    <div class="opts" id="o"></div>`;
  if(asHear){ const btn = $("rp"); speak(w.w, btn); btn.onclick = ()=>speak(w.w, btn); }
  opts.forEach(o => {
    const b = document.createElement("button"); b.textContent = o;
    b.onclick = () => { PL.res[it.b].n++; if(o===VC.gloss(w)) PL.res[it.b].r++; placeVocabNext(); };
    $("o").appendChild(b);
  });
}
function placeResult(){
  setScore(0,0);
  const st = PL.st;
  const stop = VC.placementStopIndex(PL.res);
  const passed = stop==null ? st.length : stop;
  prog = VC.applyPlacement(prog, st, passed, WORDS, PACK);
  store.save();
  // Position shown is where the learner actually is now (a poor retake never moves
  // them back), not merely where this attempt stopped.
  const nn = nextNewSet();
  const pos = nn ? `${levelLabel(nn.lv)}, set ${nn.set+1}` : "everything covered";
  const P = $("panel");
  P.innerHTML = `<div class="done"><h2>Start at ${escapeHtml(pos)}</h2>
    <table class="stats">${st.map((b,i)=>{ const r = PL.res[i]; return `<tr><td>${escapeHtml(levelLabel(b.lv))} sets ${b.s0+1}–${b.s1}</td><td style="color:${i<passed?'var(--ok)':'var(--bad)'}">${r.r}/${r.n}</td></tr>`; }).join("")}</table>
    <p class="q">${learnedWords().length} words learned; newly placed ones are provisional and kept in review.</p>
    <button class="next" id="ok">Go to Today</button></div>`;
  $("ok").onclick = () => { switchToTab("today", "Today"); testSel = null; render(); };
}

// ===================== Progress =====================
function progressRender(){

    const sentLv = SENTENCES.filter(s=>s.lv===lv); const sentAvailLv = availSent.filter(s=>s.lv===lv);
    const sentMasteredN = sentAvailLv.filter(s=>sentenceMastered(s.id)).length;
    const L = escapeHtml(levelLabel(lv));
    return `<tr><td>${L}</td><td>${learnedList.length} / ${list.length} learned · ${masteredN} mastered</td></tr>

  }).join("");
  const weak = weakFirst(lwAll.filter(w=>VC.weakScore(prog.w[w.id])>0), 10);
  const cp = HAS_CHARACTERS ? charProgress() : null;

    <table class="stats">${rows}${cp ? cp.rows : ""}
      ${HAS_PASSAGES ? VC.readingStats(PASSAGE_LIST, PACK, prog).map(r => `<tr><td>${escapeHtml(levelLabel(r.lv))} reading</td><td>${r.done} / ${r.total} passages${r.avg != null ? ` · avg ${r.avg}%` : ""}</td></tr>`).join("") : ""}
      ${HAS_LESSONS ? `<tr><td>Sounds</td><td>${LESSON_LIST.filter(l=>prog.lessons[l.id]).length} / ${LESSON_LIST.length} lessons done</td></tr>` : ""}
      <tr><td>Sessions</td><td>${prog.sessions||0}</td></tr></table>
    ${PACK.showPron !== false ? `<div class="row" style="margin-top:14px"><button class="chip ${showPron()?'on':''}" id="togglePron" aria-pressed="${showPron()}">Show pronunciation</button></div>` : ""}${cp ? cp.controls : ""}
    <p class="q" style="margin-top:14px">${weak.length ? "Weakest words" : "No weak words yet — nice."}</p>
    ${weak.map(w=>`<div class="rowset">${wordRowHTML(w, "rowset")}</div>`).join("")}
    <div class="row" style="margin-top:16px">
      <button class="ghost" id="exp" style="flex:1">Export progress</button>
      <button class="ghost" id="imp" style="flex:1">Import progress</button>
    </div>
    <div id="impbox" style="display:none;margin-top:10px">
      <textarea id="imptxt" placeholder="Paste exported JSON here"></textarea>
      <input type="file" id="impfile" accept="application/json" style="margin-top:8px">
      <button class="next" id="doimport">Load</button>
      <div id="impErr" class="warn" style="display:none;margin-top:8px"></div>${HAS_LEGACY ? `
      <div id="impSum" class="stmt" style="display:none;margin-top:8px"></div>` : ""}
    </div>
    <button class="ghost" id="reset" style="margin-top:16px;color:var(--bad);border-color:var(--bad)">Reset all progress</button>`;
  if(PACK.showPron !== false) $("togglePron").onclick = () => { prog.showPron = !showPron(); store.save(); progressRender(); };
  if(cp) cp.wire();
  $("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(prog, null, 1)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `${STORE_KEY}_progress.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  $("imp").onclick = () => { $("impbox").style.display = $("impbox").style.display==="none" ? "block" : "none"; };
  $("impfile").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $("imptxt").value = r.result; }; r.readAsText(f); };
  const showImportError = msg => { const el = $("impErr"); el.textContent = msg; el.style.display = "block"; };
  // Backup first; if it can't be written (read-only session, storage error) the import is
  // not applied, so the current progress is never lost unbacked.
  const applyImported = async next => {
    if(!(await store.backup("pre_import_backup", JSON.stringify(prog)))){ showImportError("Import not applied: the current progress couldn't be backed up first (storage unavailable)."); return; }
    prog = next;
    store.save(); applyTheme(); progressRender();
  };
  $("doimport").onclick = async () => {
    try{
      const text = $("imptxt").value;
      // A predecessor app's export (pack.legacy) goes through VC.migrateLegacy, and its
      // summary (counts, anything that has no place here) is shown before applying.
      const parsed = HAS_LEGACY ? VC.parseStored(text) : null;
      if(parsed && parsed.ok && VC.isLegacyRecord(PACK, LEGACY_MAP, parsed.data)){
        const m = VC.migrateLegacy(PACK, LEGACY_MAP, parsed.data);
        if(!m.ok){ showImportError("That looks like progress from the older app, but it could not be converted: " + m.reason); return; }
        // Like applyImport: what the file doesn't carry keeps the current value.
        if(parsed.data.theme === undefined) m.prog.theme = prog.theme;
        if(prog.showPron !== undefined) m.prog.showPron = prog.showPron;
        if(m.prog.chars && prog.chars && parsed.data.mixChars === undefined) m.prog.chars.mix = prog.chars.mix !== false;
        $("impErr").style.display = "none";
        const box = $("impSum");
        box.innerHTML = `${legacySummaryHTML(m, "the file you imported")}<button class="next" id="impApply" style="margin-top:8px">Import this progress</button><button class="ghost" id="impCancel" style="margin-top:8px">Cancel</button>`;
        box.style.display = "block";
        $("impApply").onclick = () => applyImported(m.prog);
        $("impCancel").onclick = () => { box.style.display = "none"; box.innerHTML = ""; };
        return;
      }
      const r = VC.applyImport(prog, text, PACK);
      if(!r.ok){ showImportError("That doesn't look like valid exported progress for this pack: " + r.reason); return; }
      await applyImported(r.prog);
    }catch(e){
      showImportError("That doesn't look like valid exported progress: " + (e && e.message ? e.message : "could not be read"));
    }
  };
  $("reset").onclick = async () => {
    if(!confirm(`Reset all progress? A copy is kept under ${STORE_KEY}_reset_backup until the next reset.`)) return;
    if(!(await store.backup("reset_backup", JSON.stringify(prog)))){ alert("Reset cancelled: the current progress couldn't be backed up first (storage unavailable)."); return; }
    // defaultProg: with pack.characters that includes fresh prog.chars (records, order,
    // choice and mix all cleared). Only this pack's own key and its _reset_backup are
    // written; the legacy key and its backup (pack.legacy) are never touched.
    prog = Object.assign(VC.defaultProg(PACK), { theme: prog.theme, showPron: prog.showPron });
    store.save(); progressRender();
  };
}
// Progress additions for pack.characters: one row per character stage (taught = units in
// fully taught sets, recorded = units with a record, mastered/bare by streak), and the
// controls: the path strip, the learning-order chips (VC.setCharOrder: reversible, flips
// the path only) and the mix chip (prog.chars.mix: known units' written form in sentences).
function charProgress(){
  const stages = VC.stagePath(PACK, WORDS, CHAR_LIST, prog).filter(s => s.kind === "chars");
  const recs = VC.charRecs(prog);
  const streak = u => ((recs[u.id] || {}).s || 0);
  const rows = stages.map(st => {
    const list = VC.charStageUnits(st.levels, CHAR_LIST, PACK);
    const taught = VC.charSets(st.levels, CHAR_LIST, PACK).filter(set => VC.charSetTaught(set, prog)).reduce((n, set) => n + set.length, 0);
    const masteredN = list.filter(u => recs[u.id] && VC.charTier(streak(u), PACK) !== "pron").length;
    const bareN = list.filter(u => recs[u.id] && VC.charTier(streak(u), PACK) === "bare").length;
    return `<tr><td>${tw(st.label)}</td><td>${taught} / ${list.length} taught · ${st.recorded} recorded · ${masteredN} mastered · ${bareN} bare</td></tr>`;
  }).join("");
  const unlocked = VC.charsUnlocked(PACK, WORDS, prog), started = VC.charsStarted(PACK, WORDS, CHAR_LIST, prog);
  const defer = !!(prog.chars && prog.chars.defer === true);
  const deferred = VC.charStages(PACK, Object.assign({}, prog, { chars: Object.assign({}, prog.chars, { defer: true }) }));
  const top = deferred.length ? levelLabel(deferred[0].after) : "";
  const mix = !!(prog.chars && prog.chars.mix !== false);
  const showMix = started; // mixing changes nothing until characters have started
  const controls = (unlocked || showMix) ? `<div id="charCtl" style="margin-top:14px">${pathStrip()}
    ${showMix ? `<div class="row"><button class="chip ${mix ? "on" : ""}" id="toggleMix" aria-pressed="${mix}">Mix known characters into sentences</button></div>` : ""}
    ${unlocked ? `<div class="row"><button class="chip ${defer ? "" : "on"}" id="ordBefore" aria-pressed="${!defer}">Characters before ${escapeHtml(top)}</button><button class="chip ${defer ? "on" : ""}" id="ordAfter" aria-pressed="${defer}">Characters after ${escapeHtml(top)}</button></div>
    <p class="q" style="margin-top:6px">Changes what Today's Learn step teaches next. Nothing you've learned is lost.</p>` : ""}</div>` : "";
  const wire = () => {
    if(showMix) $("toggleMix").onclick = () => { VC.ensureChars(prog).mix = !mix; store.save(); progressRender(); };
    if(unlocked){
      $("ordBefore").onclick = () => { VC.setCharOrder(prog, false); store.save(); progressRender(); };
      $("ordAfter").onclick = () => { VC.setCharOrder(prog, true); store.save(); progressRender(); };
    }
  };
  return { rows, controls, wire };
}
// What a legacy migration brought over (VC.migrateLegacy result m): record counts, the
// retired settings, and every part of the old record with no place here, which survives
// in `kept` (the backup key at boot, the imported file on import).
function legacySummaryHTML(m, kept){
  const p = m.prog, n = o => Object.keys(o || {}).length;
  const setsN = Object.values(p.sets || {}).reduce((a, b) => a + (b || 0), 0);
  const parts = [`${n(p.w)} word records`, `${n(p.s)} sentence records`];
  if(p.chars) parts.push(`${n(p.chars.c)} ${tw(CHAR_CFG ? CHAR_CFG.label : "")} records`);
  parts.push(`${setsN} sets done`, `${p.sessions || 0} sessions`);
  const LIST_MAX = 20;
  const um = m.unmapped || [];
  const umHTML = um.length ? `<p class="q" style="margin:8px 0 4px">${um.length} part${um.length > 1 ? "s" : ""} of the old record ${um.length > 1 ? "have" : "has"} no place here and ${um.length > 1 ? "were" : "was"} not brought over (kept in ${escapeHtml(kept)}):</p><ul id="legacyUnmapped" style="margin:0;padding-left:20px;font-size:14px">${um.slice(0, LIST_MAX).map(u => `<li><bdi>${escapeHtml(u.path)}</bdi>: ${escapeHtml(u.reason)}</li>`).join("")}${um.length > LIST_MAX ? `<li>and ${um.length - LIST_MAX} more</li>` : ""}</ul>` : "";
  const dr = (m.dropped || []).map(d => d.path);
  const drHTML = dr.length ? `<p class="q" style="margin:8px 0 0">Settings this app doesn't have, left out: ${escapeHtml(dr.join(", "))}.</p>` : "";
  return `<div>Progress from the older app: ${parts.join(", ")}.</div>${umHTML}${drHTML}`;
}

$("themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");

// ===================== boot =====================
// The predecessor app's record (localStorage[pack.legacy.key]) -> {m} (VC.migrateLegacy
// result), {fail: why} when a record is (or may be) there but was not imported, or null
// when there is nothing to import. The raw string is first copied to VC.legacyBackupKey(pack)
// unless that key already holds something (the first backup is never overwritten); the
// legacy key itself is only read.
async function legacyBootMigration(){
  const old = await store.getRaw(PACK.legacy.key);
  if(!old.ok) return { fail: "it could not be read (storage error)" };
  if(old.value == null || old.value === "") return null;
  const m = VC.migrateLegacy(PACK, LEGACY_MAP, old.value);
  if(!m.ok){ console.warn(`${PACK.legacy.key}: not migrated (${m.reason})`); return { fail: `it could not be converted (${m.reason})` }; }
  const bk = VC.legacyBackupKey(PACK);
  const had = await store.getRaw(bk);
  if(!had.ok) return { fail: `its safety copy (${bk}) could not be checked (storage error)` };
  if((had.value == null || had.value === "") && !(await store.setRaw(bk, String(old.value)))) return { fail: `its safety copy (${bk}) could not be saved (storage error)` };
  if(m.unmapped.length) console.warn(`${PACK.legacy.key}: ${m.unmapped.length} unmapped part(s), kept in ${bk}`, m.unmapped);
  return { m };
}
// Boot found an old-app record it could not import: this session saves nothing (store
// read-only), so this pack's key stays empty and the next boot tries the import again.
// "Start without it" lifts that and saves from here on (the old record stays untouched).
function legacyFailHTML(why){
  return `<div>Progress from the older app was found but not imported: ${escapeHtml(why)}. It is left untouched, and nothing you do now is saved, so the import runs again the next time this page loads. Reload to try again, or start without it.</div>`;
}
(async function(){
  // VC.bootProg: unparseable / invalid stored progress is preserved under
  // <key>_invalid_backup before defaults take over; sets for levels the pack no
  // longer has are dropped (warned), everything else kept.
  const got = await store.load();
  // Legacy migration (pack.legacy, core.js "legacy migration" contract): only when this
  // pack's own key read fine and holds nothing.
  const lm = (HAS_LEGACY && got.ok && (got.value == null || got.value === "")) ? await legacyBootMigration() : null;
  const mig = lm && lm.m;
  if(mig){
    prog = mig.prog;
    applyTheme();
    await store.save();
    legacyNotice = legacySummaryHTML(mig, VC.legacyBackupKey(PACK));
    booted = true;
    render();
    return;
  }
  if(lm && lm.fail){
    storeReadOnly = true;
    legacyFail = lm.fail;
  }
  const b = VC.bootProg(got.value, PACK, !got.ok);
  if(b.readOnly){
    storeReadOnly = true;
    storageWarn("Saved progress could not be read (storage error), so this session is read-only: nothing you do now will be saved, and your stored progress is left untouched. Reload to try again.");
  }
  if(b.backupRaw !== null){ console.warn(`${STORE_KEY}: stored progress unusable (${b.reason}); kept as ${STORE_KEY}_invalid_backup`); await store.backup("invalid_backup", b.backupRaw); }
  if(b.dropped.length) console.warn(`${STORE_KEY}: dropped progress for unknown levels: ${b.dropped.join(", ")}`);
  prog = b.prog;
  applyTheme();
  booted = true;
  render();
})();

// ===================== offline (service worker) =====================
// build.sh writes sw.js next to the built page (engine/sw.template.js). Registration is a
// no-op on file://, where navigator.serviceWorker is missing (old browsers, the Node test
// harness), and harmlessly fails in dev mode over http (no sw.js next to app.html).
// A new build activates in the background; the page keeps running and a toast offers a
// reload. On a first visit (no controller yet) the worker taking control is not an update.
// Registered after window load, so a first visit's install (which fetches the page again
// to precache it) never competes with boot.
(function(){
  if(typeof navigator === "undefined" || !navigator.serviceWorker) return;
  if(typeof location === "undefined" || !/^https?:$/.test(location.protocol)) return;
  const sw = navigator.serviceWorker;
  const wasControlled = !!sw.controller;
  sw.addEventListener("controllerchange", () => {
    if(!wasControlled || $("swtoast")) return;
    const t = document.createElement("button");
    t.id = "swtoast"; t.className = "swtoast"; t.textContent = "Updated, reload for the new version";
    t.onclick = () => location.reload();
    document.body.appendChild(t);
  });
  const reg = () => { sw.register("sw.js").catch(() => {}); };
  if(document.readyState === "complete") reg(); else window.addEventListener("load", reg);
})();
</script>
