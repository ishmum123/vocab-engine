  drillKeyHandler = e => {
    if(e.target && e.target.closest && e.target.closest("[data-pw]")) return;
    if(e.key >= "1" && e.key <= String(order.length) && rec.ok === null) box.children[+e.key-1].click();

}
function markPassageFinished(){

// ===================== Test (placement + free tests) =====================
function testRender(){
  screenTop();

  const P = $("panel");
  if(testSel === "placement"){ placeRender(); return; }
  const lw = learnedWords(); const availSent = availableSentences();
  const tg = VC.testGates(lw.length, availSent.length);
  const needMore = tg.needPlacement;
  const n20 = Math.min(20, lw.length), sentN = Math.min(20, availSent.length);
  // Characters N (pack.characters, predecessor-app parity): recorded units weakest first, topped up to
  // 20 with learned words' unrecorded units, each a pack testKinds kind (VC.charTestPlan).
  // Shown once characters have started (VC.charsStarted), not only once a record exists.
  const charPlan = () => VC.charTestPlan(CHAR_LIST, learnedWords(), prog, PACK, 20);
  const charN = HAS_CHARACTERS && VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU) ? charPlan().length : 0;
  P.innerHTML = `<p class="q">Placement finds where to start. Free tests draw from what's already learned.</p>
    <div class="actions">
      ${needMore ? `<div class="stmt">Free tests unlock at ${VC.TEST_MIN_WORDS} learned words (${lw.length} so far). Learn ${VC.TEST_MIN_WORDS} words first, or let placement find where to start.<button class="next" id="needPlace" style="margin-top:8px">Take the placement test</button></div>` : `<button class="next" id="pl">Take Placement</button>`}
      ${tg.words ? `<div class="row" style="margin-top:8px;margin-bottom:0">
        <button class="ghost" id="tListen" style="flex:1">Listen ${n20}</button>
        <button class="ghost" id="tRecall" style="flex:1">Recall ${n20}</button>
      </div>` : ""}
      ${tg.sentences ? `<button class="ghost" id="tSentences">Sentences ${sentN}</button>` : ""}${charN ? `
      <button class="ghost" id="tChars">Characters ${charN}</button>` : ""}
    </div>`;
  if(needMore) $("needPlace").onclick = enterPlacementFromToday;
  else $("pl").onclick = () => { testSel = "placement"; testRender(); };
  if(tg.words){
    $("tListen").onclick = () => drill(weakFirst(lw,20).map(hearItem), testRender, missSummary);
    $("tRecall").onclick = () => drill(VC.buildRecallPlan(lw, prog, PACK, 20).map(itemFromPlan), testRender, missSummary);

function placementItemTotal(){ return VC.strata(WORDS, PACK.placement, SIZE).reduce((n,_,i)=>n+VC.placementItemCount(i), 0); }
function placeRender(){
  D = null; drillKeyHandler = null; setScore(0,0);

function startPlacement(){

function placeVocabNext(){

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `${STORE_KEY}_progress.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  // The import box, its error and its summary open below the last buttons of a long screen.
  $("imp").onclick = () => { const b = $("impbox"), open = b.style.display === "none"; b.style.display = open ? "block" : "none"; if(open) bringIntoView(b); };
  $("impfile").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $("imptxt").value = r.result; }; r.readAsText(f); };
  const showImportError = msg => { const el = $("impErr"); el.textContent = msg; el.style.display = "block"; bringIntoView(el); };
  // Backup first; if it can't be written (read-only session, storage error) the import is
  // not applied, so the current progress is never lost unbacked.
  const applyImported = async next => {
    if(!(await store.backup("pre_import_backup", JSON.stringify(prog)))){ showImportError("Import not applied: the current progress couldn't be backed up first (storage unavailable)."); return; }
    prog = next;
    store.save(); applyTheme(); progressRender();
  };
  $("doimport").onclick = async () => {
    try{
      const text = $("imptxt").value;
      // A predecessor app's export (pack.legacy) goes through VC.migrateLegacy, and its
      // summary (counts, anything that has no place here) is shown before applying.
      const parsed = HAS_LEGACY ? VC.parseStored(text) : null;
      if(parsed && parsed.ok && VC.isLegacyRecord(PACK, LEGACY_MAP, parsed.data)){
        const m = VC.migrateLegacy(PACK, LEGACY_MAP, parsed.data);
        if(!m.ok){ showImportError("That looks like progress from the older app, but it could not be converted: " + m.reason); return; }
        // Like applyImport: what the file doesn't carry keeps the current value.
        if(parsed.data.theme === undefined) m.prog.theme = prog.theme;
        if(prog.showPron !== undefined) m.prog.showPron = prog.showPron;
        if(m.prog.chars && prog.chars && parsed.data.mixChars === undefined) m.prog.chars.mix = prog.chars.mix !== false;
        $("impErr").style.display = "none";
        const box = $("impSum");
        box.innerHTML = `${legacySummaryHTML(m, "the file you imported")}<button class="next" id="impApply" style="margin-top:8px">Import this progress</button><button class="ghost" id="impCancel" style="margin-top:8px">Cancel</button>`;
        box.style.display = "block"; bringIntoView(box);
        $("impApply").onclick = () => applyImported(m.prog);
        $("impCancel").onclick = () => { box.style.display = "none"; box.innerHTML = ""; };
        return;
      }
      const r = VC.applyImport(prog, text, PACK);
      if(!r.ok){ showImportError("That doesn't look like valid exported progress for this pack: " + r.reason); return; }
      await applyImported(r.prog);
    }catch(e){
      showImportError("That doesn't look like valid exported progress: " + (e && e.message ? e.message : "could not be read"));
    }
  };
  $("reset").onclick = async () => {
    if(!confirm(`Reset all progress? A copy is kept under ${STORE_KEY}_reset_backup until the next reset.`)) return;
    if(!(await store.backup("reset_backup", JSON.stringify(prog)))){ alert("Reset cancelled: the current progress couldn't be backed up first (storage unavailable)."); return; }
    // defaultProg: with pack.characters that includes fresh prog.chars (records, order,
    // choice and mix all cleared). Only this pack's own key and its _reset_backup are
    // written; the legacy key and its backup (pack.legacy) are never touched.
    prog = Object.assign(VC.defaultProg(PACK), { theme: prog.theme, showPron: prog.showPron });
    store.save(); progressRender();
  };
}
// Progress additions for pack.characters: one row per character stage (taught = units in
// fully taught sets, recorded = units with a record, mastered/bare by streak), shown only
// once characters have started (VC.charsStarted: no rows while the stage is locked), and the
// controls: the path strip, the learning-order chips (VC.setCharOrder: reversible, flips
// the path only) and the mix chip (prog.chars.mix: known units' written form in sentences).
function charProgress(){
  const stages = VC.stagePath(PACK, WORDS, CHAR_LIST, prog, SU).filter(s => s.kind === "chars");
  const recs = VC.charRecs(prog);
  const streak = u => ((recs[u.id] || {}).s || 0);
  const unlocked = VC.charsUnlocked(PACK, WORDS, prog), started = VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU);
  const rows = !started ? "" : stages.map(st => {
    const list = VC.charStageUnits(st.levels, CHAR_LIST, PACK);
    const taught = VC.charSets(st.levels, CHAR_LIST, PACK).filter(set => VC.charSetTaught(set, prog)).reduce((n, set) => n + set.length, 0);
    const masteredN = list.filter(u => recs[u.id] && VC.charTier(streak(u), PACK) !== "pron").length;
    const bareN = list.filter(u => recs[u.id] && VC.charTier(streak(u), PACK) === "bare").length;
    return `<tr><td>${tf(st.label)}</td><td>${taught} / ${list.length} taught · ${st.recorded} recorded · ${masteredN} mastered · ${bareN} bare</td></tr>`;
  }).join("");
  const defer = !!(prog.chars && prog.chars.defer === true);
  const deferred = VC.charStages(PACK, Object.assign({}, prog, { chars: Object.assign({}, prog.chars, { defer: true }) }));
  const top = deferred.length ? levelLabel(deferred[0].after) : "";
  const mix = !!(prog.chars && prog.chars.mix !== false);
  const showMix = started; // mixing changes nothing until characters have started
  const controls = (unlocked || showMix) ? `<div id="charCtl" style="margin-top:14px">${pathStrip()}
    ${showMix ? `<div class="row"><button class="chip ${mix ? "on" : ""}" id="toggleMix" aria-pressed="${mix}">Mix known characters into sentences</button></div>` : ""}
    ${unlocked ? `<div class="row"><button class="chip ${defer ? "" : "on"}" id="ordBefore" aria-pressed="${!defer}">Characters before ${escapeHtml(top)}</button><button class="chip ${defer ? "on" : ""}" id="ordAfter" aria-pressed="${defer}">Characters after ${escapeHtml(top)}</button></div>
    <p class="q" style="margin-top:6px">Changes what Today's Learn step teaches next. Nothing you've learned is lost.</p>` : ""}</div>` : "";
  const wire = () => {
    if(showMix) $("toggleMix").onclick = () => { VC.ensureChars(prog).mix = !mix; store.save(); progressRender(); };
    if(unlocked){
      $("ordBefore").onclick = () => { VC.setCharOrder(prog, false); store.save(); progressRender(); };
      $("ordAfter").onclick = () => { VC.setCharOrder(prog, true); store.save(); progressRender(); };
    }
  };
  return { rows, controls, wire };
}
// Progress additions for pack.script: one row per primer stage (taught = units in fully
// taught sets, mastered by streak), a "Script mastered" line once every unit is, and the
// on/off chips (VC.setScriptSkipped: flips one flag, the path is re-derived; with several
// stages, one chip per stage while the primer is on).
function scriptProgress(){
  const recs = VC.scriptRecs(prog);
  const isM = u => !!recs[u.id] && VC.scriptMastered(recs[u.id], PACK);
  let rows = SCFG.stages.map(st => {
    const list = VC.scriptStageUnits(st.key, SUNITS);
    const taught = VC.scriptSets(st.key, SUNITS).filter(set => VC.scriptSetTaught(set, prog)).reduce((n, set) => n + set.length, 0);
    return `<tr><td>${tf(st.label)}</td><td>${taught} / ${list.length} taught · ${list.filter(isM).length} mastered</td></tr>`;
  }).join("");
  if(SUNITS.every(isM)) rows += `<tr id="xMastered"><td colspan="2">Script mastered</td></tr>`;
  const off = VC.scriptSkipped(prog);
  const stageOn = st => !(prog.script && prog.script.skip && prog.script.skip[st.key] === true);
  const multi = SCFG.stages.length > 1;
  const controls = `<div id="scriptCtl" style="margin-top:14px"><div class="row"><button class="chip ${off ? "" : "on"}" id="xOn" aria-pressed="${!off}">Script primer on</button><button class="chip ${off ? "on" : ""}" id="xOff" aria-pressed="${off}">Script primer off</button></div>
    ${multi && !off ? `<div class="row">${SCFG.stages.map((st, i) => `<button class="chip ${stageOn(st) ? "on" : ""}" id="xSt${i}" aria-pressed="${stageOn(st)}">${tf(st.label)}</button>`).join("")}</div>` : ""}
    <p class="q" style="margin-top:6px">Changes what Today's Learn step teaches next. Nothing you've learned is lost.</p></div>`;
  const wire = () => {
    $("xOn").onclick = () => { VC.setScriptSkipped(prog, false); store.save(); progressRender(); };
    $("xOff").onclick = () => { VC.setScriptSkipped(prog, true); store.save(); progressRender(); };
    if(multi && !off) SCFG.stages.forEach((st, i) => { $("xSt" + i).onclick = () => { VC.setScriptSkipped(prog, stageOn(st), st.key); store.save(); progressRender(); }; });
  };
  return { rows, controls, wire };
}
// What a legacy migration brought over (VC.migrateLegacy result m): record counts, the
// retired settings, and every part of the old record with no place here, which survives
// in `kept` (the backup key at boot, the imported file on import).
function legacySummaryHTML(m, kept){
  const p = m.prog, n = o => Object.keys(o || {}).length;
  const setsN = Object.values(p.sets || {}).reduce((a, b) => a + (b || 0), 0);
  const parts = [`${n(p.w)} word records`, `${n(p.s)} sentence records`];
  if(p.chars) parts.push(`${n(p.chars.c)} ${tf(CHAR_CFG ? CHAR_CFG.label : "")} records`);
  parts.push(`${setsN} sets done`, `${p.sessions || 0} sessions`);
  const LIST_MAX = 20;
  const um = m.unmapped || [];
  const umHTML = um.length ? `<p class="q" style="margin:8px 0 4px">${um.length} part${um.length > 1 ? "s" : ""} of the old record ${um.length > 1 ? "have" : "has"} no place here and ${um.length > 1 ? "were" : "was"} not brought over (kept in ${escapeHtml(kept)}):</p><ul id="legacyUnmapped" style="margin:0;padding-left:20px;font-size:14px">${um.slice(0, LIST_MAX).map(u => `<li><bdi>${escapeHtml(u.path)}</bdi>: ${escapeHtml(u.reason)}</li>`).join("")}${um.length > LIST_MAX ? `<li>and ${um.length - LIST_MAX} more</li>` : ""}</ul>` : "";
  const dr = (m.dropped || []).map(d => d.path);
  const drHTML = dr.length ? `<p class="q" style="margin:8px 0 0">Settings this app doesn't have, left out: ${escapeHtml(dr.join(", "))}.</p>` : "";
  return `<div>Progress from the older app: ${parts.join(", ")}.</div>${umHTML}${drHTML}`;
}

// ===================== theme =====================
function applyTheme(){ document.documentElement.setAttribute("data-theme", prog.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); }
$("themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  prog.theme = cur === "dark" ? "light" : "dark";
  applyTheme(); store.save();
};

// ===================== boot =====================
// The predecessor app's record (localStorage[pack.legacy.key]) -> {m} (VC.migrateLegacy
// result), {fail: why} when a record is (or may be) there but was not imported, or null
// when there is nothing to import. The raw string is first copied to VC.legacyBackupKey(pack)
// unless that key already holds something (the first backup is never overwritten); the
// legacy key itself is only read.
async function legacyBootMigration(){
  const old = await store.getRaw(PACK.legacy.key);
  if(!old.ok) return { fail: "it could not be read (storage error)" };
  if(old.value == null || old.value === "") return null;
  const m = VC.migrateLegacy(PACK, LEGACY_MAP, old.value);
  if(!m.ok){ console.warn(`${PACK.legacy.key}: not migrated (${m.reason})`); return { fail: `it could not be converted (${m.reason})` }; }
  const bk = VC.legacyBackupKey(PACK);
  const had = await store.getRaw(bk);
  if(!had.ok) return { fail: `its safety copy (${bk}) could not be checked (storage error)` };
  if((had.value == null || had.value === "") && !(await store.setRaw(bk, String(old.value)))) return { fail: `its safety copy (${bk}) could not be saved (storage error)` };
  if(m.unmapped.length) console.warn(`${PACK.legacy.key}: ${m.unmapped.length} unmapped part(s), kept in ${bk}`, m.unmapped);
  return { m };
}
// Boot found an old-app record it could not import: this session saves nothing (store
// read-only), so this pack's key stays empty and the next boot tries the import again.
// "Start without it" lifts that and saves from here on (the old record stays untouched).
function legacyFailHTML(why){
  return `<div>Progress from the older app was found but not imported: ${escapeHtml(why)}. It is left untouched, and nothing you do now is saved, so the import runs again the next time this page loads. Reload to try again, or start without it.</div>`;
}
(async function(){
  // VC.bootProg: unparseable / invalid stored progress is preserved under
  // <key>_invalid_backup before defaults take over; sets for levels the pack no
  // longer has are dropped (warned), everything else kept.
  const got = await store.load();
  // Legacy migration (pack.legacy, core.js "legacy migration" contract): only when this
  // pack's own key read fine and holds nothing.
  const lm = (HAS_LEGACY && got.ok && (got.value == null || got.value === "")) ? await legacyBootMigration() : null;
  const mig = lm && lm.m;
  if(mig){
    prog = mig.prog;
    applyTheme();
    await store.save();
    legacyNotice = legacySummaryHTML(mig, VC.legacyBackupKey(PACK));
    booted = true;
    render();
    return;
  }
  if(lm && lm.fail){
    storeReadOnly = true;
    legacyFail = lm.fail;
  }
  const b = VC.bootProg(got.value, PACK, !got.ok);
  if(b.readOnly){
    storeReadOnly = true;
    storageWarn("Saved progress could not be read (storage error), so this session is read-only: nothing you do now will be saved, and your stored progress is left untouched. Reload to try again.");
  }
  if(b.backupRaw !== null){ console.warn(`${STORE_KEY}: stored progress unusable (${b.reason}); kept as ${STORE_KEY}_invalid_backup`); await store.backup("invalid_backup", b.backupRaw); }
  if(b.dropped.length) console.warn(`${STORE_KEY}: dropped progress for unknown levels: ${b.dropped.join(", ")}`);
  prog = b.prog;
  applyTheme();
  booted = true;
  render();
})();

// ===================== offline (service worker) =====================
// build.sh writes sw.js next to the built page (engine/sw.template.js). Registration is a
// no-op on file://, where navigator.serviceWorker is missing (old browsers, the Node test
// harness), and harmlessly fails in dev mode over http (no sw.js next to app.html).
// A new build activates in the background; the page keeps running and a toast offers a
// reload. On a first visit (no controller yet) the worker taking control is not an update.
// Registered after window load, so a first visit's install (which fetches the page again
// to precache it) never competes with boot.
(function(){
  if(typeof navigator === "undefined" || !navigator.serviceWorker) return;
  if(typeof location === "undefined" || !/^https?:$/.test(location.protocol)) return;
  const sw = navigator.serviceWorker;
  const wasControlled = !!sw.controller;
  sw.addEventListener("controllerchange", () => {
    if(!wasControlled || $("swtoast")) return;
    const t = document.createElement("button");
    t.id = "swtoast"; t.className = "swtoast"; t.textContent = "Updated, reload for the new version";
    t.onclick = () => location.reload();
    document.body.appendChild(t);
  });
  const reg = () => { sw.register("sw.js").catch(() => {}); };
  if(document.readyState === "complete") reg(); else window.addEventListener("load", reg);
})();
</script>
</body>
